<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>地震 · ESP32 终端服务器</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="/theme.css?v=20261108b">
<style>
  .chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
  .chips button{font-size:12px;padding:4px 10px;border-radius:999px;cursor:pointer;
    border:1px solid var(--line);background:var(--bg3);color:var(--fg2);font-family:inherit}
  .chips button.on{border-color:var(--acc);color:var(--acc);background:rgba(255,106,0,.12)}
  .chips .lbl{font-size:11.5px;color:var(--fg2);align-self:center;margin-right:2px}

  .q{display:flex;gap:10px;align-items:flex-start;padding:10px 0;
    border-top:1px solid var(--line)}
  .q:first-child{border-top:0}
  .q .mag{flex:0 0 46px;text-align:center;border-radius:8px;padding:4px 0;
    font-size:16px;font-weight:600;font-variant-numeric:tabular-nums}
  .m6{background:rgba(226,60,60,.18);color:#e23c3c}
  .m5{background:rgba(240,120,40,.18);color:#e07a1f}
  .m4{background:rgba(230,190,40,.18);color:#b8901a}
  .m0{background:var(--bg3);color:var(--fg2)}
  .q .mi{min-width:0;flex:1}
  .q .pl{font-size:13.5px;line-height:1.45;word-break:break-all}
  .q .mt{font-size:11.5px;color:var(--fg2);margin-top:3px;
    font-variant-numeric:tabular-nums}
  .empty{padding:20px 0;text-align:center}
  .sum{display:flex;gap:16px;flex-wrap:wrap;margin-bottom:4px}
  .sum .k{font-size:11.5px;color:var(--fg2)}
  .sum .v{font-size:15px;font-weight:600;margin-top:2px}
</style>
</head>
<body>

<div id="topbar"></div>

<div class="wrap">
  <div class="pgtop">
    <span class="upd" id="updAt">加载中…</span>
    <button class="btn" id="btnRefresh"><span class="ic">↻</span>刷新</button>
  </div>

  <div class="card">
    <div class="sum">
      <div><div class="k">近 7 天</div><div class="v" id="cAll">—</div></div>
      <div><div class="k">M4 以上</div><div class="v" id="c4">—</div></div>
      <div><div class="k">最大震级</div><div class="v" id="cMax">—</div></div>
    </div>
  </div>

  <div class="chips" id="magChips">
    <span class="lbl">筛选</span>
    <button data-m="0" class="on">全部</button>
    <button data-m="3">M3+</button>
    <button data-m="4">M4+</button>
    <button data-m="5">M5+</button>
  </div>

  <div class="card">
    <div id="list"><div class="skel"></div><div class="skel"></div><div class="skel"></div></div>
  </div>

  <p class="foot">
    数据经路由器转发中国地震台网（apihz 接口），本地按天存 CSV、只留 7 天。
    震级配色：<b style="color:#b8901a">M4</b> / <b style="color:#e07a1f">M5</b> /
    <b style="color:#e23c3c">M6+</b>。
  </p>
</div>

<script src="/ui.js?v=20261108b"></script>
<script>
"use strict";
MR.mountTop("地震");
var $ = MR.$, esc = MR.esc;

var ALL = [], MIN = 0;

function csvLine(s) {
  var out = [], cur = "", q = false, i, c;
  for (i = 0; i < s.length; i++) {
    c = s.charAt(i);
    if (q) {
      if (c === '"') {
        if (s.charAt(i + 1) === '"') { cur += '"'; i++; }
        else q = false;
      } else cur += c;
    } else if (c === '"') {
      q = true;
    } else if (c === ",") {
      out.push(cur); cur = "";
    } else cur += c;
  }
  out.push(cur);
  return out;
}

function pad2(n) { return n < 10 ? "0" + n : "" + n; }
function magCls(m) {
  if (m >= 6) return "m6";
  if (m >= 5) return "m5";
  if (m >= 4) return "m4";
  return "m0";
}

function render() {
  var items = ALL.filter(function (x) { return x.mag >= MIN; });
  if (!items.length) {
    $("list").innerHTML = '<div class="empty muted small">' +
      (ALL.length ? "没有达到该震级的地震" : "暂无数据，稍后自动刷新") + "</div>";
    return;
  }
  $("list").innerHTML = items.map(function (x) {
    return '<div class="q"><div class="mag ' + magCls(x.mag) + '">' +
      (x.mag ? x.mag.toFixed(1) : "—") + "</div>" +
      '<div class="mi"><div class="pl">' + esc(x.place || "位置未知") + "</div>" +
      '<div class="mt">' + esc(x.time) + " · 深 " + esc(x.depth || "—") + " km · " +
      // 经纬度保留两位就够看，省得一行太长
      (x.lat ? Number(x.lat).toFixed(1) + ", " + Number(x.lon).toFixed(1) : "") +
      "</div></div></div>";
  }).join("");
}

function load(force) {
  var b = $("btnRefresh");
  b.disabled = true;
  return MR.api("/api/quake" + (force ? "?force=1" : "")).then(function (d) {
    if (!d.ok) {
      $("updAt").textContent = d.msg || "准备中…";
      setTimeout(function () { load(true); }, 4000);
      return;
    }
    ALL = (d.rows || []).map(function (line) {
      var f = csvLine(line);
      // key, leve, addtime, weizhi, shendu, weidu, jingdu
      return {
        key: f[0], mag: Number(f[1]) || 0, time: f[2] || "",
        place: f[3] || "", depth: f[4] || "", lat: f[5] || "", lon: f[6] || ""
      };
    }).sort(function (a, b) { return a.time < b.time ? 1 : -1; });

    var m4 = 0, mx = 0;
    ALL.forEach(function (x) {
      if (x.mag >= 4) m4++;
      if (x.mag > mx) mx = x.mag;
    });
    $("cAll").textContent = ALL.length + " 次";
    $("c4").textContent = m4 + " 次";
    $("cMax").textContent = mx ? "M" + mx.toFixed(1) : "—";
    $("updAt").textContent = ALL.length
      ? "最近 " + (ALL[0].time || "").replace(/^\d{4}-/, "") : "无数据";
    render();
  }).catch(function () {
    $("updAt").textContent = "读取失败";
    $("list").innerHTML = '<div class="empty muted small">接口无响应，点刷新重试</div>';
  }).then(function () { b.disabled = false; });
}

$("magChips").addEventListener("click", function (e) {
  var t = e.target;
  if (t.tagName !== "BUTTON") return;
  MIN = Number(t.getAttribute("data-m")) || 0;
  [].forEach.call(this.querySelectorAll("button"), function (b) { b.className = ""; });
  t.className = "on";
  render();
});

$("btnRefresh").addEventListener("click", function () {
  $("updAt").textContent = "刷新中…";
  load(true);
});

load(false);
setInterval(function () { load(true); }, 10800000);   // 3 小时自动刷
</script>
</body>
</html>
