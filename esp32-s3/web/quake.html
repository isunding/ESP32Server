<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>地震 · ESP32 终端服务器</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="/theme.css?v=20261108b">
</head>
<body>

<div id="topbar"></div>

<div class="wrap">
  <div class="pgtop">
    <span class="upd" id="updAt">加载中…</span>
    <button class="btn" id="btnRefresh"><span class="ic">↻</span>刷新</button>
  </div>

  <div class="chips" id="scopeChips">
    <span class="lbl">范围</span>
    <button data-s="cn" class="on">国内</button>
    <button data-s="global">全球（含海外）</button>
    <button data-s="usgs">USGS 全球</button>
  </div>

  <div class="card">
    <div class="fsum">
      <div><div class="k">近 7 天</div><div class="v" id="cAll">—</div></div>
      <div><div class="k">M4 以上</div><div class="v" id="c4">—</div></div>
      <div><div class="k">最大震级</div><div class="v" id="cMax">—</div></div>
    </div>
  </div>

  <div class="chips" id="magChips">
    <span class="lbl">筛选</span>
    <button data-m="0" class="on">全部</button>
    <button data-m="3">M3+</button>
    <button data-m="4">M4+</button>
    <button data-m="5">M5+</button>
  </div>

  <div id="list" class="feed"><div class="skel"></div><div class="skel"></div><div class="skel"></div></div>

  <p class="foot">
    国内速报、全球震情速报与 USGS 三路数据经路由器转发，各自按天存 CSV、只留 7 天。
    USGS 为 M2.5 以上、近 24 小时，时间已转为本地时区。
    震级配色：<b style="color:#b8901a">M4</b> / <b style="color:#e07a1f">M5</b> /
    <b style="color:#e23c3c">M6+</b>。经纬度 N/S 为北 / 南纬，E/W 为东 / 西经。
  </p>
</div>

<script src="/ui.js?v=20261108b"></script>
<script>
"use strict";
MR.mountTop("地震");
var $ = MR.$, esc = MR.esc;

var ALL = [], MIN = 0, SCOPE = "cn";

function csvLine(s) {
  var out = [], cur = "", q = false, i, c;
  for (i = 0; i < s.length; i++) {
    c = s.charAt(i);
    if (q) {
      if (c === '"') {
        if (s.charAt(i + 1) === '"') { cur += '"'; i++; }
        else q = false;
      } else cur += c;
    } else if (c === '"') {
      q = true;
    } else if (c === ",") {
      out.push(cur); cur = "";
    } else cur += c;
  }
  out.push(cur);
  return out;
}

function pad2(n) { return n < 10 ? "0" + n : "" + n; }
function magCls(m) {
  if (m >= 6) return "m6";
  if (m >= 5) return "m5";
  if (m >= 4) return "m4";
  return "m0";
}

/* 上游给的是带符号十进制：北纬 / 东经为正，南纬 / 西经为负。
   转成 34.23°N, 88.14°E，一眼能看出在哪个半球。 */
function hemi(v, pos, neg) {
  var n = Number(v);
  if (isNaN(n)) return "—";
  return Math.abs(n).toFixed(2) + "°" + (n < 0 ? neg : pos);
}
function coord(lat, lon) {
  if (String(lat) === "" || String(lon) === "") return "";
  return "经纬度：" + hemi(lat, "N", "S") + ", " + hemi(lon, "E", "W");
}

function render() {
  var items = ALL.filter(function (x) { return x.mag >= MIN; });
  if (!items.length) {
    $("list").innerHTML = '<div class="empty muted small">' +
      (ALL.length ? "没有达到该震级的地震"
                  : (SCOPE === "global" ? "暂无全球数据，稍后自动刷新"
                     : SCOPE === "usgs" ? "暂无 USGS 数据，稍后自动刷新"
                                        : "暂无国内数据，稍后自动刷新")) + "</div>";
    return;
  }
  $("list").innerHTML = items.map(function (x) {
    var meta = "深度：" + (x.depth || "—") + " km";
    var co = coord(x.lat, x.lon);
    if (co) meta += " · " + co;
    return '<div class="frow">' +
      '<div class="fh"><span class="fmag ' + magCls(x.mag) + '">' +
      (x.mag ? x.mag.toFixed(1) : "—") + "</span>" +
      '<span class="sp"></span><span>时间：' + esc(x.time || "—") + "</span></div>" +
      '<div class="fitem"><div class="fb">' + esc(x.place || "位置未知") + "</div></div>" +
      '<div class="ff"><span class="muted small">' + esc(meta) + "</span></div></div>";
  }).join("");
}

function load(force) {
  var b = $("btnRefresh");
  b.disabled = true;
  var q = [];
  if (SCOPE === "global") q.push("a=global");
  else if (SCOPE === "usgs") q.push("a=usgs");
  if (force) q.push("force=1");
  return MR.api("/api/quake" + (q.length ? "?" + q.join("&") : "")).then(function (d) {
    if (!d.ok) {
      $("updAt").textContent = d.msg || "准备中…";
      setTimeout(function () { load(true); }, 4000);
      return;
    }
    ALL = (d.rows || []).map(function (line) {
      var f = csvLine(line);
      // key, leve, addtime, weizhi, shendu, weidu, jingdu
      return {
        key: f[0], mag: Number(f[1]) || 0, time: f[2] || "",
        place: f[3] || "", depth: f[4] || "", lat: f[5] || "", lon: f[6] || ""
      };
    }).sort(function (a, b) { return a.time < b.time ? 1 : -1; });

    var m4 = 0, mx = 0;
    ALL.forEach(function (x) {
      if (x.mag >= 4) m4++;
      if (x.mag > mx) mx = x.mag;
    });
    $("cAll").textContent = ALL.length + " 次";
    $("c4").textContent = m4 + " 次";
    $("cMax").textContent = mx ? "M" + mx.toFixed(1) : "—";
    var tag = SCOPE === "global" ? "全球" : SCOPE === "usgs" ? "USGS" : "国内";
    $("updAt").textContent = ALL.length
      ? tag + " · 最近 " + (ALL[0].time || "").replace(/^\d{4}-/, "")
      : tag + " · 无数据";
    render();
  }).catch(function () {
    $("updAt").textContent = "读取失败";
    $("list").innerHTML = '<div class="empty muted small">接口无响应，点刷新重试</div>';
  }).then(function () { b.disabled = false; });
}

$("scopeChips").addEventListener("click", function (e) {
  var t = e.target;
  if (t.tagName !== "BUTTON") return;
  var s = t.getAttribute("data-s");
  if (!s || s === SCOPE) return;
  SCOPE = s;
  [].forEach.call(this.querySelectorAll("button"), function (b) { b.className = ""; });
  t.className = "on";
  $("updAt").textContent = "加载中…";
  load(false);
});

$("magChips").addEventListener("click", function (e) {
  var t = e.target;
  if (t.tagName !== "BUTTON") return;
  MIN = Number(t.getAttribute("data-m")) || 0;
  [].forEach.call(this.querySelectorAll("button"), function (b) { b.className = ""; });
  t.className = "on";
  render();
});

$("btnRefresh").addEventListener("click", function () {
  $("updAt").textContent = "刷新中…";
  load(true);
});

load(false);
setInterval(function () { load(true); }, 10800000);   // 3 小时自动刷
</script>
</body>
</html>
