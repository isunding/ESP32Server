<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>IPTV 电视直播 · ESP32 终端服务器</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="/theme.css?v=20261107d">
<style>
  /* 左右布局：桌面并排，窄屏堆叠 */
  .iptv{display:grid;gap:14px;align-items:start}
  @media (min-width:760px){
    .iptv{grid-template-columns:minmax(0,1.15fr) minmax(0,1fr)}
  }

  /* 左：播放器 */
  .player{
    background:#000;border:1px solid var(--line);border-radius:var(--radius);
    overflow:hidden;position:relative;aspect-ratio:16/9;
  }
  @media (min-width:760px){
    .player{position:sticky;top:122px}
  }
  .player video{width:100%;height:100%;display:block;background:#000}
  .player .ph-cover{
    position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    pointer-events:none;
  }
  /* 未播放空态：纯图标，无文字 */
  .player .ph-cover .pl-ico{
    width:64px;height:64px;border-radius:50%;border:2px solid rgba(255,255,255,.18);
    display:flex;align-items:center;justify-content:center;color:rgba(255,255,255,.28);
  }
  .player .ph-cover .pl-ico svg{width:30px;height:30px;fill:currentColor}
  .pmeta{display:flex;align-items:center;gap:10px;margin:10px 2px 2px}
  .pmeta .ptitle{font-size:14px;font-weight:600;flex:1;min-width:0;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .pmeta .pstat{font-size:11px;color:var(--fg2);flex:0 0 auto}
  .pctl{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0 0}
  .pctl .btn{flex:1 1 auto;min-width:0}
  .perr{display:none;font-size:11.5px;color:var(--err);line-height:1.6;margin-top:8px}
  .perr.show{display:block}

  /* 右：播放列表 */
  .plist{
    background:var(--bg2);border:1px solid var(--line);border-radius:var(--radius);
    display:flex;flex-direction:column;max-height:calc(100vh - 130px);
  }
  @media (min-width:760px){
    .plist{position:sticky;top:122px;max-height:calc(100vh - 138px)}
  }
  .plist .phead{
    padding:12px 14px;border-bottom:1px solid var(--line);flex:0 0 auto;
  }
  .plist .phead .prow{display:flex;align-items:center;gap:8px}
  .plist .phead b{font-size:13px;font-weight:600}
  .plist .phead .cnt{font-size:11px;color:var(--fg2);margin-left:auto;flex:0 0 auto}
  .plist .phead .search{
    background:var(--bg3);border:1px solid var(--line);border-radius:8px;
    color:var(--fg);padding:6px 10px;font:inherit;font-size:12px;width:100%;margin-top:9px;
  }
  .plist .phead .search:focus{outline:none;border-color:var(--acc)}
  .scroll{overflow-y:auto;flex:1 1 auto;padding:6px}
  .scroll::-webkit-scrollbar{width:8px}
  .scroll::-webkit-scrollbar-thumb{background:var(--line);border-radius:4px}

  /* 频道条目 */
  .ch{display:flex;align-items:center;gap:9px;padding:9px 10px;border-radius:10px;
    cursor:pointer;border:1px solid transparent}
  .ch:hover{background:var(--bg3)}
  .ch.on{background:var(--bg3);border-color:var(--acc)}
  .ch .name{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
    font-size:13px}
  .ch .caret{color:var(--fg2);font-size:10px;flex:0 0 auto;transition:transform .15s;
    padding:2px}
  .ch.on .caret{transform:rotate(90deg)}
  /* 可回看标识：频道级别的能力标记，与"可用/失效"的源状态区分开 */
  .ch .tag.cu{color:var(--acc);border:1px solid currentColor;border-radius:999px;
    padding:0 5px;line-height:14px;font-size:10px;flex:0 0 auto}
  .cblk{border-radius:10px}
  .addr{background:var(--bg3);border-radius:10px;padding:2px 12px;margin:0 6px 6px}
  .arow{display:flex;align-items:center;gap:9px;padding:8px 0;border-top:1px solid var(--line)}
  .arow:first-child{border-top:none}
  .arow .k{font-size:10.5px;color:var(--fg2);flex:0 0 80px;line-height:1.4}
  .arow code{flex:1;min-width:0;font-size:11px;word-break:break-all;line-height:1.5;
    font-family:ui-monospace,Menlo,Consolas,monospace;color:var(--fg);user-select:all}
  .arow .btn{padding:3px 9px;font-size:11px;flex:0 0 auto}

  /* 节目单：展开频道后显示，可切昨天 / 今天，已播节目点一下回看 */
  .epgbox{margin:0 6px 6px}
  .epg{background:var(--bg3);border-radius:10px;overflow:hidden}
  .epgnote{font-size:11.5px;color:var(--fg2);padding:9px 12px;line-height:1.6}
  .epg .tabs{display:flex;gap:6px;padding:8px 10px 0}
  .epg .tab{font:inherit;font-size:11px;line-height:18px;padding:0 10px;border-radius:999px;
    border:1px solid var(--line);background:transparent;color:var(--fg2);cursor:pointer}
  .epg .tab.on{background:var(--acc);border-color:var(--acc);color:#fff}
  .epg .rows{max-height:216px;overflow-y:auto;padding:6px 0 4px}
  .epg .rows::-webkit-scrollbar{width:6px}
  .epg .rows::-webkit-scrollbar-thumb{background:var(--line);border-radius:3px}
  .epg .row{display:flex;align-items:baseline;gap:8px;padding:5px 10px;font-size:12px}
  .epg .row .tm{flex:0 0 72px;color:var(--fg2);font-size:11px;
    font-variant-numeric:tabular-nums}
  .epg .row .ti{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .epg .row .rb{flex:0 0 auto;font-size:10px;line-height:16px;color:var(--fg2);
    border:1px solid var(--line);border-radius:999px;padding:0 6px}
  .epg .row.no{opacity:.5}
  .epg .row.can{cursor:pointer}
  .epg .row.can:hover{background:var(--bg2)}
  .epg .row.now{background:var(--bg2)}
  .epg .row.now .ti{color:var(--acc);font-weight:600}
  .epg .row.now .rb{color:var(--acc);border-color:var(--acc)}
  /* 分组：默认折叠，一次只展开一组 */
  .grp{margin-bottom:8px}
  .ghd{display:flex;align-items:center;gap:8px;padding:10px 11px;cursor:pointer;
    background:var(--bg3);border:1px solid var(--line);border-radius:10px}
  .ghd:hover{border-color:var(--acc)}
  .ghd .gname{flex:1;min-width:0;font-size:13px;font-weight:600;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .ghd .gcnt{font-size:11px;color:var(--fg2);flex:0 0 auto;
    font-variant-numeric:tabular-nums}
  .ghd .gcaret{color:var(--fg2);font-size:12px;line-height:1;flex:0 0 auto;
    transition:transform .15s}
  .grp.open .ghd{border-color:var(--acc)}
  .grp.open .gcaret{transform:rotate(90deg)}
  .gbody{padding:4px 0 0}

  /* 底部工具条 */
  .acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
  .acts .btn{flex:1 1 auto}
</style>
</head>
<body>

<div id="topbar"></div>

<div class="wrap" style="max-width:1120px">
  <div class="iptv">

    <!-- 左：播放器 -->
    <div>
      <div class="player" id="player">
        <video id="video" playsinline controls></video>
        <div class="ph-cover" id="pcover">
          <div class="pl-ico">
            <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
          </div>
        </div>
      </div>
      <div class="pmeta">
        <span class="ptitle" id="ptitle">未在播放</span>
        <span class="pstat" id="pstat"></span>
      </div>
      <div class="pctl">
        <button class="btn" id="prev">◀ 上一台</button>
        <button class="btn" id="next">下一台 ▶</button>
        <button class="btn" id="toLive" style="display:none">回到直播</button>
        <button class="btn" id="stop">■ 停止</button>
      </div>
      <div class="perr" id="perr"></div>
    </div>

    <!-- 右：播放列表 -->
    <div class="plist">
      <div class="phead">
        <div class="prow">
          <b>播放列表</b>
          <span class="cnt" id="cnt"></span>
        </div>
        <input id="search" class="search" placeholder="搜索频道 / 分组">
      </div>
      <div class="scroll" id="list"><span class="muted small">加载中…</span></div>
    </div>

  </div>

  <div class="card" style="margin-top:14px">
    <div class="acts">
      <button class="btn" id="cpAll">复制当前列表（M3U）</button>
      <button class="btn" id="cpGrp">只复制可用频道</button>
    </div>
    <p class="small muted" style="margin:10px 0 0;line-height:1.7">
      点频道直接播放，点 <b>▸</b> 展开节目单与地址；已播节目点一下即从该档开头回看。
      直播走 rtp2httpd <code>:5140</code>，回看经 <code>/http/</code> 反代，两者都已放行跨域；
      断流封 IP 5 秒，重连 429 属正常。
    </p>
  </div>
</div>

<script src="/ui.js?v=20261107d"></script>
<script>
MR.mountTop("IPTV 电视直播");

var state = {
  channels: [], filter: "", open: "", openGrp: "",
  router: { host: "10.0.0.1", r2h_port: 5140, udpxy_port: 12123 },
  playing: null, idx: -1, byKey: {}, mode: "live",
  /* 节目单缓存：按 tvg-id 存一份，5 分钟内不重复取；epgDay 记住每台选的日期 */
  epg: {}, epgBusy: {}, epgBad: {}, epgDay: {}
};

MR.healthTick().then(function (h) {
  if (h && h.router) state.router = h.router;
  render();
}).catch(function () { render(); });

function urls(ip, port) {
  var r = state.router;
  return {
    r2h: "http://" + r.host + ":" + (r.r2h_port || 5140) + "/rtp/" + ip + ":" + port,
    udp: "http://" + r.host + ":" + (r.udpxy_port || 12123) + "/rtp/" + ip + ":" + port,
    mcast: "rtp://" + ip + ":" + port
  };
}

/* ---------------- 时间换算 ----------------
   节目单里的时间一律是北京时间的 14 位数字。全部按「拿 epoch 加 8 小时再读 UTC」
   换算，浏览器在哪个时区都不影响比较与回看时间戳。 */
function pad2(n) { return n < 10 ? "0" + n : "" + n; }

function bjStamp(ms) {
  var d = new Date((ms === undefined ? Date.now() : ms) + 28800000);
  return d.getUTCFullYear() + pad2(d.getUTCMonth() + 1) + pad2(d.getUTCDate()) +
    pad2(d.getUTCHours()) + pad2(d.getUTCMinutes()) + pad2(d.getUTCSeconds());
}

function epochFromBj(s) {
  return Math.floor(Date.UTC(+s.substr(0, 4), +s.substr(4, 2) - 1, +s.substr(6, 2),
    +s.substr(8, 2), +s.substr(10, 2), +s.substr(12, 2)) / 1000) - 28800;
}

function hhmm14(s) { return s.substr(8, 2) + ":" + s.substr(10, 2); }

function dayNum(day) {
  return Date.UTC(+day.substr(0, 4), +day.substr(4, 2) - 1, +day.substr(6, 2)) / 86400000;
}

function dayLabel(day, today) {
  var diff = dayNum(day) - dayNum(today);
  if (diff === 0) return "今天";
  if (diff === -1) return "昨天";
  if (diff === 1) return "明天";
  return day.substr(4, 2) + "/" + day.substr(6, 2);
}

function copyText(text, okMsg) {
  function ok(flag) {
    MR.toast(flag ? (okMsg || "已复制") : "复制失败，请长按地址手动选择");
  }
  function fallback() {
    var ta = document.createElement("textarea");
    ta.value = text;
    ta.setAttribute("readonly", "");
    ta.style.cssText = "position:fixed;top:0;left:0;opacity:0;width:1px;height:1px";
    document.body.appendChild(ta);
    ta.select();
    ta.setSelectionRange(0, text.length);
    var done = false;
    try { done = document.execCommand("copy"); } catch (e) { }
    document.body.removeChild(ta);
    ok(done);
  }
  if (navigator.clipboard && window.isSecureContext) {
    navigator.clipboard.writeText(text).then(function () { ok(true); }, fallback);
  } else {
    fallback();
  }
}

function addrBlock(c) {
  var u = urls(c.ip, c.port);
  var rows = [
    ["VLC / 手机", u.r2h],
    ["TVBox / DIYP", u.udp],
    ["原始组播", u.mcast]
  ];
  return '<div class="addr">' + rows.map(function (it) {
    return '<div class="arow"><span class="k">' + it[0] + "</span>" +
      "<code>" + MR.esc(it[1]) + "</code>" +
      '<button class="btn" data-cp="' + MR.esc(it[1]) + '">复制</button></div>';
  }).join("") + "</div>";
}

/* 展开频道后先给节目单，再给地址。没有 tvg-id 的频道不出节目单，也就没有回看入口 */
function chanExtra(c) {
  var epg = c.tvg ? '<div class="epgbox" data-tvg="' + MR.esc(c.tvg) +
    '" data-key="' + MR.esc(c.key) + '"></div>' : "";
  return epg + addrBlock(c);
}

/* ---------------- 节目单 ----------------
   切片由路由器 nginx 静态提供（/iptv/epg/<tvg-id>.json，已放行跨域），
   浏览器直连，板子只发页面不参与。 */
function epgFetch(tvg) {
  if (state.epgBusy[tvg]) return;
  var hit = state.epg[tvg];
  if (hit && Date.now() - hit.ts < 300000) return;   // 内存里 5 分钟内不重复取
  if (!hit && state.epgBad[tvg] && Date.now() - state.epgBad[tvg] < 60000) return;
  state.epgBusy[tvg] = 1;
  var u = "http://" + state.router.host + "/iptv/epg/" + encodeURIComponent(tvg) + ".json";
  fetch(u, { cache: "force-cache" }).then(function (r) {
    if (!r.ok) throw new Error("HTTP " + r.status);
    return r.json();
  }).then(function (d) {
    state.epgBusy[tvg] = 0;
    state.epg[tvg] = { ts: Date.now(), p: (d && d.p) || [] };
    epgPaint(tvg);
  }).catch(function () {
    state.epgBusy[tvg] = 0;
    state.epgBad[tvg] = Date.now();
    epgPaint(tvg);
  });
}

function epgPaint(tvg) {
  var boxes = MR.$("list").querySelectorAll('.epgbox[data-tvg="' + tvg + '"]');
  for (var i = 0; i < boxes.length; i++) epgPaint1(boxes[i]);
}

function epgPaint1(box) {
  var tvg = box.dataset.tvg;
  box.innerHTML = epgHtml(tvg, box.dataset.key);
  epgFetch(tvg);
  var rows = box.querySelector(".rows"), cur = box.querySelector(".row.now");
  if (rows && cur && cur.offsetTop >= rows.firstChild.offsetTop) {
    var off = cur.offsetTop - rows.firstChild.offsetTop;
    rows.scrollTop = Math.max(0, off - rows.clientHeight / 2 + cur.offsetHeight / 2);
  }
}

function epgHtml(tvg, key) {
  var e = state.epg[tvg];
  if (!e) {
    return '<div class="epg"><div class="epgnote">' +
      (state.epgBad[tvg] ? "节目单暂时取不到" : "节目单加载中…") + "</div></div>";
  }
  if (!e.p.length) return '<div class="epg"><div class="epgnote">这两天没有节目单</div></div>';

  var now = bjStamp(), today = now.substr(0, 8);
  var days = {}, order = [];
  e.p.forEach(function (r) {
    var d = r[0].substr(0, 8);
    if (!days[d]) { days[d] = []; order.push(d); }
    days[d].push(r);
  });
  order.sort();
  var sel = state.epgDay[tvg];
  if (!days[sel]) sel = days[today] ? today : order[order.length - 1];

  var tabs = "";
  if (order.length > 1) {
    tabs = '<div class="tabs">' + order.map(function (d) {
      return '<button class="tab' + (d === sel ? " on" : "") + '" data-tvg="' +
        MR.esc(tvg) + '" data-day="' + d + '">' + dayLabel(d, today) + "</button>";
    }).join("") + "</div>";
  }

  var c = state.byKey[key] || {};
  var rows = days[sel].map(function (r) {
    var s = r[0], en = r[1], isNow = (s <= now && now < en), past = en <= now;
    var cls = "row", badge = "", live = "";
    if (isNow) {
      cls += " now can"; badge = '<span class="rb">直播中</span>'; live = "1";
    } else if (past) {
      if (c.cu && c.chid) { cls += " can"; badge = '<span class="rb">回看</span>'; }
      else cls += " no";
    }
    return '<div class="' + cls + '" data-key="' + MR.esc(key) + '" data-s="' + s +
      '" data-e="' + en + '" data-live="' + live + '">' +
      '<span class="tm">' + hhmm14(s) + "</span>" +
      '<span class="ti">' + MR.esc(r[2] || "") + "</span>" + badge + "</div>";
  }).join("");

  return '<div class="epg">' + tabs + '<div class="rows">' + rows + "</div></div>";
}

function render() {
  var q = state.filter.toLowerCase();
  var groups = {}, order = [];
  state.byKey = {};

  state.channels.forEach(function (it) {
    var c = {
      name: it[0] || "", grp: it[1] || "未分组", ip: it[2], port: it[3], live: it[4],
      /* [9] tvg-id 用来对节目单，[10] 可回看，[11] 回看 chid；旧缓存可能没有后两项 */
      tvg: it[9] || "", cu: it[10] === "1", chid: it[11] || ""
    };
    if (!c.ip || !c.port) return;
    c.key = c.ip + ":" + c.port;
    if (q && (c.name + " " + c.grp + " " + c.ip).toLowerCase().indexOf(q) < 0) return;
    if (!groups[c.grp]) { groups[c.grp] = []; order.push(c.grp); }
    groups[c.grp].push(c);
    state.byKey[c.key] = c;
  });

  var searching = q.length > 0;
  var total = 0;

  var html = order.map(function (g) {
    var arr = groups[g];
    total += arr.length;

    /* 搜索时全部展开，平时只展开 state.openGrp 那一组 */
    var isOpen = searching || (g === state.openGrp);
    var playingIn = false;

    var list = "";
    if (isOpen) {
      list = arr.map(function (c) {
        var key = c.ip + ":" + c.port;
        var playing = (state.playing && state.playing.key === key);
        if (playing) playingIn = true;
        var on = (key === state.open);
        var tag = c.live === "1" ? '<span class="tag live">可用</span>'
          : c.live === "0" ? '<span class="tag dead">失效</span>'
            : '<span class="tag">未检测</span>';
        /* 回看入口只有节目单一条路径：没有 tvg-id 就没有节目单，标了也点不到，
           所以三项齐全（模板 / chid / tvg-id）才显示 */
        var cutag = (c.cu && c.chid && c.tvg) ? '<span class="tag cu">可回看</span>' : "";
        var pdot = playing ? '<span class="tag live">' +
          (state.playing.vod ? "回看中" : "播放中") + "</span>" : "";
        return '<div class="cblk" data-key="' + MR.esc(key) + '">' +
          '<div class="ch' + (on || playing ? " on" : "") + '">' +
          '<span class="name">' + MR.esc(c.name) + "</span>" + pdot + cutag + tag +
          '<span class="caret">▸</span></div>' +
          (on ? chanExtra(c) : "") + "</div>";
      }).join("");
    } else if (state.playing && arr.some(function (c) {
      return (c.ip + ":" + c.port) === state.playing.key;
    })) {
      playingIn = true;
    }

    return '<div class="grp' + (isOpen ? " open" : "") + '">' +
      '<div class="ghd" data-grp="' + MR.esc(g) + '">' +
      '<span class="gname">' + MR.esc(g) + "</span>" +
      (playingIn ? '<span class="tag live">播放中</span>' : "") +
      '<span class="gcnt">' + arr.length + "</span>" +
      '<span class="gcaret">▸</span></div>' +
      (isOpen ? '<div class="gbody">' + list + "</div>" : "") +
      "</div>";
  }).join("");

  MR.$("list").innerHTML = html || MR.empty("没有匹配的频道");
  MR.$("cnt").textContent = total + " 个";
  var boxes = MR.$("list").querySelectorAll(".epgbox");
  for (var i = 0; i < boxes.length; i++) epgPaint1(boxes[i]);
  state.visible = [];
  order.forEach(function (g) { groups[g].forEach(function (c) { state.visible.push(c); }); });
}

function buildM3U(onlyLive) {
  var r = state.router;
  var lines = ["#EXTM3U"];
  (state.visible || []).forEach(function (c) {
    if (onlyLive && c.live === "0") return;
    lines.push('#EXTINF:-1 group-title="' + c.grp + '",' + c.name);
    lines.push("http://" + r.host + ":" + (r.r2h_port || 5140) + "/rtp/" + c.ip + ":" + c.port);
  });
  return lines.join("\n");
}

/* ---------------- 播放器 ---------------- */
var player = null;      // mpegts.js 实例（直播）
var hls = null;         // hls.js 实例（回看）
var video = MR.$("video");

function showErr(msg) {
  var e = MR.$("perr");
  e.textContent = msg;
  e.classList.add("show");
  MR.$("pstat").textContent = "播放失败";
}

function clearErr() { MR.$("perr").classList.remove("show"); }
function setStatus(t) { MR.$("pstat").textContent = t; }

/* 拆播放内核但不重绘：由调用方决定接下来是走直播还是回看，避免连着重绘两次 */
function teardown() {
  if (hls) { try { hls.destroy(); } catch (e) { } hls = null; }
  if (player) {
    try { player.destroy(); } catch (e) { }
    player = null;
  }
  try { video.pause(); } catch (e) { }
  try { video.removeAttribute("src"); video.load(); } catch (e) { }
  state.playing = null; state.idx = -1; state.mode = "live";
  MR.$("ptitle").textContent = "未在播放";
  MR.$("pcover").style.display = "flex";
  MR.$("toLive").style.display = "none";
  setStatus("");
  clearErr();
}

function stop() { teardown(); render(); }

/* 播放内核按需加载：首屏不下载 218KB 的 mpegts.min.js，只有真的点播放才去取。
   实测 jsdelivr 走公网要 2.1 秒，比板子本地 0.67 秒还慢，所以只用本地；
   取到后浏览器按 max-age 缓存，后续打开直接复用。 */
var _kernelP = null;
function loadKernel() {
  if (window.mpegts) return Promise.resolve();
  if (_kernelP) return _kernelP;
  _kernelP = new Promise(function (resolve, reject) {
    var s = document.createElement("script");
    var done = false;
    var timer = setTimeout(function () {
      if (done) return;
      done = true;
      if (s.parentNode) s.parentNode.removeChild(s);
      reject(new Error("timeout"));
    }, 15000);
    s.src = "/mpegts.min.js?v=20261107d.7.3";
    s.onload = function () {
      if (done) return;
      done = true; clearTimeout(timer);
      if (window.mpegts) resolve(); else reject(new Error("empty"));
    };
    s.onerror = function () {
      if (done) return;
      done = true; clearTimeout(timer);
      reject(new Error("load error"));
    };
    document.head.appendChild(s);
  });
  return _kernelP;
}

function playChannel(c, idx) {
  if (!c || !c.ip || !c.port) return;
  if (typeof mpegts === "undefined") {
    setStatus("加载播放内核…");
    loadKernel().then(function () { playChannel(c, idx); })
      .catch(function () {
        showErr("播放内核加载失败：板子本地取不到 mpegts.min.js");
        setStatus("");
      });
    return;
  }
  teardown();
  state.playing = { name: c.name, grp: c.grp, key: c.key };
  state.idx = idx;
  state.open = state.playing.key;
  state.openGrp = c.grp;   // 展开所属分组，保证能看到正在播的那一项

  var url = urls(c.ip, c.port).r2h;  // 仅 :5140 有 CORS
  MR.$("ptitle").textContent = c.name;
  MR.$("pcover").style.display = "none";
  setStatus("连接中…");
  clearErr();

  try {
    player = mpegts.createPlayer({
      type: "mpegts",
      isLive: true,
      url: url,
      enableWorker: false
    });
    player.attachMediaElement(video);
    player.load();
    player.play().catch(function () { /* 自动播放被拦，等用户点击 */ });
    player.on(mpegts.Events.ERROR, function (e, info) {
      if (info && info.details === "xhrSetupError") {
        showErr("拉流被拒（跨域/连接失败）：" + url);
      } else {
        showErr("播放出错：" + (info ? (info.type || info.details || "") : ""));
      }
      setStatus("播放失败");
    });
  } catch (e) {
    showErr("创建播放器失败：" + (e && e.message ? e.message : e));
  }
  render();
}

/* ---------------- 回看 ----------------
   上游回看 CDN 不回跨域头，网页不能直接取 m3u8 与分片，必须走路由器的
   /http/ 反代（rtp2httpd 转发、nginx 补 CORS）。地址的换算（epoch → 北京
   时间）仍在 CGI 里做，这里只负责把域名换成反代前缀。 */
var _hlsP = null;
function proxyUrl(u) {
  return String(u).replace(/^https?:\/\//i, "http://" + state.router.host + "/http/");
}

function loadHls() {
  if (window.Hls) return Promise.resolve();
  if (_hlsP) return _hlsP;
  _hlsP = new Promise(function (resolve, reject) {
    var s = document.createElement("script");
    var done = false;
    var timer = setTimeout(function () {
      if (done) return;
      done = true;
      if (s.parentNode) s.parentNode.removeChild(s);
      reject(new Error("timeout"));
    }, 15000);
    s.src = "/hls.js";
    s.onload = function () {
      if (done) return;
      done = true; clearTimeout(timer);
      if (window.Hls) resolve(); else reject(new Error("empty"));
    };
    s.onerror = function () {
      if (done) return;
      done = true; clearTimeout(timer);
      reject(new Error("load error"));
    };
    document.head.appendChild(s);
  });
  return _hlsP;
}

function playCatchup(key, s, e) {
  var c = state.byKey[key];
  if (!c) return;
  if (!c.chid) { MR.toast("该频道不支持回看"); return; }
  var sn = epochFromBj(s), en = epochFromBj(e);
  var now = Math.floor(Date.now() / 1000);
  if (en > now) en = now;                 // 正在播出的节目截到当前时刻
  if (en - sn < 30) { MR.toast("这档节目还没播完，先看直播"); return; }

  setStatus("获取回看地址…");
  clearErr();
  var q = "http://" + state.router.host + "/cgi-bin/iptv?a=tvr&u=1&c=" +
    encodeURIComponent(c.chid) + "&s=" + sn + "&e=" + en;
  fetch(q, { cache: "no-store" }).then(function (r) {
    return r.json();
  }).then(function (d) {
    if (!d || !d.ok || !d.url) throw new Error((d && d.msg) || "回看地址不可用");
    playHls(proxyUrl(d.url), c, s, e);
  }).catch(function (err) {
    showErr("回看取址失败：" + (err && err.message ? err.message : err));
    setStatus("");
  });
}

function playHls(url, c, s, e) {
  if (!window.Hls) {
    setStatus("加载回看内核…");
    loadHls().then(function () { playHls(url, c, s, e); })
      .catch(function () {
        showErr("回看内核加载失败：板子本地取不到 hls.js");
        setStatus("");
      });
    return;
  }
  teardown();
  state.mode = "vod";
  state.playing = { name: c.name, grp: c.grp, key: c.key, vod: 1 };
  state.open = c.key;
  state.openGrp = c.grp;
  MR.$("ptitle").textContent = c.name;
  MR.$("pcover").style.display = "none";
  MR.$("toLive").style.display = "";
  setStatus("回看 " + hhmm14(s) + "–" + hhmm14(e));
  clearErr();
  try {
    hls = new Hls({ enableWorker: false, lowLatencyMode: false });
    hls.on(Hls.Events.MANIFEST_PARSED, function () {
      video.play().catch(function () { /* 被拦则等用户点播放 */ });
    });
    hls.on(Hls.Events.ERROR, function (evt, data) {
      if (!data || !data.fatal) return;
      showErr("回看播放出错：" + (data.details || data.type || ""));
      setStatus("播放失败");
    });
    hls.loadSource(url);
    hls.attachMedia(video);
  } catch (err) {
    showErr("创建回看播放器失败：" + (err && err.message ? err.message : err));
  }
  render();
}

function step(dir) {
  var arr = state.visible || [];
  if (!arr.length) return;
  var i = state.idx;
  i = (i < 0) ? 0 : (i + dir + arr.length) % arr.length;
  playChannel(arr[i], i);
}

MR.$("prev").addEventListener("click", function () { step(-1); });
MR.$("next").addEventListener("click", function () { step(1); });
MR.$("stop").addEventListener("click", stop);
MR.$("toLive").addEventListener("click", function () {
  var c = state.playing && state.byKey[state.playing.key];
  if (!c) { stop(); return; }
  playChannel(c, (state.visible || []).indexOf(c));
});

/* ---------------- 频道加载 ---------------- */
MR.api("/api/channels").then(function (r) {
  if (!r || !r.ok) {
    MR.$("list").innerHTML = MR.empty((r && r.msg) || "频道库不可用，检查路由器 /cgi-bin/iptv");
    return;
  }
  state.channels = r.items || [];
  render();
}).catch(function () {
  MR.$("list").innerHTML = MR.empty("取数失败");
});

MR.$("list").addEventListener("click", function (e) {
  var cp = e.target.closest("[data-cp]");
  if (cp) { copyText(cp.dataset.cp, "地址已复制"); return; }

  /* 分组标题：一次只展开一组 */
  var ghd = e.target.closest(".ghd");
  if (ghd) {
    var g = ghd.dataset.grp;
    state.openGrp = (state.openGrp === g) ? "" : g;
    state.open = "";
    render();
    return;
  }

  /* 节目单：切日期、点节目回看。这两类点击要先于「点频道」拦下 */
  var tab = e.target.closest(".epg .tab");
  if (tab) {
    state.epgDay[tab.dataset.tvg] = tab.dataset.day;
    epgPaint(tab.dataset.tvg);
    return;
  }
  var row = e.target.closest(".epg .row");
  if (row) {
    if (row.dataset.live === "1") {
      var cc = state.byKey[row.dataset.key];
      var ci = (state.visible || []).indexOf(cc);
      if (cc && ci >= 0) playChannel(cc, ci);
    } else if (row.dataset.s) {
      playCatchup(row.dataset.key, row.dataset.s, row.dataset.e);
    }
    return;
  }

  if (e.target.closest(".epg")) return;

  var blk = e.target.closest(".cblk");
  if (!blk) return;
  var key = blk.dataset.key;

  var caret = e.target.closest(".caret");
  if (!caret) {
    var idx = -1;
    (state.visible || []).forEach(function (c, i) {
      if ((c.ip + ":" + c.port) === key) idx = i;
    });
    if (idx >= 0) {
      if (state.playing && state.playing.key === key) {
        state.open = (state.open === key) ? "" : key;
        render();
      } else {
        playChannel(state.visible[idx], idx);
      }
      return;
    }
  }

  state.open = (state.open === key) ? "" : key;
  render();
});

MR.$("cpAll").addEventListener("click", function () {
  if (!state.visible || !state.visible.length) { MR.toast("列表为空"); return; }
  copyText(buildM3U(false), "已复制 " + state.visible.length + " 个频道（M3U）");
});
MR.$("cpGrp").addEventListener("click", function () {
  var n = (state.visible || []).filter(function (c) { return c.live !== "0"; }).length;
  if (!n) { MR.toast("没有可用频道"); return; }
  copyText(buildM3U(true), "已复制 " + n + " 个可用频道（M3U）");
});
MR.$("search").addEventListener("input", function (e) {
  state.filter = e.target.value;
  render();
});
</script>
