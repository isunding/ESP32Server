<!doctype html>
<html lang="zh-CN">
<head>
<script>try{var t=localStorage.getItem("mr.theme");if(t)document.documentElement.setAttribute("data-theme",t);var k=localStorage.getItem("mr.skin");if(k)document.documentElement.setAttribute("data-skin",k)}catch(e){}</script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>IPTV 电视直播 · ESP32 终端服务器</title>
<link rel="icon" href="data:,">
<style>
/* ESP32 终端服务器 · 设计系统
 * 视觉语言照搬原路由器页面：深色底 + 分层卡片 + 细描边 + 等宽数字
 *
 * 默认强调色保持原来的橙（#ff6a00 / #3b82f6），不做改动。
 * 皮肤是在它之上的附加选项：--sk/--sk2 是浅色底用的，--skL/--sk2L 是深色底用的，
 * --acc/--acc2 按当前明暗自动取档；未设置 data-skin 时两档都是原来的橙色。
 */
:root{
  color-scheme:dark;
  --bg:#0f1216; --bg2:#161b22; --bg3:#1c232c; --line:#283141;
  --fg:#e6edf3; --fg2:#8b98a9;
  --sk:#ff6a00; --sk2:#3b82f6;
  --skL:#ff6a00; --sk2L:#3b82f6;
  --acc:var(--skL); --acc2:var(--sk2L);
  --ok:#3fb950; --err:#f85149; --warm:#ffb454; --cold:#58a6ff;
  --radius:16px;
}
/* 亮色有两处来源：跟随系统（media），或被顶栏按钮手动锁定为 light。
   两处配色相同，改配色时一起改。手动锁定 dark 时 media 段被 :not 排除，
   回落到上面的 :root 深色值。 */
@media (prefers-color-scheme:light){
  :root:not([data-theme="dark"]){
    color-scheme:light;
    --bg:#f2f5f9; --bg2:#ffffff; --bg3:#e9eef4; --line:#d8dee4;
    --fg:#1f2328; --fg2:#59636e;
    --acc:var(--sk); --acc2:var(--sk2);
  }
}
:root[data-theme="light"]{
  color-scheme:light;
  --bg:#f2f5f9; --bg2:#ffffff; --bg3:#e9eef4; --line:#d8dee4;
  --fg:#1f2328; --fg2:#59636e;
  --acc:var(--sk); --acc2:var(--sk2);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;min-height:100%}
body{
  background:radial-gradient(1200px 600px at 50% -10%, #1b2430 0%, var(--bg) 60%);
  background-attachment:fixed;
  color:var(--fg);
  font:15px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
}
@media (prefers-color-scheme:light){
  :root:not([data-theme="dark"]) body{
    background:radial-gradient(1200px 600px at 50% -10%, #ffffff 0%, var(--bg) 55%);
  }
}
:root[data-theme="light"] body{
  background:radial-gradient(1200px 600px at 50% -10%, #ffffff 0%, var(--bg) 55%);
}
a{color:var(--acc);text-decoration:none}

/* ---------- 顶栏 ---------- */
.top{
  position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px;
  padding:12px 16px;background:color-mix(in srgb, var(--bg) 86%, transparent);
  backdrop-filter:blur(10px);border-bottom:1px solid var(--line);
}
.top .back{
  width:32px;height:32px;flex:0 0 32px;border-radius:9px;border:1px solid var(--line);
  background:var(--bg2);color:var(--fg2);display:flex;align-items:center;justify-content:center;
  font-size:16px;line-height:1;
}
.top .back:hover{color:var(--fg);border-color:var(--acc)}
.top h1{font-size:16px;margin:0;font-weight:600;flex:1;letter-spacing:.3px;
  min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .st{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--fg2);flex:0 0 auto}
.dot{width:7px;height:7px;border-radius:50%;background:var(--fg2);flex:0 0 auto}
.dot.on{background:var(--ok);box-shadow:0 0 8px var(--ok)}
.dot.err{background:var(--err)}
/* 心跳：每 15 秒刷一次 /api/health，点跟着呼吸一下，表示还在轮询 */
.dot.beat{animation:beat 2s ease-in-out infinite}
@keyframes beat{0%,100%{opacity:1}50%{opacity:.3}}
@media (prefers-reduced-motion: reduce){.dot.beat{animation:none}}

/* 板载指示灯心跳开关：波形图标，开时着色呼吸，关时灰暗 */
.hbtn{
  width:22px;height:22px;flex:0 0 auto;display:flex;align-items:center;justify-content:center;
  padding:0;margin-left:2px;border:0;border-radius:6px;background:none;
  color:var(--fg2);opacity:.5;cursor:pointer;transition:color .2s,opacity .2s,background .2s;
  -webkit-tap-highlight-color:transparent;
}
.hbtn:hover{opacity:1;background:var(--bg2)}
.hbtn:focus-visible{outline:1px solid var(--acc);outline-offset:1px}
.hbtn svg{display:block}
.hbtn.on{color:var(--ok);opacity:1;filter:drop-shadow(0 0 3px var(--ok))}
.hbtn.on svg{animation:beat 2s ease-in-out infinite}
@media (prefers-reduced-motion: reduce){.hbtn.on svg{animation:none}}

/* ---------- 页签 ---------- */
.nav{
  display:flex;gap:6px;overflow-x:auto;padding:10px 16px;
  border-bottom:1px solid var(--line);background:color-mix(in srgb, var(--bg) 86%, transparent);
  backdrop-filter:blur(10px);position:sticky;top:57px;z-index:19;
}
.nav a{
  flex:0 0 auto;font-size:13px;color:var(--fg2);border:1px solid var(--line);
  background:var(--bg2);border-radius:999px;padding:5px 13px;white-space:nowrap;
}
.nav a.on{background:var(--acc);border-color:var(--acc);color:#fff}
.nav a:hover{color:var(--fg)}

/* ---------- 容器 ---------- */
.wrap{max-width:760px;margin:0 auto;padding:16px 14px 40px}
.card{
  background:var(--bg2);border:1px solid var(--line);border-radius:var(--radius);
  padding:16px 18px;margin-bottom:12px;
}
.card>h2{margin:0 0 12px;font-size:13px;font-weight:600;color:var(--fg2);letter-spacing:.5px}
.card.flush{padding:6px 18px}
.muted{color:var(--fg2)}
.small{font-size:12px}
.right{margin-left:auto}
.btn{
  background:var(--bg3);border:1px solid var(--line);color:var(--fg);
  border-radius:9px;padding:7px 13px;font:inherit;font-size:13px;cursor:pointer;
}
.btn:hover{border-color:var(--acc);color:var(--acc)}
.btn.primary{background:var(--acc);border-color:var(--acc);color:#fff}
.btn.primary:hover{color:#fff;filter:brightness(1.08)}
.btn.mini{padding:4px 10px;font-size:12px;border-radius:7px;text-decoration:none}
.card>h2.hd{display:flex;align-items:center;gap:8px}
.card>h2.hd .sp{flex:1}

/* ---------- 页内工具条（更新时间 + 刷新按钮） ---------- */
/* 原先只写在 weather.html 的内联样式里，行情页用了同一个 class
   却拿不到样式，按钮就跑到左边去了。 */
.pgtop{display:flex;align-items:center;gap:10px;margin:0 0 10px}
.pgtop .upd{margin-left:auto;font-size:11.5px;color:var(--fg2);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pgtop .btn{flex:0 0 auto;display:inline-flex;align-items:center;gap:6px}
.pgtop .btn .ic{display:inline-block;font-size:14px;line-height:1}

/* ---------- 门户 ---------- */
.hero{text-align:center;margin:10px 0 26px}
.hero h1{margin:0 0 6px;font-size:24px;font-weight:600;letter-spacing:.5px}
.hero .sub{color:var(--fg2);font-size:13.5px}
.hero .badge{
  display:inline-flex;align-items:center;gap:7px;margin-top:12px;
  background:var(--bg3);border:1px solid var(--line);border-radius:999px;
  padding:5px 14px;font-size:12.5px;color:var(--fg2);
}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.tile{
  display:flex;align-items:center;gap:14px;color:inherit;
  background:linear-gradient(160deg,var(--bg2),var(--bg3));
  border:1px solid var(--line);border-radius:var(--radius);
  padding:18px;transition:.15s;position:relative;overflow:hidden;
}
.tile:hover{border-color:var(--acc);transform:translateY(-2px);box-shadow:0 10px 26px rgba(0,0,0,.45)}
.tile:active{transform:translateY(0)}
.tile .ico{
  width:46px;height:46px;flex:0 0 46px;border-radius:12px;display:flex;
  align-items:center;justify-content:center;background:var(--bg);border:1px solid var(--line);
}
.tile .ico svg{width:22px;height:22px;stroke:var(--acc);fill:none;stroke-width:1.7;
  stroke-linecap:round;stroke-linejoin:round}
.tile b{display:block;font-size:15.5px;font-weight:600;margin-bottom:2px}
.tile span{display:block;color:var(--fg2);font-size:12.5px;white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis}
.tile .go{position:absolute;right:14px;color:var(--fg2);font-size:18px;opacity:.5}
.tile:hover .go{color:var(--acc);opacity:1}

/* ---------- 服务状态小格 ---------- */
.sts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
@media (min-width:560px){.sts{grid-template-columns:repeat(4,minmax(0,1fr))}}
.st1{display:grid;grid-template-columns:auto minmax(0,1fr);column-gap:7px;row-gap:1px;
  align-items:center;background:var(--bg3);border:1px solid var(--line);
  border-radius:10px;padding:9px 11px;font-size:12.5px}
.st1 .dot{grid-column:1;grid-row:1;width:8px;height:8px}
.st1 b{grid-column:2;grid-row:1;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.st1 small{grid-column:2;grid-row:2;font-size:11.5px;color:var(--fg2);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* ---------- 天气 ---------- */
.now{text-align:center;padding:8px 0 4px}
.now .loc{color:var(--fg2);font-size:14px;margin-bottom:4px}
.now .big{display:flex;align-items:flex-end;justify-content:center;gap:14px;margin:6px 0}
.now .temp{font:600 72px/1 ui-monospace,Menlo,Consolas,monospace;letter-spacing:-2px}
.now .temp .deg{font-size:.38em;font-style:normal;vertical-align:.72em;
  margin-left:2px;letter-spacing:0;color:var(--fg2)}
.now .txt{font-size:17px;color:var(--fg2);padding-bottom:9px}
.now .feels{color:var(--fg2);font-size:13.5px;margin-top:2px}
.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:16px}
.metric{background:var(--bg3);border-radius:11px;padding:9px 4px;text-align:center}
.metric .k{font-size:11px;color:var(--fg2)}
.metric .v{font-size:15px;font-weight:600;margin-top:2px}

.aq{display:flex;align-items:center;gap:14px}
.aq .tile-aqi{
  min-width:64px;height:64px;border-radius:16px;display:flex;flex-direction:column;
  align-items:center;justify-content:center;color:#fff;font-weight:700;line-height:1;
  flex:0 0 64px;
}
.aq .tile-aqi b{font-size:24px;letter-spacing:-.5px}
.aq .tile-aqi small{font-size:10px;font-weight:500;opacity:.9;margin-top:3px;letter-spacing:1px}
.aq .info{flex:1;min-width:0}
.aq .cat{font-size:15px;font-weight:600;margin-bottom:3px}
.aq .adv{font-size:12px;color:var(--fg2);line-height:1.55}
.aq-sub{font-size:11px;color:var(--fg2);margin:11px 0 6px}
.poll{display:grid;grid-template-columns:repeat(auto-fit,minmax(84px,1fr));gap:7px;margin-top:12px}
.poll .p{background:var(--bg3);border-radius:9px;padding:8px 9px;text-align:center;
  border-left:3px solid transparent}
.poll .p .n{font-size:10.5px;color:var(--fg2);letter-spacing:.3px}
.poll .p .v{font-size:14.5px;font-weight:600;margin:2px 0 1px}
.poll .p .u{font-size:9.5px;color:var(--fg2)}

.warn-bar{display:flex;align-items:center;gap:9px;font-size:13px;color:var(--fg2)}
.warn-bar .ok-dot{width:9px;height:9px;border-radius:50%;background:var(--ok);
  box-shadow:0 0 0 3px rgba(63,185,80,.16);flex:0 0 9px}
.warn-item{background:var(--bg3);border-left:3px solid var(--err);border-radius:9px;
  padding:10px 12px;margin-bottom:9px}
.warn-item:last-child{margin-bottom:0}
.warn-item .hd{display:flex;align-items:center;gap:8px;margin-bottom:5px;flex-wrap:wrap}
.warn-item .lv{font-size:11px;font-weight:600;padding:1px 7px;border-radius:5px;color:#fff}
.warn-item .ti{font-size:13.5px;font-weight:600}
.warn-item .bd{font-size:12.5px;line-height:1.6;color:var(--fg)}
.warn-item .mt{font-size:11px;color:var(--fg2);margin-top:6px}

.hours{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;scrollbar-width:thin}
.hour{flex:0 0 auto;width:58px;text-align:center;background:var(--bg3);
  border-radius:11px;padding:9px 4px}
.hour .h{font-size:11.5px;color:var(--fg2)}
.hour .i{font-size:20px;margin:5px 0}
.hour .t{font-size:13.5px;font-weight:600}
.hour .p{font-size:10.5px;color:var(--cold);line-height:13px;min-height:26px}
.hour .p b{display:block;font-weight:600;color:#58a6ff;height:13px}
.hour .s{font-size:10.5px;color:var(--fg2);margin-top:2px;white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis}

.day{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}
.day:last-child{border-bottom:0}
.day .d{width:56px;font-size:13.5px}
.day .s{flex:1;font-size:13px;color:var(--fg2);min-width:0;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap}
.day .r{font-size:13.5px;font-variant-numeric:tabular-nums;white-space:nowrap}
.day .r b{color:var(--warm);font-weight:600}
.day .r i{color:var(--cold);font-style:normal}

.idx{display:grid;grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:8px}
.idx .it{background:var(--bg3);border-radius:10px;padding:9px 11px;font-size:12px}
.idx .it b{display:block;font-size:13px;margin-bottom:2px}
.idx .it span{color:var(--fg2)}

/* ---------- 状态 ---------- */
.meters{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.meter .k{font-size:11px;color:var(--fg2)}
.meter .v{font-size:19px;font-weight:600;font-variant-numeric:tabular-nums}
.bar{height:5px;background:var(--line);border-radius:3px;margin-top:6px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--acc2);border-radius:3px;transition:width .35s}
.bar i.warn{background:var(--warm)}
.bar i.crit{background:var(--err)}

table.kv{width:100%;border-collapse:collapse;font-size:13px}
table.kv td{padding:8px 0;border-bottom:1px solid var(--line);vertical-align:top}
table.kv td:first-child{color:var(--fg2);width:42%}
table.kv tr:last-child td{border-bottom:0}
table.kv .mono{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12.5px}

/* ---------- 流量 ---------- */
.dev{display:flex;align-items:center;justify-content:space-between;
  padding:10px 0;border-bottom:1px solid var(--line)}
.dev:last-child{border-bottom:0}
.dev .nm{font-size:13.5px;font-weight:500}
.dev .ip{color:var(--fg2);font-size:11.5px}
.dev .vals{text-align:right;white-space:nowrap;
  font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12.5px}
.dev .dn{color:var(--ok)}
.dev .up{color:var(--cold)}
.rank{display:inline-block;width:20px;color:var(--fg2);font-size:12px}

/* ---------- IPTV ---------- */
.player{position:relative;background:#0b0e12;border-radius:12px;overflow:hidden;
  aspect-ratio:16/9;border:1px solid var(--line)}
video{width:100%;height:100%;display:block;background:#0b0e12}
.ptip{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  color:#8b98a9;font-size:13px;text-align:center;padding:0 24px;pointer-events:none}
.ph{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.ph b{font-size:14px}
.search{background:var(--bg3);border:1px solid var(--line);color:var(--fg);
  border-radius:9px;padding:7px 11px;font:inherit;font-size:13px;width:46%}
.search:focus{outline:none;border-color:var(--acc)}
.grp{margin-top:14px}
.grp h3{margin:0 0 4px;font-size:12px;color:var(--fg2);font-weight:600;letter-spacing:.5px}
.ch{display:flex;align-items:center;justify-content:space-between;gap:10px;
  padding:10px 10px;border-radius:9px;font-size:14px;cursor:pointer}
.ch:hover{background:var(--bg3)}
.ch.playing{background:var(--bg3);box-shadow:inset 2px 0 0 var(--acc)}
.ch .tag{font-size:11px;color:var(--fg2);white-space:nowrap}
.ch .tag.live{color:var(--ok)}
.ch .tag.live::before{content:"● ";font-size:9px;vertical-align:1px}
.ch .tag.dead{color:var(--fg2)}

/* ---------- 提示 ---------- */
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(14px);
  background:#1f2937;border:1px solid var(--line);color:#e6edf3;padding:9px 18px;
  border-radius:9px;font-size:13px;opacity:0;transition:.25s;pointer-events:none;z-index:60}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.foot{color:var(--fg2);font-size:12px;text-align:center;margin:18px 0 0;line-height:1.9}
.foot code{background:var(--bg3);border:1px solid var(--line);border-radius:5px;padding:1px 6px;font-size:11.5px}
.foot a{color:var(--fg2);text-decoration:none;border-bottom:1px dashed var(--line)}
.foot a:hover{color:var(--acc);border-bottom-color:var(--acc)}

@media (max-width:520px){
  .wrap{padding:12px 12px 32px}
  .nav{gap:4px;padding:9px 10px}
  .nav a{padding:4px 9px;font-size:12px}
  .now .temp{font-size:58px}
  .meters{grid-template-columns:1fr 1fr;gap:10px}
  .grid{grid-template-columns:1fr}
}

/* ---------- 信息流模块（新闻；视觉与首页 .tile 一致） ---------- */
.feed{display:grid;gap:12px}
.feed>.empty{grid-column:1/-1}
.frow{min-width:0}
.frow .fh{display:flex;align-items:center;gap:8px;flex-wrap:wrap;row-gap:4px;
  margin-bottom:6px;font-size:12.5px;color:var(--fg);
  font-variant-numeric:tabular-nums}
.frow .fh .ft{font-weight:600}
.frow .fh .ftag,.frow .fh .fbtn{flex:0 0 auto}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.chips button{font-size:12px;padding:4px 10px;border-radius:999px;cursor:pointer;
  border:1px solid var(--line);background:var(--bg3);color:var(--fg2);font-family:inherit}
.chips button.on{border-color:var(--acc);color:var(--acc);background:rgba(255,106,0,.12)}
.chips .lbl{font-size:11.5px;color:var(--fg2);align-self:center;margin-right:2px}
.empty{padding:20px 0;text-align:center}
.fitem{min-width:0;background:linear-gradient(160deg,var(--bg2),var(--bg3));
  border:1px solid var(--line);border-radius:var(--radius);padding:12px 14px}
.fitem .fb{font-size:13.5px;line-height:1.6;white-space:pre-wrap;word-break:break-word}
.fitem .fb b{font-weight:600;color:var(--fg)}
.flv{font-size:10.5px;border-radius:5px;padding:1px 6px;flex:0 0 auto}
.flv.A{background:rgba(230,60,60,.16);color:#e23c3c}
.flv.B{background:rgba(240,160,40,.16);color:#d98a1a}
.flv.C{background:var(--bg3);color:var(--fg2)}
.ftag{font-size:11px;color:var(--fg2);border:1px solid var(--line);
  border-radius:999px;padding:1px 7px}
.fbtn{font-size:11px;border:1px solid var(--line);border-radius:999px;
  padding:1px 7px;cursor:pointer;background:var(--bg2);color:var(--fg2);font-family:inherit}
.fbtn.added{border-color:var(--ok);color:var(--ok)}

/* ---------- 主题皮肤 ----------
 * 每套只改强调色的四个值，底色、描边与语义色不动。
 * 顶栏「衣服」按钮循环切换，选择存在 localStorage 与板上 config 的 ui.skin。
 * orange 就是原来那套配色（:root 默认值），这里显式写一份，方便从别的皮肤切回来。
 */
:root[data-skin="orange"]{
  --sk:#ff6a00; --sk2:#3b82f6; --skL:#ff6a00; --sk2L:#3b82f6;
}
:root[data-skin="blue"]{
  --sk:#2563eb; --sk2:#1d4ed8; --skL:#60a5fa; --sk2L:#3b82f6;
}
:root[data-skin="green"]{
  --sk:#15803d; --sk2:#0d9488; --skL:#4ade80; --sk2L:#2dd4bf;
}
:root[data-skin="rose"]{
  --sk:#be123c; --sk2:#be185d; --skL:#fb7185; --sk2L:#f472b6;
}
:root[data-skin="violet"]{

<script>
/* ESP32 终端服务器 · 公共前端
 * 各页面共用：取数、格式化、顶栏与页签、提示条
 */
"use strict";

var MR = (function () {

  var PAGES = [
    { href: "/", title: "首页" },
    { href: "/weather.html", title: "天气" },
    { href: "/quake.html", title: "地震" },
    { href: "/news.html", title: "新闻" },
    { href: "/market.html", title: "行情" },
    { href: "/iptv.html", title: "直播" },
    { href: "/radio.html", title: "电台" },
    { href: "/info.html", title: "本机" },
    { href: "/ntp.html", title: "校时" }
  ];

  function $(id) { return document.getElementById(id); }

  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }

  function api(path) {
    return fetch(path, { cache: "no-store" }).then(function (r) {
      if (!r.ok) throw new Error("HTTP " + r.status);
      return r.json();
    });
  }

  /* 写接口：统一按 {"ok":0,"msg":...} 判失败，异常信息直接给用户看 */
  function post(path, body) {
    return fetch(path, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(body || {})
    }).then(function (r) {
      return r.json().catch(function () { return {}; }).then(function (d) {
        if (!r.ok || !d.ok) throw new Error(d.msg || ("HTTP " + r.status));
        return d;
      });
    });
  }

  function fmtBytes(n) {
    n = Number(n) || 0;
    if (n < 1024) return n + " B";
    if (n < 1048576) return (n / 1024).toFixed(1) + " KB";
    if (n < 1073741824) return (n / 1048576).toFixed(1) + " MB";
    return (n / 1073741824).toFixed(2) + " GB";
  }

  function fmtDur(sec) {
    sec = Number(sec) || 0;
    var d = Math.floor(sec / 86400), h = Math.floor(sec % 86400 / 3600), m = Math.floor(sec % 3600 / 60);
    if (d) return d + " 天 " + h + " 小时";
    if (h) return h + " 小时 " + m + " 分";
    if (sec < 60) return Math.round(sec) + " 秒";
    return m + " 分钟";
  }

  function pad(n) { return n < 10 ? "0" + n : "" + n; }
  function hhmm(d) { return pad(d.getHours()) + ":" + pad(d.getMinutes()); }
  function mmdd(s) { return s ? s.substr(5, 5) : "--"; }

  function currentPage() {
    var p = location.pathname;
    if (p === "" || p === "/" || p === "/index.html") return "/";
    return p.replace(/^\/+/, "/");
  }

  /* 板载指示灯心跳开关。图标画在 IP 右侧，点一下切一次，状态存板上配置。
     显示与否取决于 /api/health 的 led_hw：没有可控指示灯的设备不出现按钮。 */
  var LED_SVG = '<svg viewBox="0 0 24 24" width="14" height="14" fill="none" ' +
    'stroke="currentColor" stroke-width="2" stroke-linecap="round" ' +
    'stroke-linejoin="round" aria-hidden="true"><path d="M2 12h4l2.5-7 5 14 2.5-7h8"/></svg>';

  function setLedBtn(on, hw) {
    var b = $("hLed");
    if (!b) return;
    b.style.display = hw ? "" : "none";
    b.className = "hbtn" + (on ? " on" : "");
    b.setAttribute("data-on", on ? "1" : "0");
    b.setAttribute("aria-pressed", on ? "true" : "false");
    b.title = on ? "板载心跳：开（点击关闭）" : "板载心跳：关（点击开启）";
  }

  function toggleLed() {
    var b = $("hLed");
    if (!b || b.getAttribute("data-busy") === "1") return;
    var want = b.getAttribute("data-on") === "1" ? 0 : 1;
    b.setAttribute("data-busy", "1");
    post("/api/led", { on: want }).then(function (r) {
      b.removeAttribute("data-busy");
      setLedBtn(r.on ? 1 : 0, 1);
      toast(r.on ? "板载心跳已开启" : "板载心跳已关闭", 1600);
    }).catch(function (e) {
      b.removeAttribute("data-busy");
      toast(e && e.message ? e.message : "切换失败");
    });
  }

  /* 深浅色切换。空值表示跟随系统，选中后写入 localStorage 锁定。
     图标画的是“点一下会切到的模式”：现在亮色给月亮，现在暗色给太阳。 */
  var THEME_KEY = "mr.theme";
  var SUN_SVG = '<svg viewBox="0 0 24 24" width="14" height="14" fill="none" ' +
    'stroke="currentColor" stroke-width="2" stroke-linecap="round" ' +
    'stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/>' +
    '<path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2"/>' +
    '<path d="M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>';
  var MOON_SVG = '<svg viewBox="0 0 24 24" width="14" height="14" fill="none" ' +
    'stroke="currentColor" stroke-width="2" stroke-linecap="round" ' +
    'stroke-linejoin="round" aria-hidden="true">' +
    '<path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>';

  function themePref() {
    try { return localStorage.getItem(THEME_KEY) || ""; } catch (e) { return ""; }
  }

  /* 判定顺序：DOM 上的 data-theme（构建时注入的引导脚本已按 localStorage 打过）
     → localStorage → 系统配色。少了第一项，手动锁定后图标会画错方向。 */
  function themeNow() {
    var d = document.documentElement.getAttribute("data-theme");
    if (d === "light" || d === "dark") return d;
    var t = themePref();
    if (t === "light" || t === "dark") return t;
    return (window.matchMedia &&
      window.matchMedia("(prefers-color-scheme: light)").matches) ? "light" : "dark";
  }

  function paintThemeBtn() {
    var b = $("hTheme");
    if (!b) return;
    var light = themeNow() === "light";
    b.innerHTML = light ? MOON_SVG : SUN_SVG;
    b.title = light ? "切换到深色" : "切换到浅色";
    b.setAttribute("aria-label", b.title);
  }

  function toggleTheme() {
    var next = themeNow() === "light" ? "dark" : "light";
    document.documentElement.setAttribute("data-theme", next);
    try { localStorage.setItem(THEME_KEY, next); } catch (e) {}
    paintThemeBtn();
  }

  /* ---------- 主题皮肤 ----------
     只换强调色，明暗由旁边的太阳/月亮按钮管。图标是一件衣服，点一下换下一套。
     顺序即点击顺序：蓝 → 绿 → 橙 → 玫红 → 紫 → 青。 */
  var SKINS = ["orange", "blue", "green", "rose", "violet", "teal"];
  var SKIN_NAME = { orange: "橙", blue: "蓝", green: "绿",
                    rose: "玫红", violet: "紫", teal: "青" };
  var SKIN_KEY = "mr.skin";
  var SHIRT_SVG = '<svg viewBox="0 0 24 24" width="14" height="14" fill="none" ' +
    'stroke="currentColor" stroke-width="2" stroke-linecap="round" ' +
    'stroke-linejoin="round" aria-hidden="true">' +
    '<path d="M9 3l3 2 3-2 4 3-2 3-2-1v11H9V8L7 9 5 6z"/></svg>';

  function skinNow() {
    var d = document.documentElement.getAttribute("data-skin");
    if (d) return d;
    try {
      var v = localStorage.getItem(SKIN_KEY);
      if (v) return v;
    } catch (e) {}
    if (MR.device && MR.device.ui_skin) return MR.device.ui_skin;
    return "orange";
  }

  /* 以板上配置为准：换浏览器 / 清缓存后打开，还是设备上保存的那一套。
     只在没存过、或板上值与当前不同时才改 DOM，避免每 15 秒心跳重排一次。 */
  function applySkinFromDevice(h) {
    if (!h || !h.ui_skin) return;
    if (h.ui_skin !== document.documentElement.getAttribute("data-skin")) {
      document.documentElement.setAttribute("data-skin", h.ui_skin);
      try { localStorage.setItem(SKIN_KEY, h.ui_skin); } catch (e) {}
    }
    paintSkinBtn();
  }

  function paintSkinBtn() {
    var b = $("hSkin");
    if (!b) return;
    var s = skinNow();
    b.title = "主题色：" + (SKIN_NAME[s] || s) + "（点击切换）";
    b.setAttribute("aria-label", b.title);
    b.style.color = "var(--acc)";
    b.style.opacity = "1";
  }

  function toggleSkin() {
    var i = SKINS.indexOf(skinNow());
    var next = SKINS[(i < 0 ? 0 : i + 1) % SKINS.length];
    document.documentElement.setAttribute("data-skin", next);
    try { localStorage.setItem(SKIN_KEY, next); } catch (e) {}
    paintSkinBtn();
    toast("主题色：" + (SKIN_NAME[next] || next));
    /* 同步到板上：写盘后重启、OTA 都不影响；失败只影响跨设备一致性 */
    post("/api/skin", { skin: next }).catch(function () {});
  }

  /* 跟随系统时，系统配色变了要把图标跟着换掉 */
  if (window.matchMedia) {
    var mq = window.matchMedia("(prefers-color-scheme: light)");
    var onScheme = function () { if (!themePref()) paintThemeBtn(); };
    if (mq.addEventListener) mq.addEventListener("change", onScheme);
    else if (mq.addListener) mq.addListener(onScheme);
  }

  /* 顶栏 + 页签。title 为空时不显示返回键。
     挂载完就自动开始心跳：以前要求每页自己调 healthTick()，漏掉一页
     右上角就永远停在初始文案「连接中…」。 */
  function mountTop(title) {
    var cur = currentPage();
    var nav = PAGES.map(function (p) {
      var on = p.href === cur ? " on" : "";
      return '<a class="' + on.trim() + '" href="' + p.href + '">' + p.title + "</a>";
    }).join("");

    var back = cur === "/" ? "" :
      '<a class="back" href="/" title="返回首页">‹</a>';

    var html =
      '<div class="top">' + back +
      "<h1>" + esc(title) + "</h1>" +
      '<div class="st"><span class="dot" id="hDot"></span><span id="hIp">连接中…</span>' +
      '<button class="hbtn" id="hLed" type="button" data-on="0" ' +
      'aria-pressed="false" title="板载心跳">' + LED_SVG + "</button>" +
      '<button class="hbtn" id="hSkin" type="button" title="主题色">' +
      SHIRT_SVG + "</button>" +
      '<button class="hbtn" id="hTheme" type="button" title="切换深浅色"></button></div>' +
      "</div>" +
      '<div class="nav">' + nav + "</div>";

    var host = document.getElementById("topbar");
    if (host) {
      host.innerHTML = html;
      var lb = $("hLed");
      if (lb) lb.onclick = toggleLed;
      var sk = $("hSkin");
      if (sk) sk.onclick = toggleSkin;
      var tb = $("hTheme");
      if (tb) tb.onclick = toggleTheme;
      paintSkinBtn();
      paintThemeBtn();
      startBeat();
    }
  }

  var tickBusy = null, tickAt = 0, tickTimer = 0;

  /* 心跳：取一次 /api/health，把 IP 与状态点刷到顶栏。
     重复调用复用同一次请求，多页共用一个 15 秒定时器。 */
  function healthTick() {
    /* 页面在后台就不再问：这个请求每 15 秒一次，比空闲降频阈值（20 秒）还密，
       会让设备一直停在满频，休眠记录永远产生不了。回到前台时补一次。 */
    if (document.hidden) return Promise.resolve(MR.device);
    if (tickBusy) return tickBusy;
    if (MR.device && Date.now() - tickAt < 800) return Promise.resolve(MR.device);
    tickBusy = api("/api/health").then(function (h) {
      var dot = $("hDot"), ip = $("hIp");
      if (dot) dot.className = "dot beat " + (h.router_ok ? "on" : "err");
      if (ip) {
        ip.textContent = h.ip;
        ip.title = (h.router_ok ? "路由器可达" : "路由器不可达") + " · RSSI " + h.rssi +
          " · 运行 " + fmtDur(h.up) + " · 空闲内存 " + fmtBytes(h.mem_free);
      }
      setLedBtn(h.led_on ? 1 : 0, h.led_hw ? 1 : 0);
      applySkinFromDevice(h);
      MR.device = h;
      return h;
    }).catch(function () {
      var dot = $("hDot"), ip = $("hIp");
      if (dot) dot.className = "dot beat err";
      // 掉了也别把 IP 抹成占位文案，留着最后已知的地址更有用
      if (ip) {
        ip.textContent = MR.device ? MR.device.ip : "离线";
        ip.title = "设备无响应";
      }
      return null;
    }).then(function (r) {
      tickBusy = null;
      tickAt = Date.now();
      return r;
    });
    return tickBusy;
  }

  function startBeat() {
    if (tickTimer) return;
    document.addEventListener("visibilitychange", function () {
      if (!document.hidden) healthTick();   // 切回前台立即补一次，别等下一个 15 秒
    });
    healthTick();
    tickTimer = setInterval(healthTick, 15000);
  }

  var toastTimer = 0;
  function toast(msg, ms) {
    var el = document.getElementById("toast");
    if (!el) {
      el = document.createElement("div");
      el.id = "toast";
      el.className = "toast";
      document.body.appendChild(el);
    }
    el.textContent = msg;
    el.className = "toast on";
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { el.className = "toast"; }, ms || 2600);
  }

  function empty(msg) { return '<span class="muted small">' + esc(msg) + "</span>"; }

  return {
    $: $, esc: esc, api: api, post: post, fmtBytes: fmtBytes, fmtDur: fmtDur,
    hhmm: hhmm, mmdd: mmdd, mountTop: mountTop, healthTick: healthTick,
    startBeat: startBeat,
    toast: toast, empty: empty, PAGES: PAGES, device: null
  };
})();

</script>
<script>
MR.mountTop("IPTV 电视直播");

var state = {
  channels: [], filter: "", open: "", openGrp: "",
  router: { host: "10.0.0.1", r2h_port: 5140, udpxy_port: 12123 },
  playing: null, idx: -1, byKey: {}, mode: "live",
  /* 节目单缓存：按 tvg-id 存一份，5 分钟内不重复取；epgDay 记住每台选的日期 */
  epg: {}, epgBusy: {}, epgBad: {}, epgDay: {}
};

MR.healthTick().then(function (h) {
  if (h && h.router) state.router = h.router;
  render();
}).catch(function () { render(); });

function urls(ip, port) {
  var r = state.router;
  return {
    r2h: "http://" + r.host + ":" + (r.r2h_port || 5140) + "/rtp/" + ip + ":" + port,
    udp: "http://" + r.host + ":" + (r.udpxy_port || 12123) + "/rtp/" + ip + ":" + port,
    mcast: "rtp://" + ip + ":" + port
  };
}

/* ---------------- 时间换算 ----------------
   节目单里的时间一律是北京时间的 14 位数字。全部按「拿 epoch 加 8 小时再读 UTC」
   换算，浏览器在哪个时区都不影响比较与回看时间戳。 */
function pad2(n) { return n < 10 ? "0" + n : "" + n; }

function bjStamp(ms) {
  var d = new Date((ms === undefined ? Date.now() : ms) + 28800000);
  return d.getUTCFullYear() + pad2(d.getUTCMonth() + 1) + pad2(d.getUTCDate()) +
    pad2(d.getUTCHours()) + pad2(d.getUTCMinutes()) + pad2(d.getUTCSeconds());
}

function epochFromBj(s) {
  return Math.floor(Date.UTC(+s.substr(0, 4), +s.substr(4, 2) - 1, +s.substr(6, 2),
    +s.substr(8, 2), +s.substr(10, 2), +s.substr(12, 2)) / 1000) - 28800;
}

function hhmm14(s) { return s.substr(8, 2) + ":" + s.substr(10, 2); }

function dayNum(day) {
  return Date.UTC(+day.substr(0, 4), +day.substr(4, 2) - 1, +day.substr(6, 2)) / 86400000;
}

function dayLabel(day, today) {
  var diff = dayNum(day) - dayNum(today);
  if (diff === 0) return "今天";
  if (diff === -1) return "昨天";
  if (diff === 1) return "明天";
  return day.substr(4, 2) + "/" + day.substr(6, 2);
}

function copyText(text, okMsg) {
  function ok(flag) {
    MR.toast(flag ? (okMsg || "已复制") : "复制失败，请长按地址手动选择");
  }
  function fallback() {
    var ta = document.createElement("textarea");
    ta.value = text;
    ta.setAttribute("readonly", "");
    ta.style.cssText = "position:fixed;top:0;left:0;opacity:0;width:1px;height:1px";
    document.body.appendChild(ta);
    ta.select();
    ta.setSelectionRange(0, text.length);
    var done = false;
    try { done = document.execCommand("copy"); } catch (e) { }
    document.body.removeChild(ta);
    ok(done);
  }
  if (navigator.clipboard && window.isSecureContext) {
    navigator.clipboard.writeText(text).then(function () { ok(true); }, fallback);
  } else {
    fallback();
  }
}

function addrBlock(c) {
  var u = urls(c.ip, c.port);
  var rows = [
    ["VLC / 手机", u.r2h],
    ["TVBox / DIYP", u.udp],
    ["原始组播", u.mcast]
  ];
  return '<div class="addr">' + rows.map(function (it) {
    return '<div class="arow"><span class="k">' + it[0] + "</span>" +
      "<code>" + MR.esc(it[1]) + "</code>" +
      '<button class="btn" data-cp="' + MR.esc(it[1]) + '">复制</button></div>';
  }).join("") + "</div>";
}

/* 展开频道后先给节目单，再给地址。没有 tvg-id 的频道不出节目单，也就没有回看入口 */
function chanExtra(c) {
  var epg = c.tvg ? '<div class="epgbox" data-tvg="' + MR.esc(c.tvg) +
    '" data-key="' + MR.esc(c.key) + '"></div>' : "";
  return epg + addrBlock(c);
}

/* ---------------- 节目单 ----------------
   切片由路由器 nginx 静态提供（/iptv/epg/<tvg-id>.json，已放行跨域），
   浏览器直连，板子只发页面不参与。 */
function epgFetch(tvg) {
  if (state.epgBusy[tvg]) return;
  var hit = state.epg[tvg];
  if (hit && Date.now() - hit.ts < 300000) return;   // 内存里 5 分钟内不重复取
  if (!hit && state.epgBad[tvg] && Date.now() - state.epgBad[tvg] < 60000) return;
  state.epgBusy[tvg] = 1;
  var u = "http://" + state.router.host + "/iptv/epg/" + encodeURIComponent(tvg) + ".json";
  fetch(u, { cache: "force-cache" }).then(function (r) {
    if (!r.ok) throw new Error("HTTP " + r.status);
    return r.json();
  }).then(function (d) {
    state.epgBusy[tvg] = 0;
    state.epg[tvg] = { ts: Date.now(), p: (d && d.p) || [] };
    epgPaint(tvg);
  }).catch(function () {
    state.epgBusy[tvg] = 0;
    state.epgBad[tvg] = Date.now();
    epgPaint(tvg);
  });
}

function epgPaint(tvg) {
  var boxes = MR.$("list").querySelectorAll('.epgbox[data-tvg="' + tvg + '"]');
  for (var i = 0; i < boxes.length; i++) epgPaint1(boxes[i]);
}

function epgPaint1(box) {
  var tvg = box.dataset.tvg;
  box.innerHTML = epgHtml(tvg, box.dataset.key);
  epgFetch(tvg);
  var rows = box.querySelector(".rows"), cur = box.querySelector(".row.now");
  if (rows && cur && cur.offsetTop >= rows.firstChild.offsetTop) {
    var off = cur.offsetTop - rows.firstChild.offsetTop;
    rows.scrollTop = Math.max(0, off - rows.clientHeight / 2 + cur.offsetHeight / 2);
  }
}

function epgHtml(tvg, key) {
  var e = state.epg[tvg];
  if (!e) {
    return '<div class="epg"><div class="epgnote">' +
      (state.epgBad[tvg] ? "节目单暂时取不到" : "节目单加载中…") + "</div></div>";
  }
  if (!e.p.length) return '<div class="epg"><div class="epgnote">这两天没有节目单</div></div>';

  var now = bjStamp(), today = now.substr(0, 8);
  var days = {}, order = [];
  e.p.forEach(function (r) {
    var d = r[0].substr(0, 8);
    if (!days[d]) { days[d] = []; order.push(d); }
    days[d].push(r);
  });
  order.sort();
  var sel = state.epgDay[tvg];
  if (!days[sel]) sel = days[today] ? today : order[order.length - 1];

  var tabs = "";
  if (order.length > 1) {
    tabs = '<div class="tabs">' + order.map(function (d) {
      return '<button class="tab' + (d === sel ? " on" : "") + '" data-tvg="' +
        MR.esc(tvg) + '" data-day="' + d + '">' + dayLabel(d, today) + "</button>";
    }).join("") + "</div>";
  }

  var c = state.byKey[key] || {};
  var rows = days[sel].map(function (r) {
    var s = r[0], en = r[1], isNow = (s <= now && now < en), past = en <= now;
    var cls = "row", badge = "", live = "";
    if (isNow) {
      cls += " now can"; badge = '<span class="rb">直播中</span>'; live = "1";
    } else if (past) {
      if (c.cu && c.chid) { cls += " can"; badge = '<span class="rb">回看</span>'; }
      else cls += " no";
    }
    return '<div class="' + cls + '" data-key="' + MR.esc(key) + '" data-s="' + s +
      '" data-e="' + en + '" data-live="' + live + '">' +
      '<span class="tm">' + hhmm14(s) + "</span>" +
      '<span class="ti">' + MR.esc(r[2] || "") + "</span>" + badge + "</div>";
  }).join("");

  return '<div class="epg">' + tabs + '<div class="rows">' + rows + "</div></div>";
}

function render() {
  var q = state.filter.toLowerCase();
  var groups = {}, order = [];
  state.byKey = {};

  state.channels.forEach(function (it) {
    var c = {
      name: it[0] || "", grp: it[1] || "未分组", ip: it[2], port: it[3], live: it[4],
      /* [9] tvg-id 用来对节目单，[10] 可回看，[11] 回看 chid；旧缓存可能没有后两项 */
      tvg: it[9] || "", cu: it[10] === "1", chid: it[11] || ""
    };
    if (!c.ip || !c.port) return;
    c.key = c.ip + ":" + c.port;
    if (q && (c.name + " " + c.grp + " " + c.ip).toLowerCase().indexOf(q) < 0) return;
    if (!groups[c.grp]) { groups[c.grp] = []; order.push(c.grp); }
    groups[c.grp].push(c);
    state.byKey[c.key] = c;
  });

  var searching = q.length > 0;
  var total = 0;

  var html = order.map(function (g) {
    var arr = groups[g];
    total += arr.length;

    /* 搜索时全部展开，平时只展开 state.openGrp 那一组 */
    var isOpen = searching || (g === state.openGrp);
    var playingIn = false;

    var list = "";
    if (isOpen) {
      list = arr.map(function (c) {
        var key = c.ip + ":" + c.port;
        var playing = (state.playing && state.playing.key === key);
        if (playing) playingIn = true;
        var on = (key === state.open);
        var tag = c.live === "1" ? '<span class="tag live">可用</span>'
          : c.live === "0" ? '<span class="tag dead">失效</span>'
            : '<span class="tag">未检测</span>';
        /* 回看入口只有节目单一条路径：没有 tvg-id 就没有节目单，标了也点不到，
           所以三项齐全（模板 / chid / tvg-id）才显示 */
        var cutag = (c.cu && c.chid && c.tvg) ? '<span class="tag cu">可回看</span>' : "";
        var pdot = playing ? '<span class="tag live">' +
          (state.playing.vod ? "回看中" : "播放中") + "</span>" : "";
        return '<div class="cblk" data-key="' + MR.esc(key) + '">' +
          '<div class="ch' + (on || playing ? " on" : "") + '">' +
          '<span class="name">' + MR.esc(c.name) + "</span>" + pdot + cutag + tag +
          '<span class="caret">▸</span></div>' +
          (on ? chanExtra(c) : "") + "</div>";
      }).join("");
    } else if (state.playing && arr.some(function (c) {
      return (c.ip + ":" + c.port) === state.playing.key;
    })) {
      playingIn = true;
    }

    return '<div class="grp' + (isOpen ? " open" : "") + '">' +
      '<div class="ghd" data-grp="' + MR.esc(g) + '">' +
      '<span class="gname">' + MR.esc(g) + "</span>" +
      (playingIn ? '<span class="tag live">播放中</span>' : "") +
      '<span class="gcnt">' + arr.length + "</span>" +
      '<span class="gcaret">▸</span></div>' +
      (isOpen ? '<div class="gbody">' + list + "</div>" : "") +
      "</div>";
  }).join("");

  MR.$("list").innerHTML = html || MR.empty("没有匹配的频道");
  MR.$("cnt").textContent = total + " 个";
  var boxes = MR.$("list").querySelectorAll(".epgbox");
  for (var i = 0; i < boxes.length; i++) epgPaint1(boxes[i]);
  state.visible = [];
  order.forEach(function (g) { groups[g].forEach(function (c) { state.visible.push(c); }); });
}

function buildM3U(onlyLive) {
  var r = state.router;
  var lines = ["#EXTM3U"];
  (state.visible || []).forEach(function (c) {
    if (onlyLive && c.live === "0") return;
    lines.push('#EXTINF:-1 group-title="' + c.grp + '",' + c.name);
    lines.push("http://" + r.host + ":" + (r.r2h_port || 5140) + "/rtp/" + c.ip + ":" + c.port);
  });
  return lines.join("\n");
}

/* ---------------- 播放器 ---------------- */
var player = null;      // mpegts.js 实例（直播）
var hls = null;         // hls.js 实例（回看）
var video = MR.$("video");

function showErr(msg) {
  var e = MR.$("perr");
  e.textContent = msg;
  e.classList.add("show");
  MR.$("pstat").textContent = "播放失败";
}

function clearErr() { MR.$("perr").classList.remove("show"); }
function setStatus(t) { MR.$("pstat").textContent = t; }

/* 拆播放内核但不重绘：由调用方决定接下来是走直播还是回看，避免连着重绘两次 */
function teardown() {
  if (hls) { try { hls.destroy(); } catch (e) { } hls = null; }
  if (player) {
    try { player.destroy(); } catch (e) { }
    player = null;
  }
  try { video.pause(); } catch (e) { }
  try { video.removeAttribute("src"); video.load(); } catch (e) { }
  state.playing = null; state.idx = -1; state.mode = "live";
  MR.$("ptitle").textContent = "未在播放";
  MR.$("pcover").style.display = "flex";
  MR.$("toLive").style.display = "none";
  setStatus("");
  clearErr();
}

function stop() { teardown(); render(); }

/* 播放内核按需加载：首屏不下载 218KB 的 mpegts.min.js，只有真的点播放才去取。
   实测 jsdelivr 走公网要 2.1 秒，比板子本地 0.67 秒还慢，所以只用本地；
   取到后浏览器按 max-age 缓存，后续打开直接复用。 */
var _kernelP = null;
function loadKernel() {
  if (window.mpegts) return Promise.resolve();
  if (_kernelP) return _kernelP;
  _kernelP = new Promise(function (resolve, reject) {
    var s = document.createElement("script");
    var done = false;
    var timer = setTimeout(function () {
      if (done) return;
      done = true;
      if (s.parentNode) s.parentNode.removeChild(s);
      reject(new Error("timeout"));
    }, 15000);
    s.src = "/mpegts.min.js?v=20261107d.7.3";
    s.onload = function () {
      if (done) return;
      done = true; clearTimeout(timer);
      if (window.mpegts) resolve(); else reject(new Error("empty"));
    };
    s.onerror = function () {
      if (done) return;
      done = true; clearTimeout(timer);
      reject(new Error("load error"));
    };
    document.head.appendChild(s);
  });
  return _kernelP;
}

function playChannel(c, idx) {
  if (!c || !c.ip || !c.port) return;
  if (typeof mpegts === "undefined") {
    setStatus("加载播放内核…");
    loadKernel().then(function () { playChannel(c, idx); })
      .catch(function () {
        showErr("播放内核加载失败：板子本地取不到 mpegts.min.js");
        setStatus("");
      });
    return;
  }
  teardown();
  state.playing = { name: c.name, grp: c.grp, key: c.key };
  state.idx = idx;
  state.open = state.playing.key;
  state.openGrp = c.grp;   // 展开所属分组，保证能看到正在播的那一项

  var url = urls(c.ip, c.port).r2h;  // 仅 :5140 有 CORS
  MR.$("ptitle").textContent = c.name;
  MR.$("pcover").style.display = "none";
  setStatus("连接中…");
  clearErr();

  try {
    player = mpegts.createPlayer({
      type: "mpegts",
      isLive: true,
      url: url,
      enableWorker: false
    });
    player.attachMediaElement(video);
    player.load();
    player.play().catch(function () { /* 自动播放被拦，等用户点击 */ });
    player.on(mpegts.Events.ERROR, function (e, info) {
      if (info && info.details === "xhrSetupError") {
        showErr("拉流被拒（跨域/连接失败）：" + url);
      } else {
        showErr("播放出错：" + (info ? (info.type || info.details || "") : ""));
      }
      setStatus("播放失败");
    });
  } catch (e) {
    showErr("创建播放器失败：" + (e && e.message ? e.message : e));
  }
  render();
}

/* ---------------- 回看 ----------------
   上游回看 CDN 不回跨域头，网页不能直接取 m3u8 与分片，必须走路由器的
   /http/ 反代（rtp2httpd 转发、nginx 补 CORS）。地址的换算（epoch → 北京
   时间）仍在 CGI 里做，这里只负责把域名换成反代前缀。 */
var _hlsP = null;
function proxyUrl(u) {
  return String(u).replace(/^https?:\/\//i, "http://" + state.router.host + "/http/");
}

function loadHls() {
  if (window.Hls) return Promise.resolve();
  if (_hlsP) return _hlsP;
  _hlsP = new Promise(function (resolve, reject) {
    var s = document.createElement("script");
    var done = false;
    var timer = setTimeout(function () {
      if (done) return;
      done = true;
      if (s.parentNode) s.parentNode.removeChild(s);
      reject(new Error("timeout"));
    }, 15000);
    s.src = "/hls.js";
    s.onload = function () {
      if (done) return;
      done = true; clearTimeout(timer);
      if (window.Hls) resolve(); else reject(new Error("empty"));
    };
    s.onerror = function () {
      if (done) return;
      done = true; clearTimeout(timer);
      reject(new Error("load error"));
    };
    document.head.appendChild(s);
  });
  return _hlsP;
}

function playCatchup(key, s, e) {
  var c = state.byKey[key];
  if (!c) return;
  if (!c.chid) { MR.toast("该频道不支持回看"); return; }
  var sn = epochFromBj(s), en = epochFromBj(e);
  var now = Math.floor(Date.now() / 1000);
  if (en > now) en = now;                 // 正在播出的节目截到当前时刻
  if (en - sn < 30) { MR.toast("这档节目还没播完，先看直播"); return; }

  setStatus("获取回看地址…");
  clearErr();
  var q = "http://" + state.router.host + "/cgi-bin/iptv?a=tvr&u=1&c=" +
    encodeURIComponent(c.chid) + "&s=" + sn + "&e=" + en;
  fetch(q, { cache: "no-store" }).then(function (r) {
    return r.json();
  }).then(function (d) {
    if (!d || !d.ok || !d.url) throw new Error((d && d.msg) || "回看地址不可用");
    playHls(proxyUrl(d.url), c, s, e);
  }).catch(function (err) {
    showErr("回看取址失败：" + (err && err.message ? err.message : err));
    setStatus("");
  });
}

function playHls(url, c, s, e) {
  if (!window.Hls) {
    setStatus("加载回看内核…");
    loadHls().then(function () { playHls(url, c, s, e); })
      .catch(function () {
        showErr("回看内核加载失败：板子本地取不到 hls.js");
        setStatus("");
      });
    return;
  }
  teardown();
  state.mode = "vod";
  state.playing = { name: c.name, grp: c.grp, key: c.key, vod: 1 };
  state.open = c.key;
  state.openGrp = c.grp;
  MR.$("ptitle").textContent = c.name;
  MR.$("pcover").style.display = "none";
  MR.$("toLive").style.display = "";
  setStatus("回看 " + hhmm14(s) + "–" + hhmm14(e));
  clearErr();
  try {
    hls = new Hls({ enableWorker: false, lowLatencyMode: false });
    hls.on(Hls.Events.MANIFEST_PARSED, function () {
      video.play().catch(function () { /* 被拦则等用户点播放 */ });
    });
    hls.on(Hls.Events.ERROR, function (evt, data) {
      if (!data || !data.fatal) return;
      showErr("回看播放出错：" + (data.details || data.type || ""));
      setStatus("播放失败");
    });
    hls.loadSource(url);
    hls.attachMedia(video);
  } catch (err) {
    showErr("创建回看播放器失败：" + (err && err.message ? err.message : err));
  }
  render();
}

function step(dir) {
  var arr = state.visible || [];
  if (!arr.length) return;
  var i = state.idx;
  i = (i < 0) ? 0 : (i + dir + arr.length) % arr.length;
  playChannel(arr[i], i);
}

MR.$("prev").addEventListener("click", function () { step(-1); });
MR.$("next").addEventListener("click", function () { step(1); });
MR.$("stop").addEventListener("click", stop);
MR.$("toLive").addEventListener("click", function () {
  var c = state.playing && state.byKey[state.playing.key];
  if (!c) { stop(); return; }
  playChannel(c, (state.visible || []).indexOf(c));
});

/* ---------------- 频道加载 ---------------- */
MR.api("/api/channels").then(function (r) {
  if (!r || !r.ok) {
    MR.$("list").innerHTML = MR.empty((r && r.msg) || "频道库不可用，检查路由器 /cgi-bin/iptv");
    return;
  }
  state.channels = r.items || [];
  render();
}).catch(function () {
  MR.$("list").innerHTML = MR.empty("取数失败");
});

MR.$("list").addEventListener("click", function (e) {
  var cp = e.target.closest("[data-cp]");
  if (cp) { copyText(cp.dataset.cp, "地址已复制"); return; }

  /* 分组标题：一次只展开一组 */
  var ghd = e.target.closest(".ghd");
  if (ghd) {
    var g = ghd.dataset.grp;
    state.openGrp = (state.openGrp === g) ? "" : g;
    state.open = "";
    render();
    return;
  }

  /* 节目单：切日期、点节目回看。这两类点击要先于「点频道」拦下 */
  var tab = e.target.closest(".epg .tab");
  if (tab) {
    state.epgDay[tab.dataset.tvg] = tab.dataset.day;
    epgPaint(tab.dataset.tvg);
    return;
  }
  var row = e.target.closest(".epg .row");
  if (row) {
    if (row.dataset.live === "1") {
      var cc = state.byKey[row.dataset.key];
      var ci = (state.visible || []).indexOf(cc);
      if (cc && ci >= 0) playChannel(cc, ci);
    } else if (row.dataset.s) {
      playCatchup(row.dataset.key, row.dataset.s, row.dataset.e);
    }
    return;
  }

  if (e.target.closest(".epg")) return;

  var blk = e.target.closest(".cblk");
  if (!blk) return;
  var key = blk.dataset.key;

  var caret = e.target.closest(".caret");
  if (!caret) {
    var idx = -1;
    (state.visible || []).forEach(function (c, i) {
      if ((c.ip + ":" + c.port) === key) idx = i;
    });
    if (idx >= 0) {
      if (state.playing && state.playing.key === key) {
        state.open = (state.open === key) ? "" : key;
        render();
      } else {
        playChannel(state.visible[idx], idx);
      }
      return;
    }
  }

  state.open = (state.open === key) ? "" : key;
  render();
});

MR.$("cpAll").addEventListener("click", function () {
  if (!state.visible || !state.visible.length) { MR.toast("列表为空"); return; }
  copyText(buildM3U(false), "已复制 " + state.visible.length + " 个频道（M3U）");
});
MR.$("cpGrp").addEventListener("click", function () {
  var n = (state.visible || []).filter(function (c) { return c.live !== "0"; }).length;
  if (!n) { MR.toast("没有可用频道"); return; }
  copyText(buildM3U(true), "已复制 " + n + " 个可用频道（M3U）");
});
MR.$("search").addEventListener("input", function (e) {
  state.filter = e.target.value;
  render();
});
</script>
</body>
