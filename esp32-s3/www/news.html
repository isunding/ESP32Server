<!doctype html>
<html lang="zh-CN">
<head>
<script>try{var t=localStorage.getItem("mr.theme");if(t)document.documentElement.setAttribute("data-theme",t)}catch(e){}</script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>新闻 · ESP32 终端服务器</title>
<link rel="icon" href="data:,">
<style>
/* ESP32 终端服务器 · 设计系统
 * 视觉语言照搬原路由器页面：深色底 + 分层卡片 + 细描边 + 等宽数字
 */
:root{
  color-scheme:dark;
  --bg:#0f1216; --bg2:#161b22; --bg3:#1c232c; --line:#283141;
  --fg:#e6edf3; --fg2:#8b98a9; --acc:#ff6a00; --acc2:#3b82f6;
  --ok:#3fb950; --err:#f85149; --warm:#ffb454; --cold:#58a6ff;
  --radius:16px;
}
/* 亮色有两处来源：跟随系统（media），或被顶栏按钮手动锁定为 light。
   两处配色相同，改配色时一起改。手动锁定 dark 时 media 段被 :not 排除，
   回落到上面的 :root 深色值。 */
@media (prefers-color-scheme:light){
  :root:not([data-theme="dark"]){
    color-scheme:light;
    --bg:#f2f5f9; --bg2:#ffffff; --bg3:#e9eef4; --line:#d8dee4;
    --fg:#1f2328; --fg2:#59636e;
  }
}
:root[data-theme="light"]{
  color-scheme:light;
  --bg:#f2f5f9; --bg2:#ffffff; --bg3:#e9eef4; --line:#d8dee4;
  --fg:#1f2328; --fg2:#59636e;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;min-height:100%}
body{
  background:radial-gradient(1200px 600px at 50% -10%, #1b2430 0%, var(--bg) 60%);
  background-attachment:fixed;
  color:var(--fg);
  font:15px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
}
@media (prefers-color-scheme:light){
  :root:not([data-theme="dark"]) body{
    background:radial-gradient(1200px 600px at 50% -10%, #ffffff 0%, var(--bg) 55%);
  }
}
:root[data-theme="light"] body{
  background:radial-gradient(1200px 600px at 50% -10%, #ffffff 0%, var(--bg) 55%);
}
a{color:var(--acc);text-decoration:none}

/* ---------- 顶栏 ---------- */
.top{
  position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px;
  padding:12px 16px;background:color-mix(in srgb, var(--bg) 86%, transparent);
  backdrop-filter:blur(10px);border-bottom:1px solid var(--line);
}
.top .back{
  width:32px;height:32px;flex:0 0 32px;border-radius:9px;border:1px solid var(--line);
  background:var(--bg2);color:var(--fg2);display:flex;align-items:center;justify-content:center;
  font-size:16px;line-height:1;
}
.top .back:hover{color:var(--fg);border-color:var(--acc)}
.top h1{font-size:16px;margin:0;font-weight:600;flex:1;letter-spacing:.3px;
  min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .st{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--fg2);flex:0 0 auto}
.dot{width:7px;height:7px;border-radius:50%;background:var(--fg2);flex:0 0 auto}
.dot.on{background:var(--ok);box-shadow:0 0 8px var(--ok)}
.dot.err{background:var(--err)}
/* 心跳：每 15 秒刷一次 /api/health，点跟着呼吸一下，表示还在轮询 */
.dot.beat{animation:beat 2s ease-in-out infinite}
@keyframes beat{0%,100%{opacity:1}50%{opacity:.3}}
@media (prefers-reduced-motion: reduce){.dot.beat{animation:none}}

/* 板载指示灯心跳开关：波形图标，开时着色呼吸，关时灰暗 */
.hbtn{
  width:22px;height:22px;flex:0 0 auto;display:flex;align-items:center;justify-content:center;
  padding:0;margin-left:2px;border:0;border-radius:6px;background:none;
  color:var(--fg2);opacity:.5;cursor:pointer;transition:color .2s,opacity .2s,background .2s;
  -webkit-tap-highlight-color:transparent;
}
.hbtn:hover{opacity:1;background:var(--bg2)}
.hbtn:focus-visible{outline:1px solid var(--acc);outline-offset:1px}
.hbtn svg{display:block}
.hbtn.on{color:var(--ok);opacity:1;filter:drop-shadow(0 0 3px var(--ok))}
.hbtn.on svg{animation:beat 2s ease-in-out infinite}
@media (prefers-reduced-motion: reduce){.hbtn.on svg{animation:none}}

/* ---------- 页签 ---------- */
.nav{
  display:flex;gap:6px;overflow-x:auto;padding:10px 16px;
  border-bottom:1px solid var(--line);background:color-mix(in srgb, var(--bg) 86%, transparent);
  backdrop-filter:blur(10px);position:sticky;top:57px;z-index:19;
}
.nav a{
  flex:0 0 auto;font-size:13px;color:var(--fg2);border:1px solid var(--line);
  background:var(--bg2);border-radius:999px;padding:5px 13px;white-space:nowrap;
}
.nav a.on{background:var(--acc);border-color:var(--acc);color:#fff}
.nav a:hover{color:var(--fg)}

/* ---------- 容器 ---------- */
.wrap{max-width:760px;margin:0 auto;padding:16px 14px 40px}
.card{
  background:var(--bg2);border:1px solid var(--line);border-radius:var(--radius);
  padding:16px 18px;margin-bottom:12px;
}
.card>h2{margin:0 0 12px;font-size:13px;font-weight:600;color:var(--fg2);letter-spacing:.5px}
.card.flush{padding:6px 18px}
.muted{color:var(--fg2)}
.small{font-size:12px}
.right{margin-left:auto}
.btn{
  background:var(--bg3);border:1px solid var(--line);color:var(--fg);
  border-radius:9px;padding:7px 13px;font:inherit;font-size:13px;cursor:pointer;
}
.btn:hover{border-color:var(--acc);color:var(--acc)}
.btn.primary{background:var(--acc);border-color:var(--acc);color:#fff}
.btn.primary:hover{color:#fff;filter:brightness(1.08)}
.btn.mini{padding:4px 10px;font-size:12px;border-radius:7px;text-decoration:none}
.card>h2.hd{display:flex;align-items:center;gap:8px}
.card>h2.hd .sp{flex:1}

/* ---------- 页内工具条（更新时间 + 刷新按钮） ---------- */
/* 原先只写在 weather.html 的内联样式里，行情页用了同一个 class
   却拿不到样式，按钮就跑到左边去了。 */
.pgtop{display:flex;align-items:center;gap:10px;margin:0 0 10px}
.pgtop .upd{margin-left:auto;font-size:11.5px;color:var(--fg2);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pgtop .btn{flex:0 0 auto;display:inline-flex;align-items:center;gap:6px}
.pgtop .btn .ic{display:inline-block;font-size:14px;line-height:1}

/* ---------- 门户 ---------- */
.hero{text-align:center;margin:10px 0 26px}
.hero h1{margin:0 0 6px;font-size:24px;font-weight:600;letter-spacing:.5px}
.hero .sub{color:var(--fg2);font-size:13.5px}
.hero .badge{
  display:inline-flex;align-items:center;gap:7px;margin-top:12px;
  background:var(--bg3);border:1px solid var(--line);border-radius:999px;
  padding:5px 14px;font-size:12.5px;color:var(--fg2);
}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.tile{
  display:flex;align-items:center;gap:14px;color:inherit;
  background:linear-gradient(160deg,var(--bg2),var(--bg3));
  border:1px solid var(--line);border-radius:var(--radius);
  padding:18px;transition:.15s;position:relative;overflow:hidden;
}
.tile:hover{border-color:var(--acc);transform:translateY(-2px);box-shadow:0 10px 26px rgba(0,0,0,.45)}
.tile:active{transform:translateY(0)}
.tile .ico{
  width:46px;height:46px;flex:0 0 46px;border-radius:12px;display:flex;
  align-items:center;justify-content:center;background:var(--bg);border:1px solid var(--line);
}
.tile .ico svg{width:22px;height:22px;stroke:var(--acc);fill:none;stroke-width:1.7;
  stroke-linecap:round;stroke-linejoin:round}
.tile b{display:block;font-size:15.5px;font-weight:600;margin-bottom:2px}
.tile span{display:block;color:var(--fg2);font-size:12.5px;white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis}
.tile .go{position:absolute;right:14px;color:var(--fg2);font-size:18px;opacity:.5}
.tile:hover .go{color:var(--acc);opacity:1}

/* ---------- 服务状态小格 ---------- */
.sts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
@media (min-width:560px){.sts{grid-template-columns:repeat(4,minmax(0,1fr))}}
.st1{display:grid;grid-template-columns:auto minmax(0,1fr);column-gap:7px;row-gap:1px;
  align-items:center;background:var(--bg3);border:1px solid var(--line);
  border-radius:10px;padding:9px 11px;font-size:12.5px}
.st1 .dot{grid-column:1;grid-row:1;width:8px;height:8px}
.st1 b{grid-column:2;grid-row:1;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.st1 small{grid-column:2;grid-row:2;font-size:11.5px;color:var(--fg2);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* ---------- 天气 ---------- */
.now{text-align:center;padding:8px 0 4px}
.now .loc{color:var(--fg2);font-size:14px;margin-bottom:4px}
.now .big{display:flex;align-items:flex-end;justify-content:center;gap:14px;margin:6px 0}
.now .temp{font:600 72px/1 ui-monospace,Menlo,Consolas,monospace;letter-spacing:-2px}
.now .temp .deg{font-size:.38em;font-style:normal;vertical-align:.72em;
  margin-left:2px;letter-spacing:0;color:var(--fg2)}
.now .txt{font-size:17px;color:var(--fg2);padding-bottom:9px}
.now .feels{color:var(--fg2);font-size:13.5px;margin-top:2px}
.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:16px}
.metric{background:var(--bg3);border-radius:11px;padding:9px 4px;text-align:center}
.metric .k{font-size:11px;color:var(--fg2)}
.metric .v{font-size:15px;font-weight:600;margin-top:2px}

.aq{display:flex;align-items:center;gap:14px}
.aq .tile-aqi{
  min-width:64px;height:64px;border-radius:16px;display:flex;flex-direction:column;
  align-items:center;justify-content:center;color:#fff;font-weight:700;line-height:1;
  flex:0 0 64px;
}
.aq .tile-aqi b{font-size:24px;letter-spacing:-.5px}
.aq .tile-aqi small{font-size:10px;font-weight:500;opacity:.92;margin-top:3px;letter-spacing:1px}
.aq .info{flex:1;min-width:0}
.aq .cat{font-size:15px;font-weight:600;margin-bottom:3px}
.aq .adv{font-size:12px;color:var(--fg2);line-height:1.55}
.poll{display:grid;grid-template-columns:repeat(auto-fit,minmax(78px,1fr));gap:7px;margin-top:12px}
.poll .p{background:var(--bg3);border-radius:9px;padding:8px 6px;text-align:center}
.poll .p .n{font-size:10.5px;color:var(--fg2)}
.poll .p .v{font-size:14.5px;font-weight:600;margin:2px 0 1px}
.poll .p .u{font-size:9.5px;color:var(--fg2)}

.warn-bar{display:flex;align-items:center;gap:9px;font-size:13px;color:var(--fg2)}
.warn-bar .ok-dot{width:9px;height:9px;border-radius:50%;background:var(--ok);
  box-shadow:0 0 0 3px rgba(63,185,80,.16);flex:0 0 9px}
.warn-item{background:var(--bg3);border-left:3px solid var(--err);border-radius:9px;
  padding:10px 12px;margin-bottom:9px}
.warn-item:last-child{margin-bottom:0}
.warn-item .hd{display:flex;align-items:center;gap:8px;margin-bottom:5px;flex-wrap:wrap}
.warn-item .lv{font-size:11px;font-weight:600;padding:1px 7px;border-radius:5px;color:#fff}
.warn-item .ti{font-size:13.5px;font-weight:600}
.warn-item .bd{font-size:12.5px;line-height:1.6;color:var(--fg)}
.warn-item .mt{font-size:11px;color:var(--fg2);margin-top:6px}

.hours{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px}
.hour{flex:0 0 auto;width:58px;text-align:center;background:var(--bg3);
  border-radius:11px;padding:9px 4px}
.hour .h{font-size:11.5px;color:var(--fg2)}
.hour .t{font-size:14px;font-weight:600;margin-top:4px}
.hour .s{font-size:10.5px;color:var(--fg2);margin-top:2px;white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis}

.day{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}
.day:last-child{border-bottom:0}
.day .d{width:56px;font-size:13.5px}
.day .s{flex:1;font-size:13px;color:var(--fg2);min-width:0;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap}
.day .r{font-size:13.5px;font-variant-numeric:tabular-nums;white-space:nowrap}
.day .r b{color:var(--warm);font-weight:600}
.day .r i{color:var(--cold);font-style:normal}

.idx{display:grid;grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:8px}
.idx .it{background:var(--bg3);border-radius:10px;padding:9px 11px;font-size:12px}
.idx .it b{display:block;font-size:13px;margin-bottom:2px}
.idx .it span{color:var(--fg2)}

/* ---------- 状态 ---------- */
.meters{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.meter .k{font-size:11px;color:var(--fg2)}
.meter .v{font-size:19px;font-weight:600;font-variant-numeric:tabular-nums}
.bar{height:5px;background:var(--line);border-radius:3px;margin-top:6px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--acc2);border-radius:3px;transition:width .35s}
.bar i.warn{background:var(--warm)}
.bar i.crit{background:var(--err)}

table.kv{width:100%;border-collapse:collapse;font-size:13px}
table.kv td{padding:8px 0;border-bottom:1px solid var(--line);vertical-align:top}
table.kv td:first-child{color:var(--fg2);width:42%}
table.kv tr:last-child td{border-bottom:0}
table.kv .mono{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12.5px}

/* ---------- 流量 ---------- */
.dev{display:flex;align-items:center;justify-content:space-between;
  padding:10px 0;border-bottom:1px solid var(--line)}
.dev:last-child{border-bottom:0}
.dev .nm{font-size:13.5px;font-weight:500}
.dev .ip{color:var(--fg2);font-size:11.5px}
.dev .vals{text-align:right;white-space:nowrap;
  font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12.5px}
.dev .dn{color:var(--ok)}
.dev .up{color:var(--cold)}
.rank{display:inline-block;width:20px;color:var(--fg2);font-size:12px}

/* ---------- IPTV ---------- */
.player{position:relative;background:#0b0e12;border-radius:12px;overflow:hidden;
  aspect-ratio:16/9;border:1px solid var(--line)}
video{width:100%;height:100%;display:block;background:#0b0e12}
.ptip{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  color:#8b98a9;font-size:13px;text-align:center;padding:0 24px;pointer-events:none}
.ph{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.ph b{font-size:14px}
.search{background:var(--bg3);border:1px solid var(--line);color:var(--fg);
  border-radius:9px;padding:7px 11px;font:inherit;font-size:13px;width:46%}
.search:focus{outline:none;border-color:var(--acc)}
.grp{margin-top:14px}
.grp h3{margin:0 0 4px;font-size:12px;color:var(--fg2);font-weight:600;letter-spacing:.5px}
.ch{display:flex;align-items:center;justify-content:space-between;gap:10px;
  padding:10px 10px;border-radius:9px;font-size:14px;cursor:pointer}
.ch:hover{background:var(--bg3)}
.ch.playing{background:var(--bg3);box-shadow:inset 2px 0 0 var(--acc)}
.ch .tag{font-size:11px;color:var(--fg2);white-space:nowrap}
.ch .tag.live{color:var(--ok)}
.ch .tag.live::before{content:"● ";font-size:9px;vertical-align:1px}
.ch .tag.dead{color:var(--fg2)}

/* ---------- 提示 ---------- */
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(14px);
  background:#1f2937;border:1px solid var(--line);color:#e6edf3;padding:9px 18px;
  border-radius:9px;font-size:13px;opacity:0;transition:.25s;pointer-events:none;z-index:60}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.foot{color:var(--fg2);font-size:12px;text-align:center;margin:18px 0 0;line-height:1.9}
.foot code{background:var(--bg3);border:1px solid var(--line);border-radius:5px;padding:1px 6px;font-size:11.5px}
.foot a{color:var(--fg2);text-decoration:none;border-bottom:1px dashed var(--line)}
.foot a:hover{color:var(--acc);border-bottom-color:var(--acc)}

@media (max-width:520px){
  .wrap{padding:12px 12px 32px}
  .nav{gap:4px;padding:9px 10px}
  .nav a{padding:4px 9px;font-size:12px}
  .now .temp{font-size:58px}
  .meters{grid-template-columns:1fr 1fr;gap:10px}
  .grid{grid-template-columns:1fr}
}

/* ---------- 信息流模块（新闻；视觉与首页 .tile 一致） ---------- */
.feed{display:grid;gap:12px}
.feed>.empty{grid-column:1/-1}
.frow{min-width:0}
.frow .fh{display:flex;align-items:center;gap:8px;flex-wrap:wrap;row-gap:4px;
  margin-bottom:6px;font-size:12.5px;color:var(--fg);
  font-variant-numeric:tabular-nums}
.frow .fh .ft{font-weight:600}
.frow .fh .ftag,.frow .fh .fbtn{flex:0 0 auto}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.chips button{font-size:12px;padding:4px 10px;border-radius:999px;cursor:pointer;
  border:1px solid var(--line);background:var(--bg3);color:var(--fg2);font-family:inherit}
.chips button.on{border-color:var(--acc);color:var(--acc);background:rgba(255,106,0,.12)}
.chips .lbl{font-size:11.5px;color:var(--fg2);align-self:center;margin-right:2px}
.empty{padding:20px 0;text-align:center}
.fitem{min-width:0;background:linear-gradient(160deg,var(--bg2),var(--bg3));
  border:1px solid var(--line);border-radius:var(--radius);padding:12px 14px}
.fitem .fb{font-size:13.5px;line-height:1.6;white-space:pre-wrap;word-break:break-word}
.fitem .fb b{font-weight:600;color:var(--fg)}
.flv{font-size:10.5px;border-radius:5px;padding:1px 6px;flex:0 0 auto}
.flv.A{background:rgba(230,60,60,.16);color:#e23c3c}
.flv.B{background:rgba(240,160,40,.16);color:#d98a1a}
.flv.C{background:var(--bg3);color:var(--fg2)}
.ftag{font-size:11px;color:var(--fg2);border:1px solid var(--line);
  border-radius:999px;padding:1px 7px}
.fbtn{font-size:11px;border:1px solid var(--line);border-radius:999px;
  padding:1px 7px;cursor:pointer;background:var(--bg2);color:var(--fg2);font-family:inherit}
.fbtn.added{border-color:var(--ok);color:var(--ok)}

</style>
<style>
.morewrap{text-align:center;padding:16px 0 6px}
.morewrap .btn{padding:9px 24px}
/* 回到顶部：滚过一屏后出现在右下角，避开 iOS 底部安全区 */
.totop{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom));
  width:42px;height:42px;padding:0;border-radius:50%;display:flex;
  align-items:center;justify-content:center;background:var(--bg2);
  border:1px solid var(--line);color:var(--fg2);cursor:pointer;
  box-shadow:0 4px 14px rgba(0,0,0,.18);z-index:40;
  opacity:0;transform:translateY(10px);pointer-events:none;
  transition:opacity .2s,transform .2s,color .2s,border-color .2s}
.totop.show{opacity:1;transform:none;pointer-events:auto}
.totop:hover{color:var(--acc);border-color:var(--acc)}
@media (prefers-reduced-motion: reduce){.totop{transition:none}}
</style>
</head>
<body>

<div id="topbar"></div>

<div class="wrap">
  <div class="pgtop">
    <span class="upd" id="updAt">加载中…</span>
    <button class="btn" id="btnRefresh"><span class="ic">↻</span>刷新</button>
  </div>

  <div class="chips" id="lvChips">
    <span class="lbl">等级</span>
    <button data-lv="" class="on">全部</button>
    <button data-lv="A">重要 A</button>
    <button data-lv="B">一般 B</button>
    <button data-lv="C">普通 C</button>
  </div>
  <div class="chips" id="subChips"><span class="lbl">主题</span></div>

  <div id="list" class="feed"><div class="skel"></div><div class="skel"></div><div class="skel"></div></div>

  <div class="morewrap" id="moreWrap" style="display:none"><span class="muted small" id="moreTip">继续上滑加载更早的</span></div>

  <p class="foot">
    数据经路由器转发的新闻电报，本地按天存 CSV、只留 7 天。
    首屏只取最近 30 条，上滑到底自动加载更早的一段；下拉刷新只重读板上缓存，不触发上游取数。
    点股票标签加入自选，再点一次移除（行情页可见）。
  </p>
</div>

<!-- 按钮必须写在脚本之前：脚本在解析时立即取 #toTop，写在后面会取到 null -->
<button class="totop" id="toTop" type="button" aria-label="回到顶部" title="回到顶部">
  <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor"
       stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
    <path d="M12 19V5"/><path d="M5 12l7-7 7 7"/>
  </svg>
</button>

<script>
/* ESP32 终端服务器 · 公共前端
 * 各页面共用：取数、格式化、顶栏与页签、提示条
 */
"use strict";

var MR = (function () {

  var PAGES = [
    { href: "/", title: "首页" },
    { href: "/weather.html", title: "天气" },
    { href: "/quake.html", title: "地震" },
    { href: "/news.html", title: "新闻" },
    { href: "/market.html", title: "行情" },
    { href: "/iptv.html", title: "直播" },
    { href: "/radio.html", title: "电台" },
    { href: "/info.html", title: "本机" },
    { href: "/ntp.html", title: "校时" }
  ];

  function $(id) { return document.getElementById(id); }

  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }

  function api(path) {
    return fetch(path, { cache: "no-store" }).then(function (r) {
      if (!r.ok) throw new Error("HTTP " + r.status);
      return r.json();
    });
  }

  /* 写接口：统一按 {"ok":0,"msg":...} 判失败，异常信息直接给用户看 */
  function post(path, body) {
    return fetch(path, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(body || {})
    }).then(function (r) {
      return r.json().catch(function () { return {}; }).then(function (d) {
        if (!r.ok || !d.ok) throw new Error(d.msg || ("HTTP " + r.status));
        return d;
      });
    });
  }

  function fmtBytes(n) {
    n = Number(n) || 0;
    if (n < 1024) return n + " B";
    if (n < 1048576) return (n / 1024).toFixed(1) + " KB";
    if (n < 1073741824) return (n / 1048576).toFixed(1) + " MB";
    return (n / 1073741824).toFixed(2) + " GB";
  }

  function fmtDur(sec) {
    sec = Number(sec) || 0;
    var d = Math.floor(sec / 86400), h = Math.floor(sec % 86400 / 3600), m = Math.floor(sec % 3600 / 60);
    if (d) return d + " 天 " + h + " 小时";
    if (h) return h + " 小时 " + m + " 分";
    if (sec < 60) return Math.round(sec) + " 秒";
    return m + " 分钟";
  }

  function pad(n) { return n < 10 ? "0" + n : "" + n; }
  function hhmm(d) { return pad(d.getHours()) + ":" + pad(d.getMinutes()); }
  function mmdd(s) { return s ? s.substr(5, 5) : "--"; }

  function currentPage() {
    var p = location.pathname;
    if (p === "" || p === "/" || p === "/index.html") return "/";
    return p.replace(/^\/+/, "/");
  }

  /* 板载指示灯心跳开关。图标画在 IP 右侧，点一下切一次，状态存板上配置。
     显示与否取决于 /api/health 的 led_hw：没有可控指示灯的设备不出现按钮。 */
  var LED_SVG = '<svg viewBox="0 0 24 24" width="14" height="14" fill="none" ' +
    'stroke="currentColor" stroke-width="2" stroke-linecap="round" ' +
    'stroke-linejoin="round" aria-hidden="true"><path d="M2 12h4l2.5-7 5 14 2.5-7h8"/></svg>';

  function setLedBtn(on, hw) {
    var b = $("hLed");
    if (!b) return;
    b.style.display = hw ? "" : "none";
    b.className = "hbtn" + (on ? " on" : "");
    b.setAttribute("data-on", on ? "1" : "0");
    b.setAttribute("aria-pressed", on ? "true" : "false");
    b.title = on ? "板载心跳：开（点击关闭）" : "板载心跳：关（点击开启）";
  }

  function toggleLed() {
    var b = $("hLed");
    if (!b || b.getAttribute("data-busy") === "1") return;
    var want = b.getAttribute("data-on") === "1" ? 0 : 1;
    b.setAttribute("data-busy", "1");
    post("/api/led", { on: want }).then(function (r) {
      b.removeAttribute("data-busy");
      setLedBtn(r.on ? 1 : 0, 1);
      toast(r.on ? "板载心跳已开启" : "板载心跳已关闭", 1600);
    }).catch(function (e) {
      b.removeAttribute("data-busy");
      toast(e && e.message ? e.message : "切换失败");
    });
  }

  /* 深浅色切换。空值表示跟随系统，选中后写入 localStorage 锁定。
     图标画的是“点一下会切到的模式”：现在亮色给月亮，现在暗色给太阳。 */
  var THEME_KEY = "mr.theme";
  var SUN_SVG = '<svg viewBox="0 0 24 24" width="14" height="14" fill="none" ' +
    'stroke="currentColor" stroke-width="2" stroke-linecap="round" ' +
    'stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/>' +
    '<path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2"/>' +
    '<path d="M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>';
  var MOON_SVG = '<svg viewBox="0 0 24 24" width="14" height="14" fill="none" ' +
    'stroke="currentColor" stroke-width="2" stroke-linecap="round" ' +
    'stroke-linejoin="round" aria-hidden="true">' +
    '<path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>';

  function themePref() {
    try { return localStorage.getItem(THEME_KEY) || ""; } catch (e) { return ""; }
  }

  /* 判定顺序：DOM 上的 data-theme（构建时注入的引导脚本已按 localStorage 打过）
     → localStorage → 系统配色。少了第一项，手动锁定后图标会画错方向。 */
  function themeNow() {
    var d = document.documentElement.getAttribute("data-theme");
    if (d === "light" || d === "dark") return d;
    var t = themePref();
    if (t === "light" || t === "dark") return t;
    return (window.matchMedia &&
      window.matchMedia("(prefers-color-scheme: light)").matches) ? "light" : "dark";
  }

  function paintThemeBtn() {
    var b = $("hTheme");
    if (!b) return;
    var light = themeNow() === "light";
    b.innerHTML = light ? MOON_SVG : SUN_SVG;
    b.title = light ? "切换到深色" : "切换到浅色";
    b.setAttribute("aria-label", b.title);
  }

  function toggleTheme() {
    var next = themeNow() === "light" ? "dark" : "light";
    document.documentElement.setAttribute("data-theme", next);
    try { localStorage.setItem(THEME_KEY, next); } catch (e) {}
    paintThemeBtn();
  }

  /* 跟随系统时，系统配色变了要把图标跟着换掉 */
  if (window.matchMedia) {
    var mq = window.matchMedia("(prefers-color-scheme: light)");
    var onScheme = function () { if (!themePref()) paintThemeBtn(); };
    if (mq.addEventListener) mq.addEventListener("change", onScheme);
    else if (mq.addListener) mq.addListener(onScheme);
  }

  /* 顶栏 + 页签。title 为空时不显示返回键。
     挂载完就自动开始心跳：以前要求每页自己调 healthTick()，漏掉一页
     右上角就永远停在初始文案「连接中…」。 */
  function mountTop(title) {
    var cur = currentPage();
    var nav = PAGES.map(function (p) {
      var on = p.href === cur ? " on" : "";
      return '<a class="' + on.trim() + '" href="' + p.href + '">' + p.title + "</a>";
    }).join("");

    var back = cur === "/" ? "" :
      '<a class="back" href="/" title="返回首页">‹</a>';

    var html =
      '<div class="top">' + back +
      "<h1>" + esc(title) + "</h1>" +
      '<div class="st"><span class="dot" id="hDot"></span><span id="hIp">连接中…</span>' +
      '<button class="hbtn" id="hLed" type="button" data-on="0" ' +
      'aria-pressed="false" title="板载心跳">' + LED_SVG + "</button>" +
      '<button class="hbtn" id="hTheme" type="button" title="切换深浅色"></button></div>' +
      "</div>" +
      '<div class="nav">' + nav + "</div>";

    var host = document.getElementById("topbar");
    if (host) {
      host.innerHTML = html;
      var lb = $("hLed");
      if (lb) lb.onclick = toggleLed;
      var tb = $("hTheme");
      if (tb) tb.onclick = toggleTheme;
      paintThemeBtn();
      startBeat();
    }
  }

  var tickBusy = null, tickAt = 0, tickTimer = 0;

  /* 心跳：取一次 /api/health，把 IP 与状态点刷到顶栏。
     重复调用复用同一次请求，多页共用一个 15 秒定时器。 */
  function healthTick() {
    /* 页面在后台就不再问：这个请求每 15 秒一次，比空闲降频阈值（20 秒）还密，
       会让设备一直停在满频，休眠记录永远产生不了。回到前台时补一次。 */
    if (document.hidden) return Promise.resolve(MR.device);
    if (tickBusy) return tickBusy;
    if (MR.device && Date.now() - tickAt < 800) return Promise.resolve(MR.device);
    tickBusy = api("/api/health").then(function (h) {
      var dot = $("hDot"), ip = $("hIp");
      if (dot) dot.className = "dot beat " + (h.router_ok ? "on" : "err");
      if (ip) {
        ip.textContent = h.ip;
        ip.title = (h.router_ok ? "路由器可达" : "路由器不可达") + " · RSSI " + h.rssi +
          " · 运行 " + fmtDur(h.up) + " · 空闲内存 " + fmtBytes(h.mem_free);
      }
      setLedBtn(h.led_on ? 1 : 0, h.led_hw ? 1 : 0);
      MR.device = h;
      return h;
    }).catch(function () {
      var dot = $("hDot"), ip = $("hIp");
      if (dot) dot.className = "dot beat err";
      // 掉了也别把 IP 抹成占位文案，留着最后已知的地址更有用
      if (ip) {
        ip.textContent = MR.device ? MR.device.ip : "离线";
        ip.title = "设备无响应";
      }
      return null;
    }).then(function (r) {
      tickBusy = null;
      tickAt = Date.now();
      return r;
    });
    return tickBusy;
  }

  function startBeat() {
    if (tickTimer) return;
    document.addEventListener("visibilitychange", function () {
      if (!document.hidden) healthTick();   // 切回前台立即补一次，别等下一个 15 秒
    });
    healthTick();
    tickTimer = setInterval(healthTick, 15000);
  }

  var toastTimer = 0;
  function toast(msg, ms) {
    var el = document.getElementById("toast");
    if (!el) {
      el = document.createElement("div");
      el.id = "toast";
      el.className = "toast";
      document.body.appendChild(el);
    }
    el.textContent = msg;
    el.className = "toast on";
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { el.className = "toast"; }, ms || 2600);
  }

  function empty(msg) { return '<span class="muted small">' + esc(msg) + "</span>"; }

  return {
    $: $, esc: esc, api: api, post: post, fmtBytes: fmtBytes, fmtDur: fmtDur,
    hhmm: hhmm, mmdd: mmdd, mountTop: mountTop, healthTick: healthTick,
    startBeat: startBeat,
    toast: toast, empty: empty, PAGES: PAGES, device: null
  };
})();

</script>
<script>
"use strict";
MR.mountTop("新闻");

var $ = MR.$, esc = MR.esc;
var ALL = [];            // [{key,ctime,lv,subj,stk,title,text,subjects[]}]
var LV = "", SUB = "";
var WATCH = {};          // 已在自选的代码：{ "sh600519": true }

/* 先转义再插标签：电报正文习惯用【小标题】开头，把括号内的字加粗。
   只认成对的全角括号，跨不过「】」就不会误吞后面的正文。 */
function boldBracket(s) {
  return esc(String(s || "")).replace(/【([^】]*)】/g, "【<b>$1</b>】");
}

/* CSV 行拆字段：字段可能用双引号包裹，里面的逗号不算分隔符 */
function csvLine(s) {
  var out = [], cur = "", q = false, i, c;
  for (i = 0; i < s.length; i++) {
    c = s.charAt(i);
    if (q) {
      if (c === '"') {
        if (s.charAt(i + 1) === '"') { cur += '"'; i++; }
        else q = false;
      } else cur += c;
    } else if (c === '"') {
      q = true;
    } else if (c === ",") {
      out.push(cur); cur = "";
    } else cur += c;
  }
  out.push(cur);
  return out;
}

function pad2(n) { return n < 10 ? "0" + n : "" + n; }
function hhmm(ts) {
  var d = new Date(ts * 1000);
  return pad2(d.getMonth() + 1) + "-" + pad2(d.getDate()) + " " +
    pad2(d.getHours()) + ":" + pad2(d.getMinutes());
}

/* 猜交易所前缀：6→sh，0/3→sz，4/8→bj */
function mkt(code) {
  var c = String(code || "");
  if (/^6/.test(c)) return "sh" + c;
  if (/^[03]/.test(c)) return "sz" + c;
  if (/^[48]/.test(c)) return "bj" + c;
  return c;
}

function render() {
  var items = ALL.filter(function (x) {
    if (LV && x.lv !== LV) return false;
    if (SUB && x.subjects.indexOf(SUB) < 0) return false;
    return true;
  });
  if (!items.length) {
    $("list").innerHTML = '<div class="empty muted small">' +
      (ALL.length ? "没有符合筛选条件的电报" : "暂无数据，稍后自动刷新") + "</div>";
    return;
  }
  $("list").innerHTML = items.map(function (x) {
    var stk = "";
    if (x.stk) {
      stk = x.stk.split(" ").filter(Boolean).map(function (s) {
        /* 上游把交易所前缀和名称连写（sz300708聚灿光电），显示与入库都要去掉前缀 */
        var raw = s.replace(/[^0-9]/g, "");
        var name = s.replace(/[0-9]/g, "").replace(/^(sh|sz|bj)/i, "");
        var code = mkt(raw), added = !!WATCH[code];
        return '<button class="fbtn' + (added ? " added" : "") +
          '" data-code="' + esc(code) + '" data-name="' + esc(name || raw) +
          '" title="' +
          (added ? "已在自选，点击移除" : "点击加入自选") + '">' +
          esc(name || raw) + " " + esc(raw) + "</button>";
      }).join("");
    }
    /* 主题标签与股票按钮都跟在时间、重要性后面，同一行排布。
       有股票按钮时标签只放 2 个，否则放 3 个，多出来的收成 +N，
       尽量让这一行不折行；真的放不下才换行，不会溢出。 */
    var subs = x.subjects || [], cap = stk ? 2 : 3;
    var tags = subs.slice(0, cap).map(function (s) {
      return '<span class="ftag">' + esc(s) + "</span>";
    }).join("");
    if (subs.length > cap) {
      tags += '<span class="ftag" title="' + esc(subs.join(" ")) + '">+' +
        (subs.length - cap) + "</span>";
    }
    return '<div class="frow" data-k="' + esc(x.key) + '">' +
      '<div class="fh"><span class="ft">' + hhmm(x.ctime) + "</span>" +
      '<span class="flv ' + esc(x.lv || "C") + '">' + esc(x.lv || "C") + "</span>" +
      tags + stk + "</div>" +
      '<div class="fitem"><div class="fb">' +
      boldBracket(x.text || x.title || "") + "</div></div></div>";
  }).join("");
}

function subChips() {
  var cnt = {}, i;
  for (i = 0; i < ALL.length; i++) {
    ALL[i].subjects.forEach(function (s) { cnt[s] = (cnt[s] || 0) + 1; });
  }
  var names = Object.keys(cnt).sort(function (a, b) { return cnt[b] - cnt[a]; }).slice(0, 6);
  $("subChips").innerHTML = '<span class="lbl">主题</span><button data-sub="" class="on">不限</button>' +
    names.map(function (s) {
      return '<button data-sub="' + esc(s) + '">' + esc(s) + "</button>";
    }).join("");
}

var LIMIT = 30, MORE = 0, BUSY = false;

function pageUrl(before, force) {
  var p = ["limit=" + LIMIT];
  if (before) p.push("before=" + before);
  if (force) p.push("force=1");        // 只有点「刷新」才真的去上游取数
  return "/api/news?" + p.join("&");
}

function parseRows(rows) {
  return (rows || []).map(function (line) {
    var f = csvLine(line);
    return {
      key: f[0], ctime: Number(f[1]) || 0, lv: f[2] || "C",
      subjects: String(f[3] || "").split(" ").filter(Boolean),
      stk: f[4] || "", title: f[5] || "", text: f[6] || f[5] || ""
    };
  });
}

function paint() {
  $("moreWrap").style.display = (MORE || BUSY) ? "" : "none";
  $("moreTip").textContent = BUSY ? "加载中…" : "继续上滑加载更早的";
  $("updAt").textContent = (ALL.length ? "最新 " + hhmm(ALL[0].ctime) : "—") +
    " · 已载 " + ALL.length + " 条";
}

/* 首屏 / 整页重载。force 为假时只读板上 CSV，不打扰上游 */
function load(force) {
  var b = $("btnRefresh");
  if (BUSY) return Promise.resolve();
  BUSY = true;
  b.disabled = true;
  return MR.api(pageUrl(0, force)).then(function (d) {
    if (!d.ok) {
      $("updAt").textContent = d.msg || "准备中…";
      setTimeout(function () { load(false); }, 4000);
      return;
    }
    ALL = parseRows(d.rows).sort(function (a, b) { return b.ctime - a.ctime; });
    MORE = d.more ? 1 : 0;
    subChips();
    render();
    paint();
    loadWatch();                 // 标出哪些股票已在自选
    setTimeout(maybeMore, 120);  // 首屏没铺满就自动补一段
  }).catch(function () {
    $("updAt").textContent = "读取失败";
    $("list").innerHTML = '<div class="empty muted small">接口无响应，点刷新重试</div>';
  }).then(function () {
    BUSY = false;
    b.disabled = false;
  });
}

/* 追加一页更早的，游标取当前最老一条的时间；到底自动触发，不用点按钮 */
function loadMore() {
  if (BUSY || !MORE || !ALL.length) return Promise.resolve();
  BUSY = true;
  paint();
  var before = ALL[ALL.length - 1].ctime;
  var beforeLen = ALL.length;
  return MR.api(pageUrl(before, false)).then(function (d) {
    if (d.ok) {
      var have = {};
      ALL.forEach(function (x) { have[x.key] = 1; });
      parseRows(d.rows).forEach(function (x) {
        if (!have[x.key]) { have[x.key] = 1; ALL.push(x); }
      });
      ALL.sort(function (a, b) { return b.ctime - a.ctime; });
      MORE = d.more ? 1 : 0;
      /* 一页全是重复行说明上游没有更早的了，停住，避免空转 */
      if (ALL.length === beforeLen) MORE = 0;
      subChips();
      render();
      loadWatch();
    }
  }).catch(function () {
    MR.toast("加载失败，请重试");
    MORE = 0;
  }).then(function () {
    BUSY = false;
    paint();
    setTimeout(maybeMore, 80);    // 视口没填满就接着取，直到填满或到底
  });
}

/* 距底部不足 240px 就加载下一段 */
function maybeMore() {
  if (!MORE || BUSY) return;
  var vh = window.innerHeight || 0;
  var y = window.scrollY || 0;
  var h = (document.body && document.body.scrollHeight) || 0;
  if (!vh || y + vh >= h - 240) loadMore();
}

/* 交互：等级 / 主题 / 展开 / 加自选 */
$("lvChips").addEventListener("click", function (e) {
  var t = e.target;
  if (t.tagName !== "BUTTON") return;
  LV = t.getAttribute("data-lv") || "";
  [].forEach.call(this.querySelectorAll("button"), function (b) { b.className = ""; });
  t.className = "on";
  render();
});

$("subChips").addEventListener("click", function (e) {
  var t = e.target;
  if (t.tagName !== "BUTTON") return;
  SUB = t.getAttribute("data-sub") || "";
  [].forEach.call(this.querySelectorAll("button"), function (b) { b.className = ""; });
  t.className = "on";
  render();
});

/* 同一支股票可能出现在多条电报里，状态要一起改 */
function syncBtn(b, added) {
  b.className = added ? "fbtn added" : "fbtn";
  b.title = added ? "已在自选，点击移除" : "点击加入自选";
}
function markStock(code, added) {
  [].forEach.call(document.querySelectorAll(".fbtn"), function (b) {
    if (b.getAttribute("data-code") === code) syncBtn(b, added);
  });
}

/* 只查代码清单，不触发行情请求。行情页那边增删后，新闻页刷新也能跟上 */
function loadWatch() {
  return MR.api("/api/watch?a=codes").then(function (d) {
    WATCH = {};
    var codes = d.codes || [];
    for (var i = 0; i < codes.length; i++) WATCH[codes[i]] = 1;
    [].forEach.call(document.querySelectorAll(".fbtn"), function (b) {
      syncBtn(b, !!WATCH[b.getAttribute("data-code")]);
    });
  }).catch(function () { /* 标注拿不到也不影响看新闻 */ });
}

$("list").addEventListener("click", function (e) {
  var btn = e.target.closest ? e.target.closest(".fbtn") : null;
  if (btn) {
    e.stopPropagation();
    var code = btn.getAttribute("data-code");
    var added = !!WATCH[code];       // 已在自选 → 这次是删除
    btn.disabled = true;
    fetch("/api/watch", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ op: added ? "del" : "add", code: code,
                             name: btn.getAttribute("data-name") || "" })
    }).then(function (r) { return r.json(); }).then(function (r) {
      btn.disabled = false;
      if (!r.ok) { MR.toast(r.msg || "操作失败"); return; }
      if (r.codes) {                 // 以固件返回的完整清单为准
        WATCH = {};
        for (var i = 0; i < r.codes.length; i++) WATCH[r.codes[i]] = 1;
      } else if (added) delete WATCH[code];
      else WATCH[code] = 1;
      markStock(code, !added);
      MR.toast(added ? "已从自选移除 " + code : "已加入自选 " + code);
    }).catch(function () {
      btn.disabled = false;
      MR.toast("请求失败，请重试");
    });
    return;
  }
});

$("btnRefresh").addEventListener("click", function () {
  $("updAt").textContent = "取数中…";
  load(true);
});

window.addEventListener("scroll", maybeMore, { passive: true });

/* 下拉手势：只重读板上缓存，不触发上游取数 */
var pullY = 0, pulling = false;
window.addEventListener("touchstart", function (e) {
  pulling = window.scrollY <= 0 && e.touches.length === 1;
  if (pulling) pullY = e.touches[0].clientY;
}, { passive: true });
window.addEventListener("touchend", function (e) {
  if (!pulling) return;
  pulling = false;
  var y = (e.changedTouches && e.changedTouches[0]) ? e.changedTouches[0].clientY : pullY;
  if (y - pullY >= 60 && window.scrollY <= 0) {
    MR.toast("读取板上缓存", 900);
    load(false);
  }
}, { passive: true });

load(false);
setInterval(function () {
  if (window.scrollY > 200) return;     // 正在往下翻页时不打断
  load(false);                          // 定时也只读缓存
}, 300000);

/* 回到顶部：超过一屏才出现，避免与首屏内容抢位置。
   按钮写在脚本之前，正常路径直接取到；万一被挪到脚本之后，等 DOM 就绪再挂，
   否则这里拿到 null，整段静默失效（手机上就是「按钮一直不出现」）。 */
(function () {
  function setup(b) {
    var shown = false;
    function upd() {
      var y = window.pageYOffset || document.documentElement.scrollTop || 0;
      var need = y > (window.innerHeight || 600);
      if (need === shown) return;
      shown = need;
      if (need) b.classList.add("show");
      else b.classList.remove("show");
    }
    window.addEventListener("scroll", upd, { passive: true });
    window.addEventListener("resize", upd, { passive: true });
    b.addEventListener("click", function () {
      try { window.scrollTo({ top: 0, behavior: "smooth" }); }
      catch (e) { window.scrollTo(0, 0); }
      // 个别环境忽略 behavior:smooth，1 秒后仍在下方就直接跳回，
      // 并顺手复算一次，免得回到顶部后按钮还挂着
      setTimeout(function () {
        var y = window.pageYOffset || document.documentElement.scrollTop || 0;
        if (y > 40) window.scrollTo(0, 0);
        upd();
      }, 900);
    });
    upd();
  }
  var b = $("toTop");
  if (b) setup(b);
  else document.addEventListener("DOMContentLoaded", function () {
    var e = $("toTop");
    if (e) setup(e);
  });
})();
</script>
