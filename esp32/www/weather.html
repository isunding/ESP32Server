<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>天气 · ESP32 终端服务器</title>
<link rel="icon" href="data:,">
<style>
/* ESP32 终端服务器 · 设计系统
 * 视觉语言照搬原路由器页面：深色底 + 分层卡片 + 细描边 + 等宽数字
 */
:root{
  --bg:#0f1216; --bg2:#161b22; --bg3:#1c232c; --line:#283141;
  --fg:#e6edf3; --fg2:#8b98a9; --acc:#ff6a00; --acc2:#3b82f6;
  --ok:#3fb950; --err:#f85149; --warm:#ffb454; --cold:#58a6ff;
  --radius:16px;
}
@media (prefers-color-scheme:light){
  :root{
    --bg:#f2f5f9; --bg2:#ffffff; --bg3:#e9eef4; --line:#d8dee4;
    --fg:#1f2328; --fg2:#59636e;
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;min-height:100%}
body{
  background:radial-gradient(1200px 600px at 50% -10%, #1b2430 0%, var(--bg) 60%);
  background-attachment:fixed;
  color:var(--fg);
  font:15px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
}
@media (prefers-color-scheme:light){
  body{background:radial-gradient(1200px 600px at 50% -10%, #ffffff 0%, var(--bg) 55%);}
}
a{color:var(--acc);text-decoration:none}

/* ---------- 顶栏 ---------- */
.top{
  position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px;
  padding:12px 16px;background:color-mix(in srgb, var(--bg) 86%, transparent);
  backdrop-filter:blur(10px);border-bottom:1px solid var(--line);
}
.top .back{
  width:32px;height:32px;flex:0 0 32px;border-radius:9px;border:1px solid var(--line);
  background:var(--bg2);color:var(--fg2);display:flex;align-items:center;justify-content:center;
  font-size:16px;line-height:1;
}
.top .back:hover{color:var(--fg);border-color:var(--acc)}
.top h1{font-size:16px;margin:0;font-weight:600;flex:1;letter-spacing:.3px;
  min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .st{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--fg2);flex:0 0 auto}
.dot{width:7px;height:7px;border-radius:50%;background:var(--fg2);flex:0 0 auto}
.dot.on{background:var(--ok);box-shadow:0 0 8px var(--ok)}
.dot.err{background:var(--err)}
/* 心跳：每 15 秒刷一次 /api/health，点跟着呼吸一下，表示还在轮询 */
.dot.beat{animation:beat 2s ease-in-out infinite}
@keyframes beat{0%,100%{opacity:1}50%{opacity:.3}}
@media (prefers-reduced-motion: reduce){.dot.beat{animation:none}}

/* ---------- 页签 ---------- */
.nav{
  display:flex;gap:6px;overflow-x:auto;padding:10px 16px;
  border-bottom:1px solid var(--line);background:color-mix(in srgb, var(--bg) 86%, transparent);
  backdrop-filter:blur(10px);position:sticky;top:57px;z-index:19;
}
.nav a{
  flex:0 0 auto;font-size:13px;color:var(--fg2);border:1px solid var(--line);
  background:var(--bg2);border-radius:999px;padding:5px 13px;white-space:nowrap;
}
.nav a.on{background:var(--acc);border-color:var(--acc);color:#fff}
.nav a:hover{color:var(--fg)}

/* ---------- 容器 ---------- */
.wrap{max-width:760px;margin:0 auto;padding:16px 14px 40px}
.card{
  background:var(--bg2);border:1px solid var(--line);border-radius:var(--radius);
  padding:16px 18px;margin-bottom:12px;
}
.card>h2{margin:0 0 12px;font-size:13px;font-weight:600;color:var(--fg2);letter-spacing:.5px}
.card.flush{padding:6px 18px}
.muted{color:var(--fg2)}
.small{font-size:12px}
.right{margin-left:auto}
.btn{
  background:var(--bg3);border:1px solid var(--line);color:var(--fg);
  border-radius:9px;padding:7px 13px;font:inherit;font-size:13px;cursor:pointer;
}
.btn:hover{border-color:var(--acc);color:var(--acc)}
.btn.primary{background:var(--acc);border-color:var(--acc);color:#fff}
.btn.primary:hover{color:#fff;filter:brightness(1.08)}
.btn.mini{padding:4px 10px;font-size:12px;border-radius:7px;text-decoration:none}
.card>h2.hd{display:flex;align-items:center;gap:8px}
.card>h2.hd .sp{flex:1}

/* ---------- 页内工具条（更新时间 + 刷新按钮） ---------- */
/* 原先只写在 weather.html 的内联样式里，行情页用了同一个 class
   却拿不到样式，按钮就跑到左边去了。 */
.pgtop{display:flex;align-items:center;gap:10px;margin:0 0 10px}
.pgtop .upd{margin-left:auto;font-size:11.5px;color:var(--fg2);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pgtop .btn{flex:0 0 auto;display:inline-flex;align-items:center;gap:6px}
.pgtop .btn .ic{display:inline-block;font-size:14px;line-height:1}

/* ---------- 门户 ---------- */
.hero{text-align:center;margin:10px 0 26px}
.hero h1{margin:0 0 6px;font-size:24px;font-weight:600;letter-spacing:.5px}
.hero .sub{color:var(--fg2);font-size:13.5px}
.hero .badge{
  display:inline-flex;align-items:center;gap:7px;margin-top:12px;
  background:var(--bg3);border:1px solid var(--line);border-radius:999px;
  padding:5px 14px;font-size:12.5px;color:var(--fg2);
}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.tile{
  display:flex;align-items:center;gap:14px;color:inherit;
  background:linear-gradient(160deg,var(--bg2),var(--bg3));
  border:1px solid var(--line);border-radius:var(--radius);
  padding:18px;transition:.15s;position:relative;overflow:hidden;
}
.tile:hover{border-color:var(--acc);transform:translateY(-2px);box-shadow:0 10px 26px rgba(0,0,0,.45)}
.tile:active{transform:translateY(0)}
.tile .ico{
  width:46px;height:46px;flex:0 0 46px;border-radius:12px;display:flex;
  align-items:center;justify-content:center;background:var(--bg);border:1px solid var(--line);
}
.tile .ico svg{width:22px;height:22px;stroke:var(--acc);fill:none;stroke-width:1.7;
  stroke-linecap:round;stroke-linejoin:round}
.tile b{display:block;font-size:15.5px;font-weight:600;margin-bottom:2px}
.tile span{display:block;color:var(--fg2);font-size:12.5px;white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis}
.tile .go{position:absolute;right:14px;color:var(--fg2);font-size:18px;opacity:.5}
.tile:hover .go{color:var(--acc);opacity:1}

/* ---------- 服务状态小格 ---------- */
.sts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
@media (min-width:560px){.sts{grid-template-columns:repeat(4,minmax(0,1fr))}}
.st1{display:grid;grid-template-columns:auto minmax(0,1fr);column-gap:7px;row-gap:1px;
  align-items:center;background:var(--bg3);border:1px solid var(--line);
  border-radius:10px;padding:9px 11px;font-size:12.5px}
.st1 .dot{grid-column:1;grid-row:1;width:8px;height:8px}
.st1 b{grid-column:2;grid-row:1;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.st1 small{grid-column:2;grid-row:2;font-size:11.5px;color:var(--fg2);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* ---------- 天气 ---------- */
.now{text-align:center;padding:8px 0 4px}
.now .loc{color:var(--fg2);font-size:14px;margin-bottom:4px}
.now .big{display:flex;align-items:flex-end;justify-content:center;gap:14px;margin:6px 0}
.now .temp{font:600 72px/1 ui-monospace,Menlo,Consolas,monospace;letter-spacing:-2px}
.now .temp .deg{font-size:.38em;font-style:normal;vertical-align:.72em;
  margin-left:2px;letter-spacing:0;color:var(--fg2)}
.now .txt{font-size:17px;color:var(--fg2);padding-bottom:9px}
.now .feels{color:var(--fg2);font-size:13.5px;margin-top:2px}
.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:16px}
.metric{background:var(--bg3);border-radius:11px;padding:9px 4px;text-align:center}
.metric .k{font-size:11px;color:var(--fg2)}
.metric .v{font-size:15px;font-weight:600;margin-top:2px}

.aq{display:flex;align-items:center;gap:14px}
.aq .tile-aqi{
  min-width:64px;height:64px;border-radius:16px;display:flex;flex-direction:column;
  align-items:center;justify-content:center;color:#fff;font-weight:700;line-height:1;
  flex:0 0 64px;
}
.aq .tile-aqi b{font-size:24px;letter-spacing:-.5px}
.aq .tile-aqi small{font-size:10px;font-weight:500;opacity:.92;margin-top:3px;letter-spacing:1px}
.aq .info{flex:1;min-width:0}
.aq .cat{font-size:15px;font-weight:600;margin-bottom:3px}
.aq .adv{font-size:12px;color:var(--fg2);line-height:1.55}
.poll{display:grid;grid-template-columns:repeat(auto-fit,minmax(78px,1fr));gap:7px;margin-top:12px}
.poll .p{background:var(--bg3);border-radius:9px;padding:8px 6px;text-align:center}
.poll .p .n{font-size:10.5px;color:var(--fg2)}
.poll .p .v{font-size:14.5px;font-weight:600;margin:2px 0 1px}
.poll .p .u{font-size:9.5px;color:var(--fg2)}

.warn-bar{display:flex;align-items:center;gap:9px;font-size:13px;color:var(--fg2)}
.warn-bar .ok-dot{width:9px;height:9px;border-radius:50%;background:var(--ok);
  box-shadow:0 0 0 3px rgba(63,185,80,.16);flex:0 0 9px}
.warn-item{background:var(--bg3);border-left:3px solid var(--err);border-radius:9px;
  padding:10px 12px;margin-bottom:9px}
.warn-item:last-child{margin-bottom:0}
.warn-item .hd{display:flex;align-items:center;gap:8px;margin-bottom:5px;flex-wrap:wrap}
.warn-item .lv{font-size:11px;font-weight:600;padding:1px 7px;border-radius:5px;color:#fff}
.warn-item .ti{font-size:13.5px;font-weight:600}
.warn-item .bd{font-size:12.5px;line-height:1.6;color:var(--fg)}
.warn-item .mt{font-size:11px;color:var(--fg2);margin-top:6px}

.hours{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px}
.hour{flex:0 0 auto;width:58px;text-align:center;background:var(--bg3);
  border-radius:11px;padding:9px 4px}
.hour .h{font-size:11.5px;color:var(--fg2)}
.hour .t{font-size:14px;font-weight:600;margin-top:4px}
.hour .s{font-size:10.5px;color:var(--fg2);margin-top:2px;white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis}

.day{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}
.day:last-child{border-bottom:0}
.day .d{width:56px;font-size:13.5px}
.day .s{flex:1;font-size:13px;color:var(--fg2);min-width:0;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap}
.day .r{font-size:13.5px;font-variant-numeric:tabular-nums;white-space:nowrap}
.day .r b{color:var(--warm);font-weight:600}
.day .r i{color:var(--cold);font-style:normal}

.idx{display:grid;grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:8px}
.idx .it{background:var(--bg3);border-radius:10px;padding:9px 11px;font-size:12px}
.idx .it b{display:block;font-size:13px;margin-bottom:2px}
.idx .it span{color:var(--fg2)}

/* ---------- 状态 ---------- */
.meters{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.meter .k{font-size:11px;color:var(--fg2)}
.meter .v{font-size:19px;font-weight:600;font-variant-numeric:tabular-nums}
.bar{height:5px;background:var(--line);border-radius:3px;margin-top:6px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--acc2);border-radius:3px;transition:width .35s}
.bar i.warn{background:var(--warm)}
.bar i.crit{background:var(--err)}

table.kv{width:100%;border-collapse:collapse;font-size:13px}
table.kv td{padding:8px 0;border-bottom:1px solid var(--line);vertical-align:top}
table.kv td:first-child{color:var(--fg2);width:42%}
table.kv tr:last-child td{border-bottom:0}
table.kv .mono{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12.5px}

/* ---------- 流量 ---------- */
.dev{display:flex;align-items:center;justify-content:space-between;
  padding:10px 0;border-bottom:1px solid var(--line)}
.dev:last-child{border-bottom:0}
.dev .nm{font-size:13.5px;font-weight:500}
.dev .ip{color:var(--fg2);font-size:11.5px}
.dev .vals{text-align:right;white-space:nowrap;
  font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12.5px}
.dev .dn{color:var(--ok)}
.dev .up{color:var(--cold)}
.rank{display:inline-block;width:20px;color:var(--fg2);font-size:12px}

/* ---------- IPTV ---------- */
.player{position:relative;background:#0b0e12;border-radius:12px;overflow:hidden;
  aspect-ratio:16/9;border:1px solid var(--line)}
video{width:100%;height:100%;display:block;background:#0b0e12}
.ptip{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  color:#8b98a9;font-size:13px;text-align:center;padding:0 24px;pointer-events:none}
.ph{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.ph b{font-size:14px}
.search{background:var(--bg3);border:1px solid var(--line);color:var(--fg);
  border-radius:9px;padding:7px 11px;font:inherit;font-size:13px;width:46%}
.search:focus{outline:none;border-color:var(--acc)}
.grp{margin-top:14px}
.grp h3{margin:0 0 4px;font-size:12px;color:var(--fg2);font-weight:600;letter-spacing:.5px}
.ch{display:flex;align-items:center;justify-content:space-between;gap:10px;
  padding:10px 10px;border-radius:9px;font-size:14px;cursor:pointer}
.ch:hover{background:var(--bg3)}
.ch.playing{background:var(--bg3);box-shadow:inset 2px 0 0 var(--acc)}
.ch .tag{font-size:11px;color:var(--fg2);white-space:nowrap}
.ch .tag.live{color:var(--ok)}
.ch .tag.live::before{content:"● ";font-size:9px;vertical-align:1px}
.ch .tag.dead{color:var(--fg2)}

/* ---------- 提示 ---------- */
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(14px);
  background:#1f2937;border:1px solid var(--line);color:#e6edf3;padding:9px 18px;
  border-radius:9px;font-size:13px;opacity:0;transition:.25s;pointer-events:none;z-index:60}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.foot{color:var(--fg2);font-size:12px;text-align:center;margin:18px 0 0;line-height:1.9}
.foot code{background:var(--bg3);border:1px solid var(--line);border-radius:5px;padding:1px 6px;font-size:11.5px}

@media (max-width:520px){
  .wrap{padding:12px 12px 32px}
  .nav{gap:4px;padding:9px 10px}
  .nav a{padding:4px 9px;font-size:12px}
  .now .temp{font-size:58px}
  .meters{grid-template-columns:1fr 1fr;gap:10px}
  .grid{grid-template-columns:1fr}
}

</style>
<style>
  /* .pgtop / .btn 走 theme.css 的公共样式，这里只留刷新按钮的转圈动画 */
  #btnRefresh.spin{opacity:.65;pointer-events:none}
  #btnRefresh.spin .ic{animation:sp .8s linear infinite}
  @keyframes sp{to{transform:rotate(360deg)}}

  /* 图表：viewBox 定宽 660，宽度交给容器自适应 */
  .chart{position:relative}
  .chart svg{display:block;width:100%;height:auto}
  .legend{display:flex;gap:12px;flex-wrap:wrap;font-size:11.5px;
    color:var(--fg2);margin-top:6px}
  .legend i{display:inline-block;width:9px;height:9px;border-radius:2px;
    margin-right:4px;vertical-align:middle}
  .tip{font-size:11.5px;color:var(--fg2);margin-top:4px;min-height:16px}

  .seg{display:flex;gap:6px;margin-bottom:10px}
  .seg button{font-size:12px;padding:4px 10px;border-radius:7px;
    border:1px solid var(--line);background:var(--bg3);color:var(--fg2);
    cursor:pointer;font-family:inherit}
  .seg button.on{border-color:var(--acc);color:var(--acc);
    background:rgba(255,106,0,.12)}

  /* 生活指数：多一行建议文字 */
  .idx .it p{margin:3px 0 0;font-size:11.5px;line-height:1.45;color:var(--fg2)}
  .warn-item .bd{white-space:pre-wrap}

  /* 7 天列表：温度区间条 + 点击展开日详情 */
  #days .day{flex-wrap:wrap;cursor:pointer;user-select:none;
    transition:background .15s;border-radius:9px}
  #days .day:hover{background:var(--bg3)}
  #days .day.open{background:var(--bg3)}
  #days .day .i{font-size:18px;width:26px;flex:0 0 26px;text-align:center}
  #days .day .bar{width:76px;height:5px;border-radius:3px;background:var(--bg3);
    position:relative;flex:0 0 auto;overflow:hidden}
  #days .day .bar span{position:absolute;height:100%;border-radius:3px;
    background:linear-gradient(90deg,var(--cold),var(--warm))}
  #days .day .arw{font-size:10px;color:var(--fg2);opacity:.5;
    transition:transform .2s;margin-left:2px}
  #days .day.open .arw{transform:rotate(90deg)}
  #days .day .meta{flex:0 0 100%;display:flex;flex-wrap:wrap;gap:6px 10px;
    font-size:11.5px;color:var(--fg2)}
  #days .day .meta em{font-style:normal;display:inline-flex;align-items:center;gap:3px}
  #days .day .meta em.rain{color:#58a6ff}
  #days .day .detail{flex:0 0 100%;display:none;padding:10px 4px 4px;
    margin-top:8px;border-top:1px dashed var(--line)}
  #days .day.open .detail{display:block}
  .dt-rain{display:flex;align-items:center;gap:8px;margin-bottom:8px;
    font-size:12px;color:var(--fg2)}
  .dt-rain b{color:var(--fg);font-weight:600}
  .dt-rain .rl{height:6px;flex:1;background:var(--bg3);border-radius:3px;overflow:hidden}
  .dt-rain .rl i{display:block;height:100%;background:#58a6ff;border-radius:3px}
  .dt-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(108px,1fr));gap:8px}
  .dt-grid .g{background:var(--bg3);border:1px solid var(--line);
    border-radius:9px;padding:8px 10px}
  .dt-grid .g .k{font-size:10.5px;color:var(--fg2)}
  .dt-grid .g .v{font-size:13.5px;font-weight:600;margin-top:3px}
  .dt-grid .g .v small{font-size:10.5px;font-weight:400;
    color:var(--fg2);margin-left:2px}

  /* 路由器原始天气页入口 */
  .srcbar{display:flex;align-items:center;gap:10px;padding:12px 14px;margin-top:14px;
    background:var(--bg2);border:1px solid var(--line);border-radius:var(--radius);
    color:var(--fg);text-decoration:none;transition:.15s}
  .srcbar:hover{border-color:var(--acc)}
  .srcbar .ic{width:30px;height:30px;flex:0 0 30px;border-radius:9px;
    display:flex;align-items:center;justify-content:center;
    background:var(--bg3);color:var(--acc);font-size:15px}
  .srcbar .tx{flex:1;min-width:0;display:flex;flex-direction:column}
  .srcbar .tx b{font-size:13px;font-weight:600}
  .srcbar .tx small{font-size:11.5px;color:var(--fg2);
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .srcbar .go{color:var(--fg2);font-size:18px}
</style>
</head>
<body>

<div id="topbar"></div>

<div class="wrap">
  <div class="pgtop">
    <span class="upd" id="updAt"></span>
    <button class="btn" id="btnRefresh"><span class="ic">↻</span>刷新</button>
  </div>

  <div class="card" id="warnCard">
    <h2>气象预警</h2>
    <div class="warn-bar"><span class="ok-dot"></span>正在检查…</div>
  </div>

  <div class="card">
    <div class="now">
      <div class="loc" id="loc">—</div>
      <div class="big">
        <div class="temp" id="temp">--</div>
        <div class="txt" id="txt">—</div>
      </div>
      <div class="feels" id="feels">—</div>
      <div class="metrics">
        <div class="metric"><div class="k">湿度</div><div class="v" id="hum">—</div></div>
        <div class="metric"><div class="k">风向</div><div class="v" id="wind">—</div></div>
        <div class="metric"><div class="k">风力</div><div class="v" id="scale">—</div></div>
        <div class="metric"><div class="k">气压</div><div class="v" id="press">—</div></div>
      </div>
    </div>
  </div>

  <div class="card">
    <h2>空气质量</h2>
    <div class="aq">
      <div class="tile-aqi" id="aqiTile"><b id="aqi">--</b><small>AQI</small></div>
      <div class="info">
        <div class="cat" id="aqiCat">—</div>
        <div class="adv" id="aqiAdv">—</div>
      </div>
    </div>
    <div class="poll" id="poll"></div>

<script>
/* ESP32 终端服务器 · 公共前端
 * 各页面共用：取数、格式化、顶栏与页签、提示条
 */
"use strict";

var MR = (function () {

  var PAGES = [
    { href: "/", title: "首页" },
    { href: "/weather.html", title: "天气" },
    { href: "/market.html", title: "行情" },
    { href: "/radio.html", title: "电台" },
    { href: "/info.html", title: "本机" },
    { href: "/ntp.html", title: "NTP" },
    { href: "/iptv.html", title: "IPTV" }
  ];

  function $(id) { return document.getElementById(id); }

  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }

  function api(path) {
    return fetch(path, { cache: "no-store" }).then(function (r) {
      if (!r.ok) throw new Error("HTTP " + r.status);
      return r.json();
    });
  }

  function fmtBytes(n) {
    n = Number(n) || 0;
    if (n < 1024) return n + " B";
    if (n < 1048576) return (n / 1024).toFixed(1) + " KB";
    if (n < 1073741824) return (n / 1048576).toFixed(1) + " MB";
    return (n / 1073741824).toFixed(2) + " GB";
  }

  function fmtDur(sec) {
    sec = Number(sec) || 0;
    var d = Math.floor(sec / 86400), h = Math.floor(sec % 86400 / 3600), m = Math.floor(sec % 3600 / 60);
    if (d) return d + " 天 " + h + " 小时";
    if (h) return h + " 小时 " + m + " 分";
    return m + " 分钟";
  }

  function pad(n) { return n < 10 ? "0" + n : "" + n; }
  function hhmm(d) { return pad(d.getHours()) + ":" + pad(d.getMinutes()); }
  function mmdd(s) { return s ? s.substr(5, 5) : "--"; }

  function currentPage() {
    var p = location.pathname;
    if (p === "" || p === "/" || p === "/index.html") return "/";
    return p.replace(/^\/+/, "/");
  }

  /* 顶栏 + 页签。title 为空时不显示返回键。
     挂载完就自动开始心跳：以前要求每页自己调 healthTick()，漏掉一页
     右上角就永远停在初始文案「连接中…」。 */
  function mountTop(title) {
    var cur = currentPage();
    var nav = PAGES.map(function (p) {
      var on = p.href === cur ? " on" : "";
      return '<a class="' + on.trim() + '" href="' + p.href + '">' + p.title + "</a>";
    }).join("");

    var back = cur === "/" ? "" :
      '<a class="back" href="/" title="返回首页">‹</a>';

    var html =
      '<div class="top">' + back +
      "<h1>" + esc(title) + "</h1>" +
      '<div class="st"><span class="dot" id="hDot"></span><span id="hIp">连接中…</span></div>' +
      "</div>" +
      '<div class="nav">' + nav + "</div>";

    var host = document.getElementById("topbar");
    if (host) {
      host.innerHTML = html;
      startBeat();
    }
  }

  var tickBusy = null, tickAt = 0, tickTimer = 0;

  /* 心跳：取一次 /api/health，把 IP 与状态点刷到顶栏。
     重复调用复用同一次请求，多页共用一个 15 秒定时器。 */
  function healthTick() {
    if (tickBusy) return tickBusy;
    if (MR.device && Date.now() - tickAt < 800) return Promise.resolve(MR.device);
    tickBusy = api("/api/health").then(function (h) {
      var dot = $("hDot"), ip = $("hIp");
      if (dot) dot.className = "dot beat " + (h.router_ok ? "on" : "err");
      if (ip) {
        ip.textContent = h.ip;
        ip.title = (h.router_ok ? "路由器可达" : "路由器不可达") + " · RSSI " + h.rssi +
          " · 运行 " + fmtDur(h.up) + " · 空闲内存 " + fmtBytes(h.mem_free);
      }
      MR.device = h;
      return h;
    }).catch(function () {
      var dot = $("hDot"), ip = $("hIp");
      if (dot) dot.className = "dot beat err";
      // 掉了也别把 IP 抹成占位文案，留着最后已知的地址更有用
      if (ip) {
        ip.textContent = MR.device ? MR.device.ip : "离线";
        ip.title = "设备无响应";
      }
      return null;
    }).then(function (r) {
      tickBusy = null;
      tickAt = Date.now();
      return r;
    });
    return tickBusy;
  }

  function startBeat() {
    if (tickTimer) return;
    healthTick();
    tickTimer = setInterval(healthTick, 15000);
  }

  var toastTimer = 0;
  function toast(msg, ms) {
    var el = document.getElementById("toast");
    if (!el) {
      el = document.createElement("div");
      el.id = "toast";
      el.className = "toast";
      document.body.appendChild(el);
    }
    el.textContent = msg;
    el.className = "toast on";
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { el.className = "toast"; }, ms || 2600);
  }

  function empty(msg) { return '<span class="muted small">' + esc(msg) + "</span>"; }

  return {
    $: $, esc: esc, api: api, fmtBytes: fmtBytes, fmtDur: fmtDur,
    hhmm: hhmm, mmdd: mmdd, mountTop: mountTop, healthTick: healthTick,
    startBeat: startBeat,
    toast: toast, empty: empty, PAGES: PAGES, device: null
  };
})();

</script>

/* 空气接口统一给 UTC 时间（...T09:00Z），按本地时区换算后再显示 */
var TZ_OFF = 8 * 60;
function setTzFrom(obsTime) {
  var m = /([+-])(\d{2}):(\d{2})$/.exec(obsTime || "");
  if (m) TZ_OFF = (m[1] === "-" ? -1 : 1) * (parseInt(m[2], 10) * 60 + parseInt(m[3], 10));
}
function p2(n) { return (n < 10 ? "0" : "") + n; }
function zoned(iso) {
  var t = Date.parse(iso);
  if (isNaN(t)) return null;
  var d = new Date(t + TZ_OFF * 60000);
  return { md: p2(d.getUTCMonth() + 1) + "-" + p2(d.getUTCDate()),
           hm: p2(d.getUTCHours()) + ":" + p2(d.getUTCMinutes()) };
}

/* 预警走 CAP 字段（issuedTime / onsetTime / expireTime），带 Z 的是 UTC，
   必须换算成本地时间再显示，否则「发布/时段」会比实际早整整 8 小时。 */
function wtime(iso) {
  if (!iso) return "";
  var t = Date.parse(iso);
  if (isNaN(t)) return String(iso).replace("T", " ").substr(0, 16);
  var d = new Date(t + TZ_OFF * 60000);
  return d.getUTCFullYear() + "-" + p2(d.getUTCMonth() + 1) + "-" +
    p2(d.getUTCDate()) + " " + p2(d.getUTCHours()) + ":" + p2(d.getUTCMinutes());
}

/* ================= 简易 SVG 图表引擎 =================
   不引任何第三方库：图表全部在浏览器端画，板子只发页面和一份 JSON。
   viewBox 固定 660 宽，靠 CSS 自适应容器宽度。 */
function svgEl(tag, attrs) {
  var e = document.createElementNS("http://www.w3.org/2000/svg", tag);
  for (var k in attrs) e.setAttribute(k, attrs[k]);
  return e;
}

function drawChart(host, o) {
  host.innerHTML = "";
  var W = 660, H = o.height || 220, P = { l: 34, r: 34, t: 14, b: 26 };
  var iw = W - P.l - P.r, ih = H - P.t - P.b;
  var n = o.labels.length;
  if (!n) { host.innerHTML = MR.empty("暂无数据"); return; }

  function rng(arr, opts) {
    opts = opts || {};
    var vs = arr.filter(function (v) { return v !== null && !isNaN(v); });
    if (!vs.length) return [0, 1];
    var lo = Math.min.apply(null, vs), hi = Math.max.apply(null, vs);
    if (opts.include0) { lo = Math.min(lo, 0); hi = Math.max(hi, 0); }
    if (opts.nonNeg) lo = Math.max(lo, 0);
    if (hi === lo) hi = lo + 1;
    var pad = (hi - lo) * 0.12;
    var a = lo - pad, b = hi + pad;
    if (opts.nonNeg && a < 0) a = 0;
    if (opts.include0 && b < 0) b = 0;
    return [a, b];
  }

  var leftArr = [], rightArr = [];
  o.series.forEach(function (s) {
    if (s.axis === "r") rightArr = rightArr.concat(s.data);
    else leftArr = leftArr.concat(s.data);
  });
  var LR = o.leftRange || rng(leftArr, { include0: false });
  var RR = o.rightRange || rng(rightArr, { include0: true, nonNeg: !!o.rightNonNeg });

  var svg = svgEl("svg", { viewBox: "0 0 " + W + " " + H,
                           preserveAspectRatio: "xMidYMid meet" });

  function X(i) { return P.l + (n === 1 ? iw / 2 : i * iw / (n - 1)); }
  function YL(v) { return P.t + ih - (v - LR[0]) / (LR[1] - LR[0]) * ih; }
  function YR(v) { return P.t + ih - (v - RR[0]) / (RR[1] - RR[0]) * ih; }

  for (var g = 0; g <= 4; g++) {
    var gy = P.t + ih * g / 4;
    svg.appendChild(svgEl("line", { x1: P.l, y1: gy, x2: W - P.r, y2: gy,
      stroke: "var(--line)", "stroke-width": 1, opacity: .55 }));
  }

  /* 柱状（右轴） */
  var BASE = (o.baseline == null) ? Math.max(0, RR[0]) : o.baseline;
  o.series.forEach(function (s) {
    if (s.type !== "bar") return;
    var bw = Math.max(2, iw / n * (o.barWidth || 0.55));
    s.data.forEach(function (v, i) {
      if (v === null || isNaN(v)) return;
      if (v <= BASE && !o.showZeroBar) return;
      var y = YR(v), y0 = YR(BASE);
      svg.appendChild(svgEl("rect", { x: X(i) - bw / 2, y: Math.min(y, y0), width: bw,
        height: Math.max(1, Math.abs(y0 - y)), rx: 2, fill: s.color,
        opacity: s.opacity || .55 }));
    });
  });

  /* 折线 */
  o.series.forEach(function (s) {
    if (s.type === "bar") return;
    var YF = (s.axis === "r") ? YR : YL;
    var d = "", started = false;
    s.data.forEach(function (v, i) {
      if (v === null || isNaN(v)) { started = false; return; }
      d += (started ? "L" : "M") + X(i).toFixed(1) + " " + YF(v).toFixed(1) + " ";
      started = true;
    });
    svg.appendChild(svgEl("path", { d: d, fill: "none", stroke: s.color,
      "stroke-width": 2.2, "stroke-linejoin": "round", "stroke-linecap": "round" }));
  });

  /* 数值标签：点数超过 maxLabels 直接不画，避免糊成一团 */
  if (o.showLabels && n <= (o.maxLabels || 10)) {
    o.series.forEach(function (s) {
      var YF = (s.axis === "r") ? YR : YL;
      var dstep = s.step || 1;
      s.data.forEach(function (v, i) {
        if (i % dstep) return;
        if (v === null || isNaN(v)) return;
        if (s.type === "bar" && v <= 0) return;
        var isBar = s.type === "bar";
        var dy = s.labelBelow ? 13 : (isBar ? -5 : -7);
        var tx = svgEl("text", {
          x: X(i), y: YF(v) + dy,
          "font-size": s.labelSize || 10.5, "font-weight": 600,
          fill: s.labelColor || s.color,
          "paint-order": "stroke", stroke: "var(--bg2)", "stroke-width": 2.5,
          "stroke-linejoin": "round"
        });
        tx.textContent = v + (s.labelUnit || o.labelUnit || "");
        svg.appendChild(tx);
      });
    });
  }

  /* 底部附加行（降水概率百分比之类），压在 X 轴上方 */
  if (o.bottomRows && o.bottomRows.length) {
    o.bottomRows.forEach(function (row, k) {
      row.data.forEach(function (v, i) {
        if (v === null || v === undefined || isNaN(v)) return;
        if (row.hideZero && !v) return;
        var ty = P.t + ih - 4 - (o.bottomRows.length - 1 - k) * 12;
        var tx = svgEl("text", { x: X(i), y: ty, "text-anchor": "middle",
          "font-size": row.fontSize || 9.5, "font-weight": 600,
          fill: row.color || "var(--fg2)" });
        tx.textContent = v + (row.suffix || "");
        svg.appendChild(tx);
      });
    });
  }

  var step = Math.max(1, Math.ceil(n / 8));
  o.labels.forEach(function (t, i) {
    if (i % step !== 0 && i !== n - 1) return;
    var tx = svgEl("text", { x: X(i), y: H - 8, "text-anchor": "middle",
      "font-size": 10.5, fill: "var(--fg2)" });
    tx.textContent = t;
    svg.appendChild(tx);
  });

  [0, 0.5, 1].forEach(function (f) {
    var t1 = svgEl("text", { x: P.l - 5, y: P.t + ih * (1 - f) + 3.5,
      "text-anchor": "end", "font-size": 10, fill: "var(--fg2)" });
    t1.textContent = Math.round(LR[0] + (LR[1] - LR[0]) * f) + (o.leftUnit || "");
    svg.appendChild(t1);
    if (rightArr.length) {
      var t2 = svgEl("text", { x: W - P.r + 5, y: P.t + ih * (1 - f) + 3.5,
        "text-anchor": "start", "font-size": 10, fill: "var(--fg2)" });
      t2.textContent = Math.round(RR[0] + (RR[1] - RR[0]) * f) + (o.rightUnit || "");
      svg.appendChild(t2);
    }
  });

  /* 天气图标：贴在对应数据点上方 */
  if (o.icons && o.icons.length) {
    o.icons.forEach(function (s, i) {
      if (!s) return;
      var yv = (o.iconsAxis === "r") ? YR(o.iconsY[i]) : YL(o.iconsY[i]);
      var ty = yv - (o.iconsOffset || 18);
      if (ty < P.t + 11) ty = P.t + 11;
      var tx = svgEl("text", { x: X(i), y: ty, "text-anchor": "middle",
        "font-size": 12.5 });
      tx.textContent = s;
      svg.appendChild(tx);
    });
  }

  /* 图例 + 悬停提示先建好，再挂监听，避免闭包拿到 undefined */
  var lg = document.createElement("div");
  lg.className = "legend";
  o.series.forEach(function (s) {
    var sp = document.createElement("span");
    sp.innerHTML = '<i style="background:' + s.color + '"></i>' + esc(s.name);
    lg.appendChild(sp);
  });
  host.appendChild(svg);
  host.appendChild(lg);
  var tipEl = document.createElement("div");
  tipEl.className = "tip";
  tipEl.textContent = o.hint || "悬停查看数值";
  host.appendChild(tipEl);

  var vline = svgEl("line", { x1: 0, y1: P.t, x2: 0, y2: P.t + ih,
    stroke: "var(--acc)", "stroke-width": 1, "stroke-dasharray": "3 3", opacity: 0 });
  svg.appendChild(vline);
  var hit = svgEl("rect", { x: P.l, y: P.t, width: iw, height: ih, fill: "transparent" });
  hit.addEventListener("mousemove", function (ev) {
    var r = svg.getBoundingClientRect();
    var px = (ev.clientX - r.left) / r.width * W;
    var i = Math.round((px - P.l) / (iw || 1) * (n - 1));
    i = Math.max(0, Math.min(n - 1, i));
    vline.setAttribute("x1", X(i));
    vline.setAttribute("x2", X(i));
    vline.setAttribute("opacity", .8);
    tipEl.textContent = o.tip ? o.tip(i) : o.labels[i];
  });
  hit.addEventListener("mouseleave", function () {
    vline.setAttribute("opacity", 0);
    tipEl.textContent = o.hint || "悬停查看数值";
  });
  svg.appendChild(hit);
}

/* ---------------- 未来 24 小时 ---------------- */
function draw24(hs) {
  var host = $("chart24");
  if (!host) return;
  var arr = hs.slice(0, 24);
  if (!arr.length) { host.innerHTML = MR.empty("暂无数据"); return; }

    labels.push((h.fxTime || "").substr(11, 5));
    temp.push(+h.temp);
    pop.push(+(h.pop || 0));
    var pv = +(h.precip || 0);
    prcp.push(pv);
    if (pv > 0) hasRain = true;
    icons.push(icon(h.icon));
  });

  var tmin = Math.min.apply(null, temp), tmax = Math.max.apply(null, temp);
  var padT = Math.max(2, Math.round((tmax - tmin) * 0.25));
  var lo = tmin - padT, hi = tmax + padT;
  if (hi - lo < 6) { var mid = (hi + lo) / 2; lo = mid - 3; hi = mid + 3; }

  var series = [
    { name: "气温", color: "#ff9540", type: "line", data: temp, axis: "l",
      labelUnit: "°", labelBelow: true, step: 2, labelColor: "#d97a1f", labelSize: 10 }
  ];
  var rightUnit = "", rightRange = null;
  if (hasRain) {
    var maxPr = Math.max.apply(null, prcp);
    var topPr = Math.max(0.5, Math.ceil(maxPr * 1.4 * 10) / 10);
    series.unshift({ name: "降水量", color: "rgba(88,166,255,.55)", type: "bar",
                     data: prcp, axis: "r", opacity: .8, labelUnit: "" });
    rightUnit = "mm";
    rightRange = [0, topPr];
  }

  drawChart(host, {
    labels: labels, height: 250, leftUnit: "°", rightUnit: rightUnit,
    leftRange: [lo, hi], rightRange: rightRange, rightNonNeg: true,
    baseline: 0, barWidth: 0.5, series: series,
    showLabels: true, maxLabels: 24,
    bottomRows: [{ data: pop, suffix: "%", hideZero: true,
                   color: "#58a6ff", fontSize: 9.5 }],
    icons: icons, iconsY: temp, iconsAxis: "l", iconsOffset: 16,
    hint: "悬停查看每小时数值",
    tip: function (i) {
      return labels[i] + "：" + temp[i] + "° · 降水概率 " + pop[i] +
        "% · 降水量 " + prcp[i] + "mm · " + (arr[i].text || "");
    }
  });
}

/* ---------------- 未来 7 天 ---------------- */
var WEEKS = ["日", "一", "二", "三", "四", "五", "六"];
function draw7(days) {
  var host = $("chart7");
  if (!host) return;
  if (!days.length) { host.innerHTML = MR.empty("暂无数据"); return; }
  var labels = days.map(function (x, i) {
    var dt = new Date((x.fxDate || "").replace(/-/g, "/"));
    return i === 0 ? "今天" : "周" + WEEKS[dt.getDay()];
  });
  var tmax = days.map(function (x) { return +x.tempMax; });
  var tmin = days.map(function (x) { return +x.tempMin; });
  var pre = days.map(function (x) { return +(x.precip || 0); });
  drawChart(host, {
    labels: labels, height: 220, leftUnit: "°", rightUnit: "mm", rightNonNeg: true,
    showLabels: true, maxLabels: 10,
    series: [
      { name: "最高温", color: "#ff6a00", type: "line", data: tmax, axis: "l", labelUnit: "°" },
      { name: "最低温", color: "#58a6ff", type: "line", data: tmin, axis: "l", labelUnit: "°" },
      { name: "降水量", color: "#7ee787", type: "bar", data: pre, axis: "r", labelUnit: "mm" }
    ],
    hint: "悬停查看每天数值",
    tip: function (i) {
      return labels[i] + "：最高 " + tmax[i] + "° / 最低 " + tmin[i] +
        "° · 降水 " + pre[i] + " mm";
    }
  });
}

/* ---------------- 过去 7 天 ---------------- */
var HIST = null, HMODE = "hour";

function histMode(m, btn) {
  HMODE = m;
  var bs = $("histSeg").getElementsByTagName("button");
  for (var i = 0; i < bs.length; i++) bs[i].className = "";
  if (btn) btn.className = "on";
  if (HIST) drawHist();
}

function drawHist() {
  var host = $("chartHist");
  var days = (HIST.days || []).slice().sort(function (a, b) {
    var da = (a.weatherDaily && a.weatherDaily.date) || "";
    var db = (b.weatherDaily && b.weatherDaily.date) || "";
    return da < db ? -1 : (da > db ? 1 : 0);
  });
  if (!days.length) { host.innerHTML = MR.empty("暂无历史数据"); return; }

  if (HMODE === "day") {
    var lb = days.map(function (d) { return (d.weatherDaily.date || "").slice(5); });
    var hi = days.map(function (d) { return +(d.weatherDaily.tempMax || 0); });
    var lo = days.map(function (d) { return +(d.weatherDaily.tempMin || 0); });
    var hu = days.map(function (d) { return +(d.weatherDaily.humidity || 0); });
    var pr = days.map(function (d) { return +(d.weatherDaily.precip || 0); });
    drawChart(host, {
      labels: lb, height: 220, leftUnit: "°", rightUnit: "mm", rightNonNeg: true,
      showLabels: true, maxLabels: 10,
      series: [
        { name: "最高温", color: "#ff6a00", type: "line", data: hi, axis: "l", labelUnit: "°" },
        { name: "最低温", color: "#58a6ff", type: "line", data: lo, axis: "l", labelUnit: "°" },
        { name: "降水量", color: "#7ee787", type: "bar", data: pr, axis: "r", labelUnit: "mm" }
      ],
      hint: "悬停查看每天数值",
      tip: function (i) {
        return lb[i] + "：最高 " + hi[i] + "° / 最低 " + lo[i] +
          "° · 湿度 " + hu[i] + "% · 降水 " + pr[i] + " mm";
      }
    });
    return;
  }

  var labels = [], temp = [], hum = [], pre = [];
  days.forEach(function (d) {
    (d.weatherHourly || []).forEach(function (h) {
      labels.push((h.time || "").slice(5, 13).replace("T", " "));
      temp.push(+h.temp);
      hum.push(+h.humidity);
      pre.push(+(h.precip || 0));
    });
  });
  drawChart(host, {
    labels: labels, height: 230, leftUnit: "°", rightUnit: "%",
    rightRange: [0, 100],
    series: [
      { name: "气温", color: "#ff9540", type: "line", data: temp, axis: "l" },
      { name: "湿度", color: "#58a6ff", type: "line", data: hum, axis: "r" }
    ],
    hint: "悬停查看逐小时数值",
    tip: function (i) {
      return labels[i] + "：" + temp[i] + "° · 湿度 " + hum[i] +
        "% · 降水 " + pre[i] + " mm";
    }
  });
  /* 累计降水单独一行，比塞进图里直观 */
  if (pre.some(function (v) { return v > 0; })) {
    var total = pre.reduce(function (a, b) { return a + b; }, 0);
    var rainy = pre.filter(function (v) { return v > 0; }).length;
    var sub = document.createElement("div");
    sub.className = "tip";
    sub.textContent = "过去 7 天累计降水 " + total.toFixed(1) +
      " mm，其中 " + rainy + " 个小时有降水";
    host.appendChild(sub);
  }
}

/* ================= 预警 =================
   后端给的是和风 v7 warning.alerts：headline / description / severity /
   color.code / eventType.name / issuedTime。severity 用 minor…extreme，
   颜色另有一份 color.code（blue/yellow/orange/red），两者都要认。 */
var LV = { white: 0, blue: 1, yellow: 2, orange: 3, red: 4,
           minor: 1, moderate: 2, severe: 3, extreme: 4 };
var LV_COLOR = ["#8b949e", "#1f6feb", "#b8860b", "#e07000", "#d1242f"];
var LV_NAME = { minor: "蓝色", moderate: "黄色", severe: "橙色", extreme: "红色",
                blue: "蓝色", yellow: "黄色", orange: "橙色", red: "红色" };

/* 上游可能给四种形状，统一摊平成列表再归一化：
   裸数组 / {alerts:[...]} / {warning:[...]} / {warning:{alerts:[...]}}
   少认一种就会把预警整段丢光，页面显示成「无生效预警」。 */
function alertList(w) {
  if (!w) return [];
  if (Array.isArray(w)) return w;
  if (Array.isArray(w.alerts)) return w.alerts;
  if (Array.isArray(w.warning)) return w.warning;
  if (w.warning && Array.isArray(w.warning.alerts)) return w.warning.alerts;
  if (w.warning && Array.isArray(w.warning.warning)) return w.warning.warning;
  return [];
}

/* color 可能是对象 {code:"blue"}，也可能直接是字符串 "Blue"，都要认 */
function colorKey(a) {
  var c = a.color;
  if (c && typeof c === "object") return String(c.code || "").toLowerCase();
  return String(c || "").toLowerCase();
}

function normAlerts(w) {
  return alertList(w).map(function (a) {
    var sev = String(a.severity || a.level || "").toLowerCase();
    var col = colorKey(a);
    /* 颜色码优先，其次才是 severity；两者都认不出才退到 2（黄色） */
    var lv = LV[col] != null ? LV[col] : (LV[sev] != null ? LV[sev] : 2);
    var ev = a.eventType;
    var typeName = (ev && ev.name) ? ev.name
                 : (typeof ev === "string" ? ev : (a.eventName || a.typeName || ""));
    var head = a.headline || a.title || "";
    return {
      lv: lv,
      lvName: a.severityColor || a.colorName ||
              LV_NAME[col] || LV_NAME[sev] || "预警",
      title: head || (typeName ? typeName + "预警" : "气象预警"),
      text: a.description || a.text || a.instruction || "",
      typeName: typeName,
      pub: wtime(a.issuedTime || a.issueTime || a.pubTime || ""),
      start: wtime(a.onsetTime || a.effectiveTime || a.startTime || ""),
      end: wtime(a.expireTime || a.endTime || "")
    };
  });
}

function renderWarn(list) {
  var wc = $("warnCard");
  if (!list.length) {
    wc.innerHTML = '<h2>气象预警</h2><div class="warn-bar"><span class="ok-dot"></span>当前无生效预警</div>';
    return;
  }
  var html = list.map(function (x) {
    var c = LV_COLOR[x.lv] || LV_COLOR[2];
    var mt = [];
    if (x.typeName) mt.push("类型 " + x.typeName);
    if (x.pub) mt.push("发布 " + x.pub);
    if (x.start && x.end) mt.push("时段 " + x.start + " ~ " + x.end);
    return '<div class="warn-item" style="border-left-color:' + c + '">' +
      '<div class="hd"><span class="lv" style="background:' + c + '">' +
      esc(x.lvName) + '</span><span class="ti">' + esc(x.title) + "</span></div>" +
      (x.text ? '<div class="bd">' + esc(x.text) + "</div>" : "") +
      (mt.length ? '<div class="mt">' + esc(mt.join(" · ")) + "</div>" : "") +
      "</div>";
  }).join("");
  wc.innerHTML = "<h2>气象预警（" + list.length + "）</h2>" + html;
}

/* ---------------- 未来 24 小时 AQI ---------------- */
function drawAq24(hAir) {
  var host = $("chartAq24"), tip = $("aq24Tip");
  var a = ((hAir && hAir.hours) || []).map(function (h) {
    var ix = pickIdx(h.indexes), z = zoned(h.forecastTime);
    if (!ix) return null;
    return { t: z ? z.hm : "", v: +ix.aqi,
             txt: ix.aqiDisplay || ix.aqi,
             col: AQ_COLOR[aqiLevel(ix.aqi)] };
  }).filter(Boolean);

  if (!a.length) {
    host.innerHTML = "";
    host.style.display = "none";
    tip.style.display = "none";
    return;
  }
  host.style.display = "block";
  tip.style.display = "block";

  var W = 660, H = 170, P = { l: 30, r: 12, t: 24, b: 22 };
  var iw = W - P.l - P.r, ih = H - P.t - P.b;
  var mx = Math.max.apply(null, a.map(function (x) { return x.v; }));
  var top = Math.max(100, Math.ceil(mx / 50) * 50);
  var bw = Math.max(3, iw / a.length * 0.62);
  var svg = svgEl("svg", { viewBox: "0 0 " + W + " " + H,
                           preserveAspectRatio: "xMidYMid meet" });
  svg.appendChild(svgEl("line", { x1: P.l, y1: P.t + ih, x2: W - P.r, y2: P.t + ih,
    stroke: "var(--line)", "stroke-width": 1 }));

  a.forEach(function (x, i) {
    var cx = P.l + iw * (i + 0.5) / a.length;
    var h = Math.max(2, x.v / top * ih);
    var y = P.t + ih - h;
    svg.appendChild(svgEl("rect", { x: cx - bw / 2, y: y, width: bw, height: h,
      rx: 2, fill: x.col || "#8b949e" }));
    var fs = a.length > 20 ? 8 : (a.length > 14 ? 9 : 10);
    var t1 = svgEl("text", { x: cx, y: y - 3.5, "text-anchor": "middle",
      "font-size": fs, "font-weight": 600,
      fill: AQ_INK[aqiLevel(x.v)] || "var(--fg2)",
      "paint-order": "stroke", stroke: "var(--bg2)", "stroke-width": 2.2,
      "stroke-linejoin": "round" });
    t1.textContent = x.txt;
    svg.appendChild(t1);
    if (i % 3 === 0) {
      var t2 = svgEl("text", { x: cx, y: H - 6, "text-anchor": "middle",
        "font-size": 9, fill: "var(--fg2)" });
      t2.textContent = x.t;
      svg.appendChild(t2);
    }
  });

  host.innerHTML = "";
  host.appendChild(svg);
  tip.textContent = "未来 24 小时 AQI · 峰值 " + mx;
}

/* ---------------- 未来 7 天：列表（温度区间条 + 展开详情） ---------------- */
function uvText(uv) {
  var v = +(uv || 0);
  if (!v) return "无";
  if (v >= 8) return "很强";
  if (v >= 6) return "强";
  if (v >= 3) return "中等";
  return "弱";
}

/* 空气预报只覆盖未来 3 天，按 "MM-DD" 建索引，没有的日子不占格子 */
function aqiByDay(aird) {
  var m = {};
  ((aird && aird.days) || []).forEach(function (d) {
    var ix = pickIdx(d.indexes), z = zoned(d.forecastStartTime);
    if (!ix || !z) return;
    m[z.md] = { v: +ix.aqi, txt: ix.aqiDisplay || ix.aqi,
                cat: ix.category || "", col: AQ_COLOR[aqiLevel(ix.aqi)] };
  });
  return m;
}

function dg(ic, k, v, u) {
  return '<div class="g"><div class="k">' + ic + " " + k + "</div>" +
    '<div class="v">' + esc(v == null || v === "" ? "-" : v) +
    (u ? "<small>" + u + "</small>" : "") + "</div></div>";
}

function renderDays(ds, aird) {
  var host = $("days");
  if (!ds.length) { host.innerHTML = MR.empty("无数据"); return; }

  /* 区间条用 7 天的整体高温/低温做同一把尺子，才能横向比较长短 */
  var hi = -99, lo = 99, maxPr = 0;
  ds.forEach(function (d) {
    hi = Math.max(hi, +d.tempMax);
    lo = Math.min(lo, +d.tempMin);
    maxPr = Math.max(maxPr, +(d.precip || 0));
  });
  var span = Math.max(1, hi - lo);
  var anyRain = maxPr > 0;
  var aq = aqiByDay(aird);

  host.innerHTML = ds.map(function (d, i) {
    var dt = new Date((d.fxDate || "").replace(/-/g, "/"));
    var name = i === 0 ? "今天" : (i === 1 ? "明天" : "周" + WEEKS[dt.getDay()]);
    var tmin = +d.tempMin, tmax = +d.tempMax;
    var bw = Math.max(6, (tmax - tmin) / span * 100);
    var bl = Math.min((tmin - lo) / span * 100, 100 - bw);

    var sky = d.textDay || "";
    if (d.textNight && d.textNight !== d.textDay) sky += "转" + d.textNight;

    var pr = +(d.precip || 0);
    var pct = maxPr > 0 ? Math.round(pr / maxPr * 100) : 0;
    var meta = pr > 0 ? '<em class="rain">☂️ ' + pr.toFixed(1) + " mm</em>"
                      : (anyRain ? "<em>☂️ —</em>" : "");

    var a = aq[(d.fxDate || "").slice(5)];
    var detail =
      '<div class="dt-rain"><span>☂️ 降水量</span>' +
      '<span class="rl"><i style="width:' + pct + '%"></i></span>' +
      "<b>" + pr.toFixed(1) + " mm</b></div>" +
      '<div class="dt-grid">' +
        dg("🌤️", "白天天气", icon(d.iconDay) + " " + (d.textDay || "-"), "") +
        dg("🌙", "夜间天气", icon(d.iconNight) + " " + (d.textNight || "-"), "") +
        dg("💧", "湿度", d.humidity, "%") +
        dg("🌬️", "白天风", (d.windDirDay || "-") + " " +
           (d.windScaleDay || "-") + "级", "") +
        dg("🌌", "夜间风", (d.windDirNight || "-") + " " +
           (d.windScaleNight || "-") + "级", "") +
        dg("☀️", "紫外线", (d.uvIndex || 0) + "（" + uvText(d.uvIndex) + "）", "") +
        dg("💨", "气压", d.pressure, "hPa") +
        dg("📊", "能见度", d.vis, "km") +
        dg("☁️", "云量", d.cloud, "%") +
        dg("🌅", "日出", d.sunrise || "-", "") +
        dg("🌇", "日落", d.sunset || "-", "") +
        (a ? '<div class="g" style="border-left:3px solid ' + (a.col || "transparent") +
             '"><div class="k">🫧 空气质量</div><div class="v" style="color:' +
             (AQ_INK[aqiLevel(a.v)] || "var(--fg2)") + '">AQI ' + esc(a.txt) +
             "<small>" + esc(a.cat) + "</small></div></div>" : "") +
      "</div>";

    return '<div class="day" onclick="toggleDay(this)">' +
      '<div class="d">' + name + "</div>" +
      '<div class="i">' + icon(d.iconDay) + "</div>" +
      '<div class="s">' + esc(sky) + "</div>" +
      '<div class="bar"><span style="left:' + bl.toFixed(1) +
        "%;width:" + bw.toFixed(1) + '%"></span></div>' +
      '<div class="r"><b>' + tmax + "°</b> / <i>" + tmin + "°</i></div>" +
      '<span class="arw">▶</span>' +
      (meta ? '<div class="meta">' + meta + "</div>" : "") +
      '<div class="detail">' + detail + "</div></div>";
  }).join("");
}

/* 点击展开日详情，同时只留一个展开 */
function toggleDay(el) {
  var was = el.classList.contains("open");
  var all = document.querySelectorAll("#days .day");
  for (var i = 0; i < all.length; i++) all[i].classList.remove("open");
  el.classList.remove("open");     // 不依赖 el 一定在查询结果里
  if (!was) el.classList.add("open");
}

/* ---------------- 主渲染 ---------------- */
function render(w) {
  if (!w || !w.ok) {
    var why = (w && w.msg) || "天气数据不可用";
    $("foot").textContent = why + " · 可点右上角刷新重试";
    $("hours").innerHTML = MR.empty("无数据");
    $("days").innerHTML = MR.empty("无数据");
    $("idx").innerHTML = MR.empty("无数据");
    return;
  }

  var n = (w.now && w.now.now) || {};
  setTzFrom(n.obsTime);

  $("loc").textContent = (w.name || w.loc || "—") +
    (n.obsTime ? " · " + n.obsTime.replace("T", " ").slice(5, 16) : "");
  $("temp").innerHTML = n.temp != null ? esc(n.temp) + '<i class="deg">°</i>' : "--";
  $("txt").textContent = (n.icon ? icon(n.icon) + " " : "") + (n.text || "—");
  $("feels").textContent = (n.feelsLike != null ? "体感 " + n.feelsLike + "°" : "") +
    (n.vis != null ? " · 能见度 " + n.vis + " km" : "");
  $("hum").textContent = n.humidity != null ? n.humidity + "%" : "—";
  $("wind").textContent = n.windDir || "—";
  $("scale").textContent = n.windScale ? n.windScale + " 级" : "—";
  $("press").textContent = n.pressure ? n.pressure : "—";

  /* 预警 */
  renderWarn(normAlerts(w.warning));

  /* 空气质量 */
  var air = w.air || {};
  var main = pickIdx(air.indexes);
  if (main && !isNaN(+main.aqi)) {
    var lv = String(main.level || aqiLevel(main.aqi));
    var c = AQ_COLOR[lv] || "#8b949e";
    var tile = $("aqiTile");
    tile.style.background = c;
    tile.style.color = aqiFg(lv);
    $("aqi").textContent = main.aqiDisplay || main.aqi;
    $("aqiCat").textContent = main.category || "空气质量";
    $("aqiCat").style.color = AQ_INK[lv] || "var(--fg)";
    $("aqiAdv").textContent = aqiAdvice(+main.aqi);
  } else {
    $("aqiCat").textContent = "暂无空气数据";
    $("aqiAdv").textContent = "路由器的 W_LAT / W_LON 未配置时会拿不到空气数据";
  }
  $("poll").innerHTML = (air.pollutants || []).map(function (p) {
    var cv = p.concentration && p.concentration.value;
    if (cv == null) return "";
    var un = (p.concentration && p.concentration.unit) || "";
    var si = pickIdx(p.subIndexes);
    var pc = si ? (AQ_COLOR[aqiLevel(si.aqi)] || "transparent") : "transparent";
    return '<div class="p" style="border-left-color:' + pc + '">' +
      '<div class="n">' + esc(POLL_NAME[p.code] || p.name || p.code) + "</div>" +
      '<div class="v">' + (Math.round(cv * 10) / 10) + "</div>" +
      '<div class="u">' + esc(un) + "</div></div>";
  }).join("");
  drawAq24(w.airh);

  /* 24 小时 */
  var hs = (w.hourly && w.hourly.hourly) || [];
  $("hours").innerHTML = hs.map(function (h) {
    return '<div class="hour"><div class="h">' +
      esc((h.fxTime || "").substr(11, 5)) + '</div><div class="t">' +
      esc(h.temp) + '°</div><div class="s">' + esc(h.text || "") + "</div></div>";
  }).join("") || MR.empty("无数据");
  draw24(hs);

  /* 7 天 */
  var ds = (w.daily && w.daily.daily) || [];
  renderDays(ds, w.aird);
  draw7(ds);

  /* 生活指数 */
  var ix = (w.indices && w.indices.daily) || [];
  $("idx").innerHTML = ix.map(function (x) {
    return '<div class="it"><b>' + esc(x.name) + "</b><span>" +
      esc(x.category) + "</span>" +
      (x.text ? "<p>" + esc(x.text) + "</p>" : "") + "</div>";
  }).join("") || MR.empty("无数据");

  var ts = w.ts ? new Date(Number(w.ts) * 1000) : null;
  $("foot").textContent = ts
    ? "更新于 " + MR.hhmm(ts) + " · 路由器缓存 3 小时 · 来源 和风天气"
    : "来源 和风天气";
}

/* ---------------- 历史数据：板子后台取，页面轮询等它 ---------------- */
function loadHist(tries) {
  var host = $("chartHist");
  tries = tries || 0;
  return MR.api("/api/weatherhist").then(function (h) {
    if (h && h.ok && h.days && h.days.length) {
      HIST = h;
      drawHist();
      return;
    }
    /* 板子正在后台串行取 7 天，最长要十几秒；这时只能等 */
    if (tries < 8) {
      host.innerHTML = MR.empty(h && h.pending ? "历史数据准备中，正在后台获取…" : "历史数据暂不可用");
      setTimeout(function () { loadHist(tries + 1); }, 4000);
    } else {
      host.innerHTML = MR.empty((h && h.msg) || "历史数据不可用");
    }
  }).catch(function () {
    if (tries < 3) setTimeout(function () { loadHist(tries + 1); }, 4000);
    else host.innerHTML = MR.empty("历史数据加载失败");
  });
}

function load(silent, retried) {
  var b = $("btnRefresh");
  if (!silent) {
    b.classList.add("spin");
    b.disabled = true;
  }
  return MR.api("/api/weather").then(function (w) {
    if (w && w.ok) {
      render(w);
      $("updAt").textContent = "更新于 " + MR.hhmm(new Date());
      return;
    }
    render(w);
    /* 板子刚重启、路由器 CGI 偶发超时都会走到这里：先自动重试一次再下结论 */
    if (!retried) {
      $("foot").textContent = "首次取数失败，正在自动重试…";
      setTimeout(function () { load(true, true); }, 1500);
    }
  }).catch(function () {
    if (!retried) {
      $("foot").textContent = "连接失败，正在自动重试…";
      setTimeout(function () { load(true, true); }, 1500);
      return;
    }
    $("foot").textContent = "取数失败：检查 ESP32 与路由器的连通性";
  }).then(function () {
    b.classList.remove("spin");
    b.disabled = false;
  });
}

$("btnRefresh").addEventListener("click", function () {
  load(false);
  loadHist(0);
});

load(true);
loadHist(0);
setInterval(function () { load(true); }, 600000);
</script>
</body>
</html>
