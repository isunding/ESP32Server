<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>天气 · ESP32 终端服务器</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="/theme.css?v=20261107d">
<style>
  .pgtop{display:flex;align-items:center;gap:10px;margin:0 0 10px}
  .pgtop .upd{margin-left:auto;font-size:11.5px;color:var(--fg2)}
  #btnRefresh{flex:0 0 auto;display:inline-flex;align-items:center;gap:6px}
  #btnRefresh .ic{display:inline-block;font-size:14px;line-height:1}
  #btnRefresh.spin{opacity:.65;pointer-events:none}
  #btnRefresh.spin .ic{animation:sp .8s linear infinite}
  @keyframes sp{to{transform:rotate(360deg)}}
  /* 路由器原始天气页入口 */
  .srcbar{display:flex;align-items:center;gap:10px;padding:12px 14px;margin-top:14px;
    background:var(--bg2);border:1px solid var(--line);border-radius:var(--radius);
    color:var(--fg);text-decoration:none;transition:.15s}
  .srcbar:hover{border-color:var(--acc)}
  .srcbar .ic{width:30px;height:30px;flex:0 0 30px;border-radius:9px;
    display:flex;align-items:center;justify-content:center;
    background:var(--bg3);color:var(--acc);font-size:15px}
  .srcbar .tx{flex:1;min-width:0;display:flex;flex-direction:column}
  .srcbar .tx b{font-size:13px;font-weight:600}
  .srcbar .tx small{font-size:11.5px;color:var(--fg2);
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .srcbar .go{color:var(--fg2);font-size:18px}
</style>
</head>
<body>

<div id="topbar"></div>

<div class="wrap">
  <div class="pgtop">
    <span class="upd" id="updAt"></span>
    <button class="btn" id="btnRefresh"><span class="ic">↻</span>刷新</button>
  </div>

  <div class="card" id="warnCard">
    <h2>气象预警</h2>
    <div class="warn-bar"><span class="ok-dot"></span>正在检查…</div>
  </div>

  <div class="card">
    <div class="now">
      <div class="loc" id="loc">—</div>
      <div class="big">
        <div class="temp" id="temp">--</div>
        <div class="txt" id="txt">—</div>
      </div>
      <div class="feels" id="feels">—</div>
      <div class="metrics">
        <div class="metric"><div class="k">湿度</div><div class="v" id="hum">—</div></div>
        <div class="metric"><div class="k">风向</div><div class="v" id="wind">—</div></div>
        <div class="metric"><div class="k">风力</div><div class="v" id="scale">—</div></div>
        <div class="metric"><div class="k">气压</div><div class="v" id="press">—</div></div>
      </div>
    </div>
  </div>

  <div class="card">
    <h2>空气质量</h2>
    <div class="aq">
      <div class="tile-aqi" id="aqiTile"><b id="aqi">--</b><small>AQI</small></div>
      <div class="info">
        <div class="cat" id="aqiCat">—</div>
        <div class="adv" id="aqiAdv">—</div>
      </div>
    </div>
    <div class="poll" id="poll"></div>
  </div>

  <div class="card">
    <h2>未来 24 小时</h2>
    <div class="hours" id="hours"><span class="muted small">加载中…</span></div>
  </div>

  <div class="card">
    <h2>未来 7 天</h2>
    <div id="days"><span class="muted small">加载中…</span></div>
  </div>

  <div class="card">
    <h2>生活指数</h2>
    <div class="idx" id="idx"><span class="muted small">加载中…</span></div>
  </div>

  <a class="srcbar" id="routerWx" href="http://10.0.0.1/manage/weather/"
     target="_blank" rel="noopener noreferrer">
    <span class="ic">↗</span>
    <span class="tx"><b>打开路由器天气页</b><small id="routerWxHost">10.0.0.1/manage/weather/</small></span>
    <span class="go">›</span>
  </a>

  <p class="foot" id="foot">—</p>
</div>

<script src="/ui.js?v=20261107d"></script>
<script>
MR.mountTop("天气");

/* 路由器地址从 /api/health 动态取：换网段、改配置都不用动页面 */
MR.healthTick().then(function (h) {
  var host = (h && h.router && h.router.host) || "10.0.0.1";
  MR.$("routerWx").href = "http://" + host + "/manage/weather/";
  MR.$("routerWxHost").textContent = host + "/manage/weather/ · 原始配置与数据源";
}).catch(function () {});

function aqiColor(a) {
  if (a <= 50) return "#3fb950";
  if (a <= 100) return "#c9a227";
  if (a <= 150) return "#e07000";
  if (a <= 200) return "#d1242f";
  if (a <= 300) return "#8b2f8b";
  return "#6e1b1b";
}
function aqiAdvice(a) {
  if (a <= 50) return "空气质量令人满意，可正常户外活动。";
  if (a <= 100) return "空气质量可接受，极少数敏感人群应减少户外活动。";
  if (a <= 150) return "易感人群症状可能加重，建议减少长时间户外锻炼。";
  if (a <= 200) return "心脏、呼吸系统疾病患者不宜户外活动，一般人适量减少。";
  return "建议留在室内，关闭门窗，外出佩戴口罩。";
}

/* 兼容 v1（indexes[]）与旧版（now.aqi）两种结构 */
function pickAqi(w) {
  var air = w.air || {};
  if (air.indexes && air.indexes.length) {
    var x = air.indexes[0];
    return { aqi: Number(x.aqi), cat: x.category || "", level: x.level };
  }
  if (air.now && air.now.aqi != null) {
    return { aqi: Number(air.now.aqi), cat: air.now.category || "" };
  }
  return null;
}

function pickPollutants(w) {
  var air = w.air || {};
  var out = [];
  if (air.pollutants && air.pollutants.length) {
    air.pollutants.forEach(function (p) {
      var v = (p.concentration && p.concentration.value) || p.concentration;
      out.push({ n: p.name || p.code, v: v, u: (p.concentration && p.concentration.unit) || "" });
    });
  }
  return out.slice(0, 6);
}

function render(w) {
  if (!w || !w.ok) {
    var why = (w && w.msg) || "天气数据不可用";
    MR.$("foot").textContent = why + " · 可点右上角刷新重试";
    MR.$("hours").innerHTML = MR.empty("无数据");
    MR.$("days").innerHTML = MR.empty("无数据");
    return;
  }

  MR.$("loc").textContent = w.name || w.loc || "—";
  var n = (w.now && w.now.now) || {};
  MR.$("temp").innerHTML = n.temp != null
    ? MR.esc(n.temp) + '<i class="deg">°</i>'
    : "--";
  MR.$("txt").textContent = n.text || "—";
  MR.$("feels").textContent = n.feelsLike != null ? "体感 " + n.feelsLike + "°" : "";
  MR.$("hum").textContent = n.humidity != null ? n.humidity + "%" : "—";
  MR.$("wind").textContent = n.windDir || "—";
  MR.$("scale").textContent = n.windScale ? n.windScale + " 级" : "—";
  MR.$("press").textContent = n.pressure ? n.pressure : "—";

  /* 预警 */
  var ws = (w.warning && w.warning.warning) || [];
  var wc = MR.$("warnCard");
  if (ws.length) {
    var mm = ws.map(function (x, i) {
      var lv = String(x.severityColor || "").toLowerCase();
      var color = lv === "red" || lv === "black" ? "#d1242f" : lv === "orange" ? "#e07000" :
        lv === "yellow" ? "#b8860b" : "#1f6feb";
      return '<div class="warn-item" style="border-left-color:' + color + '">' +
        '<div class="hd"><span class="lv" style="background:' + color + '">' +
        MR.esc(x.severity || x.level || "预警") + '</span><span class="ti">' +
        MR.esc(x.title || x.typeName || "") + "</span></div>" +
        '<div class="bd">' + MR.esc(x.text || "") + "</div>" +
        '<div class="mt">' + MR.esc((x.pubTime || "").replace("T", " ").substr(0, 16)) + "</div></div>";
    }).join("");
    wc.innerHTML = "<h2>气象预警（" + ws.length + "）</h2>" + mm;
  } else {
    wc.innerHTML = '<h2>气象预警</h2><div class="warn-bar"><span class="ok-dot"></span>当前无生效预警</div>';
  }

  /* 空气 */
  var a = pickAqi(w);
  if (a && !isNaN(a.aqi)) {
    var c = aqiColor(a.aqi);
    var tile = MR.$("aqiTile");
    tile.style.background = c;
    MR.$("aqi").textContent = a.aqi;
    MR.$("aqiCat").textContent = a.cat || "空气质量";
    MR.$("aqiCat").style.color = c;
    MR.$("aqiAdv").textContent = aqiAdvice(a.aqi);
  } else {
    MR.$("aqiCat").textContent = "暂无空气数据";
    MR.$("aqiAdv").textContent = "检查 weather.conf 里的 W_LAT / W_LON 是否配置（缺省会 404）";
  }
  var ps = pickPollutants(w);
  MR.$("poll").innerHTML = ps.map(function (p) {
    return '<div class="p"><div class="n">' + MR.esc(p.n) + '</div><div class="v">' +
      MR.esc(p.v) + '</div><div class="u">' + MR.esc(p.u) + "</div></div>";
  }).join("");

  /* 24 小时 */
  var hs = (w.hourly && w.hourly.hourly) || [];
  MR.$("hours").innerHTML = hs.map(function (h) {
    return '<div class="hour"><div class="h">' + MR.esc((h.fxTime || "").substr(11, 5)) +
      '</div><div class="t">' + MR.esc(h.temp) + '°</div><div class="s">' +
      MR.esc(h.text || "") + "</div></div>";
  }).join("") || MR.empty("无数据");

  /* 7 天 */
  var ds = (w.daily && w.daily.daily) || [];
  MR.$("days").innerHTML = ds.map(function (d) {
    var pop = d.pop != null && Number(d.pop) > 0 ? " · 降水 " + d.pop + "%" : "";
    return '<div class="day"><div class="d">' + MR.mmdd(d.fxDate || d.fxTime) + '</div>' +
      '<div class="s">' + MR.esc(d.textDay || "") + pop + '</div>' +
      '<div class="r"><i>' + MR.esc(d.tempMin) + '°</i> / <b>' + MR.esc(d.tempMax) + "°</b></div></div>";
  }).join("") || MR.empty("无数据");

  /* 指数 */
  var ix = (w.indices && w.indices.daily) || [];
  MR.$("idx").innerHTML = ix.map(function (x) {
    return '<div class="it"><b>' + MR.esc(x.name) + "</b><span>" + MR.esc(x.category) + "</span></div>";
  }).join("") || MR.empty("无数据");

  var ts = w.ts ? new Date(w.ts * 1000) : null;
  MR.$("foot").textContent = ts
    ? "更新于 " + MR.hhmm(ts) + " · 路由器缓存 3 小时 · 来源 和风天气"
    : "来源 和风天气";
}

function load(silent, retried) {
  var b = MR.$("btnRefresh");
  if (!silent) {
    b.classList.add("spin");
    b.disabled = true;
  }
  return MR.api("/api/weather").then(function (w) {
    if (w && w.ok) {
      render(w);
      var t = new Date();
      MR.$("updAt").textContent = "更新于 " + MR.hhmm(t);
      return;
    }
    render(w);
    // 板子刚重启、路由器 CGI 偶发超时都会走到这里：自动重试一次再下结论，
    // 避免用户一进页面就只看到「不可用」。
    if (!retried) {
      MR.$("foot").textContent = "首次取数失败，正在自动重试…";
      setTimeout(function () { load(true, true); }, 1500);
    }
  }).catch(function () {
    if (!retried) {
      MR.$("foot").textContent = "连接失败，正在自动重试…";
      setTimeout(function () { load(true, true); }, 1500);
      return;
    }
    MR.$("foot").textContent = "取数失败：检查 ESP32 与路由器的连通性";
  }).then(function () {
    b.classList.remove("spin");
    b.disabled = false;
  });
}

MR.$("btnRefresh").addEventListener("click", function () { load(false); });

load(true);
setInterval(function () { load(true); }, 600000);
</script>
</body>
</html>
